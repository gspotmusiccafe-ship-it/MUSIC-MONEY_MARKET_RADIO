   /* 80s Boombox Aesthetic */
:root {
    --plastic-dark: #1a1a1a;
    --plastic-light: #2d2d2d;
    --knob-bg: #333;
    --display-glow: #00ff41;
}

body {
    background: #111;
    font-family: 'Courier New', Courier, monospace; /* Dot-matrix feel */
}

/* 3D Panel Bevel */
.panel {
    background: var(--plastic-dark);
    border: 3px solid #444;
    border-top-color: #666;
    border-left-color: #666;
    box-shadow: 10px 10px 20px rgba(0,0,0,0.8), inset 2px 2px 5px #444;
    border-radius: 8px;
}

/* The Tape Display */
#vault-display {
    background: #000;
    border: 4px inset #333;
    color: var(--display-glow);
    text-shadow: 0 0 8px var(--display-glow);
    padding: 10px;
    letter-spacing: 4px;
}

/* Tactile Knobs */
.knob {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #666, #222);
    box-shadow: 3px 3px 6px #000, inset 1px 1px 2px #999;
    cursor: pointer;
}

/* Analog Switch */
.switch {
    width: 20px;
    height: 40px;
    background: #444;
    border: 2px solid #222;
    margin: 5px;
    display: inline-block;
}

/* Vintage Button Feel */
.btn-buy {
    background: linear-gradient(180deg, #333, #111);
    border: 2px solid #555;
    text-shadow: 1px 1px 1px #000;
    transition: transform 0.1s;
}

.btn-buy:active {
    transform: translateY(2px);
    border-style: inset;
}

/* Dot-matrix Ticker */
.ticker-wrap {
    background: #000;
    border: 4px ridge #555;

        function updateTradingFloor(assets) {
            const tbody = document.getElementById('market-body');
            tbody.innerHTML = ''; 
            assets.forEach(asset => {
                const row = `
                    <tr class="border-b border-gray-800 hover:bg-black transition">
                        <td class="p-3 font-bold text-white">${asset.name || 'Asset'} (${asset.ticker || '???'})</td>
                        <td class="font-bold">$${parseFloat(asset.price || 0).toFixed(2)}</td>
                        <td class="${parseFloat(asset.roi) >= 0 ? 'text-green-500' : 'text-red-500'} font-bold">${asset.roi || 0}%</td>
                        <td class="text-gray-400">${asset.volume || 0}</td>
                        <td><button class="px-4 py-1 btn-buy rounded text-[10px] font-bold">BUY</button></td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        }

        function updateTicker(assets) {
            const ticker = document.getElementById('ticker-content');
            let content = '';
            assets.forEach(asset => {
                content += `<span class="mx-8">$${asset.ticker || '???'} ${asset.roi || 0}% ▲</span>`;
            });
            ticker.innerHTML = content;
        }

        // Kinetic Calculator
        document.addEventListener('input', () => {
            const buyIn = parseFloat(document.getElementById('calc-buyin').value) || 0;
            const roi = parseFloat(document.getElementById('calc-roi').value) || 0;
            const result = buyIn + (buyIn * (roi / 100));
            document.getElementById('calc-result').innerText = `$${result.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        });

   <script>
    // 1. Dynamic manifest loader
    let radio = { manifest: null, currentTrack: 0, isLocked: false };

    async function initRadio() {
        try {
            const response = await fetch('radio-manifest.json');
            radio.manifest = await response.json();
            document.getElementById('vault-display').innerText = radio.manifest.artist;
            document.getElementById('album-art').src = radio.manifest.albumArt;
            
            // Setup Player
            const audio = document.getElementById('main-audio');
            audio.src = radio.manifest.playlist[0].src;
        } catch(e) { console.log("Manifest not found, check radio-manifest.json"); }
    }

    // 2. Play/Pause/Lock logic
    const audio = document.getElementById('main-audio');
    document.getElementById('play-btn').onclick = () => {
        if(!radio.isLocked) audio.play();
    };

    audio.onended = () => {
        radio.currentTrack++;
        if (radio.currentTrack < radio.manifest.playlist.length) {
            audio.src = radio.manifest.playlist[radio.currentTrack].src;
            audio.play();
        } else {
            lockRadio();
        }
    };

    function lockRadio() {
        radio.isLocked = true;
        const btn = document.getElementById('play-btn');
        btn.disabled = true;
        btn.innerText = "LOCKED // PURCHASE REQUIRED";
    }

    // 3. Affiliate tracking
    const ref = new URLSearchParams(window.location.search).get('ref') || 'DIRECT';
    document.getElementById('btn-purchase').href += `?ref=${ref}`;

    initRadio();
</script>
