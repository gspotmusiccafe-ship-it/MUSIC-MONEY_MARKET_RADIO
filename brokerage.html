<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MONEY MARKET BROKERAGE | Market Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #0a0a0a; color: #00ff41; }
        .ticker-wrap { background: #111; border-bottom: 2px solid #333; overflow: hidden; }
        .ticker-move { display: flex; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .panel { border: 1px solid #333; background: #161616; border-radius: 4px; }
        .btn-buy { background: #008000; color: white; }
        .btn-sell { background: #b22222; color: white; }
        input { background: #222; border: 1px solid #444; color: #00ff41; padding: 8px; }
    </style>
</head>
<body class="p-4">

    <div class="ticker-wrap p-2 mb-6">
        <div class="ticker-move text-sm font-bold uppercase">
            <span>INITIALIZING MARKET DATA...</span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 space-y-6">
            <div class="panel p-4">
                <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">LIVE TRADING FLOOR</h2>
                <table class="w-full text-left text-sm">
                    <thead class="text-gray-500 uppercase">
                        <tr>
                            <th class="p-2">Asset Ticker</th>
                            <th>Current Price</th>
                            <th>ROI (Closing)</th>
                            <th>Volume</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="market-body">
                        </tbody>
                </table>
            </div>

            <div class="panel p-4">
                <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">MARKET ACTIVITY (LEDGER)</h2>
                <div class="h-64 overflow-y-auto text-xs space-y-2" id="ledger-output">
                    <p class="text-gray-500">[SYSTEM] Brokerage Terminal Connected to Central Bank...</p>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="panel p-4 border-l-4 border-green-600">
                <h2 class="text-xl font-bold mb-4">BANKER'S DESK</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400">Vault Balance</label>
                        <div class="text-3xl font-bold text-white" id="vault-display">$0.00</div>
                    </div>
                    <hr class="border-gray-800">
                    <div class="flex flex-col gap-2">
                        <button class="w-full py-3 font-bold btn-buy rounded">EXECUTE SETTLEMENT</button>
                        <button class="w-full py-3 font-bold border border-gray-600 rounded">MANAGE TRUSTS</button>
                    </div>
                </div>
            </div>

            <div class="panel p-4 border-l-4 border-yellow-500">
                <h2 class="text-lg font-bold mb-2">KINETIC CALCULATOR</h2>
                <div class="flex flex-col gap-2">
                    <input type="number" id="calc-buyin" placeholder="Enter Buy-In Amount">
                    <input type="number" id="calc-roi" placeholder="Current ROI %">
                    <div class="mt-2 text-sm">
                        Projected Payout: <span class="text-white font-bold" id="calc-result">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycby5Ecd_jJ1HEAUnZPeiXsEcBqJXigrkmb3oY38ioc-4d_bQKyc8Qy_INL3hwMxLeg/exec';

        async function fetchMarketData() {
            try {
                const response = await fetch(SHEETS_API_URL);
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    console.log("No data found in the Sheet.");
                    return;
                }

                updateTradingFloor(data);
                updateTicker(data);
            } catch (error) {
                console.error("Brokerage Sync Error:", error);
            }
        }

        function updateTradingFloor(assets) {
            const tbody = document.getElementById('market-body');
            if (!tbody) return;
            tbody.innerHTML = ''; 
            
            assets.forEach(asset => {
                const name = asset.name || "Asset";
                const ticker = asset.ticker || "???";
                const price = asset.price ? parseFloat(asset.price).toFixed(2) : "0.00";
                const roi = asset.roi || "0.0";
                const vol = asset.volume || "0";

                const row = `
                    <tr class="border-b border-gray-800">
                        <td class="p-2 font-bold">${name} (${ticker})</td>
                        <td>$${price}</td>
                        <td class="${parseFloat(roi) >= 0 ? 'text-green-500' : 'text-red-500'}">${roi}%</td>
                        <td>${vol}</td>
                        <td><button class="px-3 py-1 btn-buy rounded text-xs">BUY</button></td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        }

        function updateTicker(assets) {
            const tickerContainer = document.querySelector('.ticker-move');
            if (!tickerContainer) return;
            let tickerHTML = '';
            assets.forEach(asset => {
                if (asset.ticker) {
                    tickerHTML += `<span class="mx-8">$${asset.ticker} ${asset.roi || 0}% ▲</span>`;
                }
            });
            tickerContainer.innerHTML = tickerHTML;
        }

        // Kinetic Calculator Logic
        document.addEventListener('input', () => {
            const buyIn = parseFloat(document.getElementById('calc-buyin').value) || 0;
            const roi = parseFloat(document.getElementById('calc-roi').value) || 0;
            const result = buyIn + (buyIn * (roi / 100));
            document.getElementById('calc-result').innerText = `$${result.toFixed(2)}`;
        });

        // Auto-refresh every 30 seconds
        setInterval(fetchMarketData, 30000);
        fetchMarketData(); 
    </script>
</body>
</html>
