<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MONEY MARKET BROKERAGE | Market Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root {
            --neon: #00ff41;
            --gold: #ffd700;
        }
        body { font-family: 'JetBrains+Mono', monospace; background-color: #0a0a0a; color: var(--neon); }
        .ticker-wrap { background: #111; border-bottom: 2px solid #333; overflow: hidden; }
        .ticker-move { display: flex; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .panel { border: 1px solid #333; background: #161616; border-radius: 4px; box-shadow: 0 0 15px rgba(0,255,65,0.05); }
        .btn-buy { background: #008000; color: white; transition: 0.3s; }
        .btn-buy:hover { background: #00a500; box-shadow: 0 0 10px #00ff41; }
        input { background: #222; border: 1px solid #444; color: var(--neon); padding: 8px; border-radius: 4px; }
    </style>
</head>
<body class="p-4">

    <div class="ticker-wrap p-2 mb-6">
        <div id="ticker-content" class="ticker-move text-sm font-bold uppercase">
            <span>INITIALIZING CONNECTION TO CENTRAL BANK...</span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 space-y-6">
            <div class="panel p-4">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-bold italic text-white">LIVE TRADING FLOOR</h2>
                    <span class="text-xs animate-pulse text-gray-500">● LIVE MARKET DATA</span>
                </div>
                <table class="w-full text-left text-sm">
                    <thead class="text-gray-500 uppercase text-xs">
                        <tr>
                            <th class="p-2">Asset Ticker</th>
                            <th>Current Price</th>
                            <th>ROI</th>
                            <th>Volume</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="market-body">
                        </tbody>
                </table>
            </div>

            <div class="panel p-4">
                <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2 text-white">MARKET ACTIVITY</h2>
                <div class="h-48 overflow-y-auto text-xs space-y-2 font-mono" id="ledger-output">
                    <p class="text-gray-600">[SYSTEM] Terminal initialized. Awaiting block settlement...</p>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="panel p-6 border-l-4 border-green-600">
                <h2 class="text-xl font-bold mb-4 text-white">BANKER'S DESK</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400">Current Liquidity Vault</label>
                        <div class="text-3xl font-bold text-white tracking-tighter" id="vault-display">$124,500.00</div>
                    </div>
                    <hr class="border-gray-800">
                    <div class="flex flex-col gap-2">
                        <button class="w-full py-3 font-bold btn-buy rounded text-sm uppercase">Execute Settlement</button>
                        <button class="w-full py-3 font-bold border border-gray-600 rounded text-sm uppercase hover:bg-gray-800">Manage Trusts</button>
                    </div>
                </div>
            </div>

            <div class="panel p-6 border-l-4 border-yellow-500">
                <h2 class="text-lg font-bold mb-2 text-white">KINETIC CALCULATOR</h2>
                <div class="flex flex-col gap-3">
                    <input type="number" id="calc-buyin" placeholder="Enter Buy-In Amount">
                    <input type="number" id="calc-roi" placeholder="Current ROI %">
                    <div class="mt-2 text-xs text-gray-400 uppercase">
                        Projected Payout: <span class="text-white font-bold text-lg block" id="calc-result">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycby5Ecd_jJ1HEAUnZPeiXsEcBqJXigrkmb3oY38ioc-4d_bQKyc8Qy_INL3hwMxLeg/exec';

        async function fetchMarketData() {
            try {
                const response = await fetch(SHEETS_API_URL);
                const data = await response.json();
                if (!data || data.length === 0) return;
                updateTradingFloor(data);
                updateTicker(data);
            } catch (error) {
                console.error("Brokerage Sync Error:", error);
            }
        }

        function updateTradingFloor(assets) {
            const tbody = document.getElementById('market-body');
            tbody.innerHTML = ''; 
            assets.forEach(asset => {
                const row = `
                    <tr class="border-b border-gray-800 hover:bg-black transition">
                        <td class="p-3 font-bold text-white">${asset.name || 'Asset'} (${asset.ticker || '???'})</td>
                        <td class="font-bold">$${parseFloat(asset.price || 0).toFixed(2)}</td>
                        <td class="${parseFloat(asset.roi) >= 0 ? 'text-green-500' : 'text-red-500'} font-bold">${asset.roi || 0}%</td>
                        <td class="text-gray-400">${asset.volume || 0}</td>
                        <td><button class="px-4 py-1 btn-buy rounded text-[10px] font-bold">BUY</button></td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        }

        function updateTicker(assets) {
            const ticker = document.getElementById('ticker-content');
            let content = '';
            assets.forEach(asset => {
                content += `<span class="mx-8">$${asset.ticker || '???'} ${asset.roi || 0}% ▲</span>`;
            });
            ticker.innerHTML = content;
        }

        // Kinetic Calculator
        document.addEventListener('input', () => {
            const buyIn = parseFloat(document.getElementById('calc-buyin').value) || 0;
            const roi = parseFloat(document.getElementById('calc-roi').value) || 0;
            const result = buyIn + (buyIn * (roi / 100));
            document.getElementById('calc-result').innerText = `$${result.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        });

        setInterval(fetchMarketData, 30000);
        fetchMarketData();
    </script>
</body>
</html>
