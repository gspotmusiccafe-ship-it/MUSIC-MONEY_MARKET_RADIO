<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONGSHARE MARKET - GLOBAL EXCHANGE</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; }
        #stock-terminal { border: 2px solid #0ff; max-width: 420px; margin: 20px auto; padding: 15px; background: rgba(5,5,5,0.9); box-shadow: 0 0 20px #0ff; }
        .ticker { font-size: 1.5rem; padding: 15px; background: #111; margin-bottom: 10px; font-weight: bold; color: #0f0; }
        .exec-btn { width: 45%; padding: 15px; font-weight: bold; cursor: pointer; border: none; }
        #buy-btn { background: #0f0; color: #000; }
        #sell-btn { background: #f00; color: #000; }
        .asset-view { width: 100%; height: 300px; background-size: cover; border: 1px solid #333; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="stock-terminal">
        <div class="ticker" id="oscillator">LOADING EXCHANGE...</div>
        <button class="exec-btn" id="buy-btn" onclick="executeTrade('BUY')">BUY STOCK</button>
        <button class="exec-btn" id="sell-btn" onclick="executeTrade('SELL')">SELL/TRADE</button>
        <div class="asset-view" id="display"></div>
    </div>
    <script>
        // Your 5-Tier logic is preserved here
        const _F = 0.25; const MIN = 10;
        function executeTrade(type) {
            if(type === 'BUY') alert("REDIRECTING TO SETTLEMENT");
            else alert("GROWTH QUEUE: MATURING");
        }
    </script>
</body>
</html>
