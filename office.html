<!DOCTYPE html>
<html>
<head>
    <title>AITITRADE - SETTLEMENT DESK</title>
    <style>
        body { background: #050505; color: #0f0; font-family: monospace; padding: 20px; }
        .bank-header { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { border: 1px solid #0f0; padding: 20px; background: #111; box-shadow: 0 0 10px #0f0; text-align: center; }
        .stat-label { font-size: 0.8rem; color: #0ff; margin-bottom: 5px; }
        .stat-value { font-size: 2rem; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #222; color: #0ff; }
        .tier-tag { color: #f0f; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AITITRADE BACK OFFICE // SETTLEMENT DESK</h1>
    
    <div class="bank-header">
        <div class="stat-card">
            <div class="stat-label">PAYOUT BUDGET</div>
            <div class="stat-value">$522.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">SURPLUS BANK</div>
            <div class="stat-value">$478.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">MARKET VOLUME</div>
            <div id="total-vol" class="stat-value">$0.00</div>
        </div>
    </div>

    <h3>ACTIVE GROWTH QUEUE (45-60 DAY CYCLE)</h3>
    <table id="ledger-table">
        <thead>
            <tr>
                <th>ASSET</th>
                <th>TRADERS</th>
                <th>PRINCIPAL VOLUME</th>
                <th>LIABILITY (100% ROI)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
        const NEON_TOKEN = 'napi_qutng577yzv4avhqc8o08d737uwa04r7zngzwzpmfw8ac4ufjky7gdim9hrn14o0';
        const PROJECT_ID = 'crimson-haze-68570484';

        async function pullStats() {
            const sql = "SELECT asset_name, COUNT(*) as traders, SUM(principal_paid) as vol FROM settlement_desk GROUP BY asset_name";
            const response = await fetch(`https://console.neon.tech/api/v2/projects/${PROJECT_ID}/sql`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${NEON_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sql: sql })
            });
            const data = await response.json();
            render(data.results);
        }

        function render(results) {
            const tbody = document.querySelector('tbody');
            let total = 0;
            tbody.innerHTML = results.map(r => {
                total += parseFloat(r.vol);
                return `<tr>
                    <td>${r.asset_name}</td>
                    <td>${r.traders}</td>
                    <td class="tier-tag">$${parseFloat(r.vol).toFixed(2)}</td>
                    <td>$${(parseFloat(r.vol) * 2).toFixed(2)}</td>
                </tr>`;
            }).join('');
            document.getElementById('total-vol').innerText = `$${total.toFixed(2)}`;
        }
        window.onload = pullStats;
    </script>
</body>
</html>
