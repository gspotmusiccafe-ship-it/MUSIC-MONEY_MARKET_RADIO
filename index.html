<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MONEY MARKET // LIVE TERMINAL</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; text-transform: uppercase; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        .ticker-wrap { background: #000; border-bottom: 1px solid #333; height: 35px; overflow: hidden; display: flex; align-items: center; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 40s linear infinite; color: var(--gold); font-size: 0.85rem; }
        @keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        header { display: flex; justify-content: space-between; padding: 10px 15px; background: var(--panel); border-bottom: 2px solid #333; font-size: 0.75rem; font-weight: bold; }

        .dashboard { display: flex; flex: 1; width: 100%; overflow: hidden; }
        #watchlist { width: 240px; min-width: 240px; border-right: 1px solid #333; overflow-y: auto; background: #080808; padding: 12px; }
        #market-core { flex: 1; overflow-y: auto; padding: 12px; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        #radio-desk { width: 360px; min-width: 360px; padding: 15px; background: #0a0a0a; display: flex; flex-direction: column; }

        .chart-container { background: #000; border: 1px solid #333; height: 260px; position: relative; overflow: hidden; border-radius: 4px; }
        .grid-overlay { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size: 30px 30px; opacity: 0.3; }

        .market-stats { display: flex; justify-content: space-between; padding: 5px 10px; background: #111; border: 1px solid #222; font-size: 0.65rem; color: var(--gold); }
        #order-flow { height: 100px; background: #080808; border: 1px solid #222; overflow: hidden; font-size: 0.6rem; padding: 8px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }

        .asset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .data-card { background: #111; border: 1px solid #222; padding: 10px; text-align: center; font-size: 0.65rem; cursor: pointer; }

        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); margin-bottom: 10px; background-size: cover; background-position: center; background-color: #222; max-height: 280px; }
        .radio-controls { background: #151515; padding: 15px; border: 1px solid #333; text-align: center; border-radius: 4px; }
        .oscillator-main { font-size: 2.8rem; color: white; margin: 5px 0; font-weight: 900; letter-spacing: -1px; }

        .account-btn { background: var(--gold); color: #000; font-weight: 900; border: none; padding: 12px; width: 100%; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-bottom: 15px; font-size: 0.8rem; }
        button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; cursor: pointer; font-family: inherit; font-size: 0.7rem; width: 100%; font-weight: bold; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .buy-sell-master { background: var(--neon); color: black; font-size: 1rem; padding: 15px; margin-top: 5px; }
        
        .watch-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: 0.7rem; cursor: pointer; }
    </style>
</head>

    <section id="market-core">

        <div id="order-flow"></div>

            <div id="radio-roi" style="font-size:0.7rem; color:#888;">0% ROI</div>
            <div class="oscillator-main" id="main-osc">$0.00</div>
            
            <button onclick="sysNotify('EXECUTE')" class="buy-sell-master">BUY / SELL ASSET</button>

                <button onclick="playCurrent()">▶</button>

            </div>
        </div>
    </aside>
</div>
