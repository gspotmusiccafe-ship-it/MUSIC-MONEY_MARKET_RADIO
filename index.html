<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // MARKET TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; margin: 0; overflow: hidden; }

        /* --- THE UPGRADED MESSAGE BLOCK STYLE --- */
        .songshare-flash {
            background: #000;
            border: 2px solid var(--gold);
            margin: 15px 0;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.15);
        }

        .flash-header {
            background: var(--gold);
            color: #000;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.3rem;
            text-align: center;
            padding: 10px;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .flash-content { padding: 15px; color: #fff; }
        
        .flash-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 4px;
            font-size: 0.7rem;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .label { color: var(--gold); font-weight: 900; }
        .value { text-align: right; font-weight: 700; white-space: nowrap; }

        .benefit-tag {
            background: #111;
            color: #00ff00;
            font-size: 0.65rem;
            padding: 8px;
            margin-bottom: 4px;
            border-left: 3px solid #00ff00;
            font-weight: 700;
        }

        /* --- LAYOUT WRAPPER --- */
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: 100vh; }
        .side-col { background: #0a0a0a; border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        .main-col { padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #222; }
        
        #order-flow { flex-grow: 1; overflow-y: hidden; display: flex; flex-direction: column-reverse; gap: 5px; }
        .trade-row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid #111; opacity: 0.7; }
        
        .oscillator { font-size: 5rem; font-weight: 900; color: #fff; letter-spacing: -4px; text-align: center; line-height: 0.9; }
        .btn-gold { width: 100%; background: var(--gold); color: #000; font-weight: 900; padding: 15px; text-align: center; margin-bottom: 10px; cursor: pointer; border: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="dashboard">
    <aside class="side-col">
        <button class="btn-gold">OPEN MARKET TERMINAL</button>
        <div class="w-full aspect-square border-2 border-yellow-500 mb-6 bg-cover bg-center" style="background-image: url('https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982');"></div>
        <div class="oscillator" id="price">$1.00</div>
        <div id="status-line" class="text-center text-green-500 font-bold mt-2">▲ KINETIC PULSE</div>
    </aside>

    <main class="main-col">
        <div class="bg-[#000] border border-[#222] h-[250px] relative">
            <div class="absolute inset-0 flex items-center justify-center opacity-20 text-[10px]">KINETIC CHART ACTIVE</div>
        </div>
        <div id="order-flow"></div>
    </main>

    <aside class="side-col" style="border-left: 1px solid #222;">
        <div class="text-yellow-500 font-bold border-b border-[#222] pb-2 mb-4 text-xs">MARKET LEDGER</div>
        <div id="ledger" class="space-y-4 text-[10px]">
            <div class="flex justify-between"><span>SUPERFLY</span><span class="text-yellow-500">$1.00</span></div>
            <div class="flex justify-between"><span>LOVE MAKE OVER</span><span class="text-yellow-500">$1.00</span></div>
        </div>
        <div id="affiliate-status" class="mt-10 p-4 border border-dashed border-[#444] text-[9px] text-gray-500">
            PARTNER ID: <span id="partner-id" class="text-white">NONE_DIRECT</span>
        </div>
    </aside>
</div>

<script>
    // --- AFFILIATE TRACKING LOGIC ---
    const urlParams = new URLSearchParams(window.location.search);
    const refID = urlParams.get('ref') || localStorage.getItem('aitify_ref') || "DIRECT";
    if (refID !== "DIRECT") {
        localStorage.setItem('aitify_ref', refID);
        document.getElementById('partner-id').innerText = refID;
    }

    const songshareData = {
        title: "SONGSHARE OPPORTUNITY",
        stats: [
            ["SONGSHARE OFFERED", "QUEEN BUTTA"],
            ["SONGSHARE STATUS", "PRE-RELEASE"],
            ["RECORD LABEL", "G. SPOT RECORDS"],
            ["ARTIST NAME", "QUEEN BUTTA"],
            ["TITLE TRACK", "LOVE MAKE OVER"],
            ["PARTNER CAP", "50 RETAILERS"],
            ["INVESTMENT", "$100.00"]
        ],
        benefits: [
            "50% RETAIL SALES EARNINGS",
            "PERSONAL ID TRACKING APP",
            "25% MARKET ENGAGEMENT EARNINGS",
            "GLOBAL ROYALTY QUALIFICATION"
        ]
    };

    function inject() {
        const flow = document.getElementById('order-flow');
        const isLogic = Math.random() > 0.82;

        if (isLogic) {
            const flash = document.createElement('div');
            flash.className = 'songshare-flash';
            
            let statHtml = songshareData.stats.map(s => 
                `<div class="label">${s[0]}:</div><div class="value">${s[1]}</div>`
            ).join('');

            let benefitHtml = songshareData.benefits.map(b => 
                `<div class="benefit-tag">▶ ${b}</div>`
            ).join('');

            flash.innerHTML = `
                <div class="flash-header">${songshareData.title}</div>
                <div class="flash-content">
                    <div class="flash-grid">${statHtml}</div>
                    <div class="font-black text-[9px] text-yellow-500 mb-2 tracking-widest">PARTNER BENEFITS</div>
                    ${benefitHtml}
                </div>`;
            flow.appendChild(flash);
        } else {
            const row = document.createElement('div');
            row.className = 'trade-row';
            const up = Math.random() > 0.5;
            row.style.color = up ? "var(--neon)" : "var(--red)";
            row.innerHTML = `<span>RETAIL_MARKET_TICKER</span><span>$1.${Math.floor(Math.random()*99)}</span>`;
            flow.appendChild(row);
        }
        if (flow.children.length > 10) flow.removeChild(flow.firstChild);
    }

    setInterval(inject, 2000);
</script>

</body>
</html>
