        :root { --neon: #00ff41; --gold: #ffd700; --emerald: #062111; --red: #ff3131; }
        
        body {

        .gain { color: var(--neon); }

        /* THE WAVE */
        .osc-box { height: 60px; background: #000; position: relative; border-y: 1px solid #222; overflow: hidden; }
        
        /* CUSTOM PLAYER STYLING */
        audio::-webkit-media-controls-enclosure { background-color: #111; border-radius: 0; }
        audio::-webkit-media-controls-play-button { filter: invert(100%) sepia(100%) saturate(500%) hue-rotate(90deg); }
    </style>
</head>
