<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; overflow-x: hidden; }
        
        #init-overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .radio-console { width: 90%; max-width: 400px; padding: 40px; border: 4px double var(--gold); background: #0a0a0a; text-align: center; }
        
        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: calc(100vh - 60px); }
        
        @media (max-width: 1024px) {
            .dashboard { display: flex; flex-direction: column; height: auto; }
            .side-col, .main-col { width: 100% !important; height: auto !important; border: none; border-bottom: 2px solid #222; }
        }

        .side-col { background: #0a0a0a; border-right: 1px solid #333; overflow-y: auto; padding: 20px; }
        .main-col { background: var(--bg); border-right: 1px solid #333; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* THE CANDLES */
        .chart-box { background: #000; border: 1px solid #333; height: 300px; position: relative; border-radius: 4px; overflow: hidden; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px; z-index: 1; }
        .candle { width: 10px; border-radius: 1px; position: relative; min-height: 5px; transition: height 0.3s ease; }
        .wick { position: absolute; width: 2px; height: 140%; left: 4px; top: -20%; z-index: -1; }

        .oscillator-main { font-size: 4rem; color: white; font-weight: 900; letter-spacing: -4px; line-height: 0.9; }
        .album-art { width: 100%; aspect-ratio: 1; border: 3px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 20px; }
        
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 18px; width: 100%; text-align: center; border: none; display: block; margin-bottom: 12px; cursor: pointer; text-decoration: none; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 20px; width: 100%; text-align: center; border: none; display: block; font-size: 1rem; cursor: pointer; text-decoration: none; }
        
        /* THE BLOCK STYLE MESSAGE */
        .songshare-flash {
            background: #000;
            border: 3px solid var(--gold);
            margin: 20px 0;
            padding: 0;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
            animation: snap-in 0.2s ease-out;
        }
        .flash-header {
            background: var(--gold);
            color: #000;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            padding: 12px;
            letter-spacing: -1px;
        }
        .flash-content { padding: 20px; color: #fff; }
        .flash-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px; font-size: 0.8rem; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .benefit-tag { background: #111; color: var(--neon); font-size: 0.7rem; padding: 10px; margin-bottom: 5px; border-left: 4px solid var(--neon); font-weight: 900; }

        #order-flow { background: #080808; border: 1px solid #222; height: 350px; overflow-y: hidden; font-size: 0.75rem; padding: 15px; display: flex; flex-direction: column-reverse; gap: 8px; }
        .trade-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #111; opacity: 0.7; }
        @keyframes snap-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>

<div id="init-overlay">
