        :root { 
            --bloomberg-green: #00ff33; 
            --bloomberg-red: #ff3333; 
            --bloomberg-blue: #0066ff;
            --bg: #030303; 
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; text-transform: uppercase; margin: 0; overflow-x: hidden; }
        
        /* AUTH LANDING - FORCE TOP LAYER */
        #landing-page { 
            position: fixed; inset: 0; background: #000; z-index: 9999999 !important; 
            display: flex; align-items: center; justify-content: center; padding: 20px; 
        }
        .glass-card { 
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); 
            padding: 45px; width: 100%; max-width: 450px; border-radius: 12px; box-shadow: 0 0 60px rgba(0, 102, 255, 0.2);
            position: relative; z-index: 10000000;
        }

        /* BLOOMBERG GLASS BUTTONS */
        .btn-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            color: #fff; font-weight: 800; padding: 18px; border-radius: 4px;
            display: block; text-align: center; transition: 0.2s; cursor: pointer !important; text-decoration: none; letter-spacing: 2px;
            width: 100%; position: relative; z-index: 10000001;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.15); border-color: #fff; transform: translateY(-2px); }
        .btn-blue { color: var(--bloomberg-blue); border-color: var(--bloomberg-blue); background: rgba(0,102,255,0.1); }
        .btn-green { color: var(--bloomberg-green); border-color: var(--bloomberg-green); }

        /* LAYOUT */
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: calc(100vh - 40px); visibility: hidden; opacity: 0; transition: opacity 0.5s ease; }
        .dashboard.active { visibility: visible; opacity: 1; display: grid; }

        header { padding: 12px 25px; background: #000; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono'; }
        .side-col { background: #080808; border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        .main-col { background: var(--bg); border-right: 1px solid #222; padding: 20px; overflow-y: auto; }

        /* LEDGER SELECTOR */
        .ledger-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #1a1a1a; cursor: pointer; font-size: 11px; font-family: 'JetBrains Mono'; color: #666; }
        .ledger-row:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .ledger-row.playing { border-left: 3px solid var(--bloomberg-blue); color: #fff; background: rgba(0,102,255,0.1); }

        .oscillator { font-size: 4.2rem; font-weight: 900; letter-spacing: -3px; line-height: 1; text-align: center; }
        .input-field { background: #111; border: 1px solid #333; color: white; width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 4px; font-family: 'JetBrains Mono'; }
        
        marquee { background: #000; border-bottom: 1px solid #222; color: var(--bloomberg-green); font-family: 'JetBrains Mono'; padding: 8px; font-size: 11px; font-weight: bold; }
    </style>
</head>
