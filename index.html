<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MONEY MARKET // LIVE TERMINAL</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; text-transform: uppercase; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .ticker-wrap { background: #000; border-bottom: 1px solid #333; height: 35px; overflow: hidden; display: flex; align-items: center; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 20s linear infinite; color: var(--gold); font-size: 0.85rem; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { display: flex; justify-content: space-between; padding: 12px; background: var(--panel); border-bottom: 2px solid #333; font-size: 0.8rem; font-weight: bold; }
        .dashboard { display: flex; flex: 1; overflow: hidden; }

        #watchlist { width: 220px; border-right: 1px solid #333; overflow-y: auto; background: #080808; padding: 12px; }
        .watch-item { font-size: 0.7rem; padding: 10px 0; border-bottom: 1px solid #222; cursor: pointer; }

        #market-core { flex: 2; overflow-y: auto; padding: 20px; border-right: 1px solid #333; }
        .chart-container { background: #000; border: 1px solid #444; height: 220px; margin-bottom: 20px; position: relative; }
        .asset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .data-card { background: #111; border: 1px solid #333; padding: 12px; text-align: center; }

        #radio-desk { width: 350px; padding: 20px; background: #0a0a0a; display: flex; flex-direction: column; }
        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); margin-bottom: 15px; background: #222; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
        
        .radio-controls { background: #1a1a1a; padding: 15px; border: 1px solid #333; text-align: center; }
        .oscillator-main { font-size: 2.2rem; color: white; margin: 10px 0; font-weight: 900; letter-spacing: -2px; }

        .account-btn { background: var(--gold); color: #000; font-weight: 900; border: none; padding: 12px; width: 100%; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-bottom: 15px; font-size: 0.8rem; }
        button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 12px; cursor: pointer; font-family: inherit; font-size: 0.7rem; }
        button.prio { border-color: var(--gold); color: var(--gold); }

        @media (max-width: 900px) { .dashboard { flex-direction: column; overflow-y: auto; } #watchlist, #radio-desk { width: 100%; height: auto; } .asset-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<audio id="main-audio-engine" preload="auto"></audio>

<div class="ticker-wrap">
    <div class="ticker-move">
        $AIT-SCENE +18.4% || $AIT-SUPERFLY +5.2% || $AIT-ZODIAC +50.0% || $AIT-NEED +94.2% || $AIT-PREACHER +12.5%
    </div>
</div>

<header>
    <div>MUSIC MONEY MARKET// LIVE EXCHANGE</div>
    <div id="sys-status">SYSTEM: MONITORING...</div>
    <div style="color:var(--gold)">97.7 THE FLAME // LIVE</div>
</header>

<div class="dashboard">
    <aside id="watchlist">
        <div style="color: var(--gold); border-bottom: 1px solid var(--gold); margin-bottom: 10px; font-size: 0.8rem;">ASSET WATCH</div>
        <div id="list-target"></div>
    </aside>

    <section id="market-core">
        <div class="chart-container">

            </svg>
        </div>
        <div class="asset-grid" id="asset-cards"></div>
    </section>
