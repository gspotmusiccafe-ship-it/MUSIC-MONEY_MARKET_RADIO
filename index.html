<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        .check-container { background: #fdfaf0; width: 95vw; max-width: 400px; height: 95vh; border: 12px solid #555; padding: 10px; box-shadow: 0 10px 30px #000; display: flex; flex-direction: column; }
        
        .check-top { border: 4px solid #000; padding: 15px; flex-grow: 1; }
        
        /* BLOOMBERG GREEN GLASS TICKER */
        .ticker-wrap { background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; backdrop-filter: blur(5px); color: #00ff41; padding: 10px; margin: 10px 0; overflow: hidden; white-space: nowrap; font-weight: bold; text-shadow: 0 0 5px #00ff41; }
        .ticker { display: inline-block; animation: marquee 10s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-50%, 0); } }

        .stub { background: #e0e0e0; padding: 20px; border-top: 4px dashed #000; text-align: center; }
        .money-box { border: 3px solid #000; padding: 8px 12px; font-weight: bold; }
        .play-btn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #000; background: #fff; cursor: pointer; font-size: 25px; margin: 15px; }
        #rights { display: block; padding: 15px; background: #008000; color: #fff; text-decoration: none; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="check-container">
        <div class="check-top">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="width: 60px; height: 60px; border: 2px solid #000;"><img id="art" src="" style="width:100%;height:100%"></div>
                <div style="font-weight:900;">ROYALTY CHECK RADIO</div>
            </div>
            <div style="margin:20px 0;">PAY TO: LICENSEE <span class="money-box" id="money">$862.00</span></div>
            <div>MEMO: QUEEN BUTTA ROYALTIES</div>
        </div>

        <div class="ticker-wrap">
            <div class="ticker">
                #1 MUSIC MADE TO MONETIZE &nbsp;&nbsp;&nbsp; #2 A SONGSHARE VAULT EXCLUSIVE RELEASE &nbsp;&nbsp;&nbsp; 
                #1 MUSIC MADE TO MONETIZE &nbsp;&nbsp;&nbsp; #2 A SONGSHARE VAULT EXCLUSIVE RELEASE
            </div>
        </div>

        <div class="stub">
            <div id="info" style="font-size: 11px; font-weight: bold;">ARTIST: QUEEN BUTTA | SONG: SUPERFLY</div>
            <div style="margin:10px 0;">MARKET PRICE: <span id="market-price" style="border: 2px solid #000; padding: 3px;">$30.00</span> <span id="gain-loss"></span></div>
            <button id="play-btn" class="play-btn">▶</button>
            <a id="rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="audio"></audio>
    <script>
        const audio = document.getElementById('audio'), btn = document.getElementById('play-btn'), info = document.getElementById('info'), moneyBox = document.getElementById('money'), marketPrice = document.getElementById('market-price'), gainLoss = document.getElementById('gain-loss');
        let m = null, idx = 0;
        fetch('radio-manifest.json').then(r => r.json()).then(d => { m = d; audio.src = d.playlist[0].src; document.getElementById('art').src = d.albumArt; });
        btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); btn.innerText = audio.paused ? '▶' : '❚❚'; };
        setInterval(() => {
            moneyBox.innerText = '$' + (Math.floor(Math.random() * 900) + 100) + '.00';
            let change = (Math.random() * 2 - 1).toFixed(2);
            marketPrice.innerText = '$' + (Math.random() * 28 + 2).toFixed(2);
            gainLoss.innerText = (change >= 0 ? " ▲ +" : " ▼ ") + change;
            gainLoss.style.color = change >= 0 ? "#008000" : "#ff0000";
        }, 1000);
        audio.onended = () => {
            idx++;
            if(idx < 12 && idx < m.playlist.length) { audio.src = m.playlist[idx].src; audio.play(); info.innerText = `ARTIST: ${m.artist} | SONG: ${m.playlist[idx].title}`; }
            else { btn.innerHTML = '🔒'; btn.disabled = true; }
        };
    </script>
</body>
</html>
