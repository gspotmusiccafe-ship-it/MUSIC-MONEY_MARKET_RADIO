<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MONEY MARKET // LIVE EXCHANGE</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --red: #ff3333; --panel: #111; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; text-transform: uppercase; overflow-x: hidden; }
        
        header { padding: 10px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 1000; }
        .ticker-bar { background: #000; padding: 5px; border: 1px solid #222; margin-top: 5px; font-size: 0.65rem; display: flex; justify-content: space-between; }

        .dashboard { display: flex; flex-direction: column; width: 100%; min-height: 100vh; }
        #radio-desk { order: 1; padding: 15px; background: #0a0a0a; border-bottom: 3px solid #333; text-align: center; }
        #market-core { order: 2; padding: 15px; flex: 1; }
        
        @media (min-width: 901px) {
            .dashboard { flex-direction: row; height: calc(100vh - 80px); }
            #radio-desk { width: 360px; border-right: 1px solid #333; }
        }

        .oscillator-main { font-size: 4.5rem; color: white; margin: 5px 0; font-weight: 900; }
        .roi-display { font-size: 1.2rem; color: var(--gold); margin-bottom: 10px; }

        .gate-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-main { padding: 20px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; text-transform: uppercase; }
        .btn-invest { background: var(--neon); color: #000; box-shadow: 0 4px 0 #008a20; }
        .btn-liquidate { background: var(--red); color: white; box-shadow: 0 4px 0 #8a0000; }

        #order-flow { height: 180px; background: #000; font-size: 0.65rem; padding: 10px; border: 1px solid #333; overflow: hidden; margin-top: 15px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 5px; padding-bottom: 3px; border-bottom: 1px solid #111; }
        .market-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.6rem; padding: 10px; background: #111; border: 1px solid #222; }
        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); margin: 0 auto 10px auto; background-size: cover; background-position: center; max-width: 250px; background-color: #222; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:bold;">MUSIC MONEY MARKET</div>
        <div style="color:var(--gold); font-size:0.7rem;">97.7 THE FLAME</div>
    </div>
    <div class="ticker-bar">
        <span>STATUS: <span id="status-text" style="color:var(--gold)">HUNTING</span></span>
        <span id="price-change">BOUNCE: 0%</span>
    </div>
