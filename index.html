<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // MUSIC MARKET TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { 
            --bloomberg-blue: #0066ff;
            --bloomberg-green: #00ff33;
        }

        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* THE FIX: RIGID OVERLAY THAT DOES NOT BLOCK CLICKS */
        #landing-page { 
            position: fixed; inset: 0; background: #000; 
            z-index: 999999; display: flex; align-items: center; justify-content: center;
        }

        .login-box { 
            background: #0a0a0a; border: 1px solid #333; 
            padding: 40px; width: 400px; border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 102, 255, 0.2);
            text-align: center;
            position: relative; z-index: 1000000; /* Ensure this is above the background */
        }

        /* THE "NUKE" BUTTON: SOLID, NO TRANSPARENCY, HIGH PRIORITY */
        #init-btn {
            background: var(--bloomberg-blue) !important;
            color: #fff !important; font-weight: 900; padding: 20px; width: 100%;
            border-radius: 2px; cursor: pointer !important; border: none;
            text-transform: uppercase; letter-spacing: 3px;
            font-size: 16px; margin-top: 15px;
            display: block; position: relative; z-index: 1000001;
            pointer-events: auto !important; /* Forces clickability */
        }
        #init-btn:hover { background: #0052cc !important; box-shadow: 0 0 20px var(--bloomberg-blue); }

        .input-terminal { 
            background: #111; border: 1px solid #222; color: #fff; 
            width: 100%; padding: 15px; margin-bottom: 12px; font-family: 'JetBrains Mono'; 
            font-size: 14px; outline: none;
        }

        .dashboard { display: none; grid-template-columns: 350px 1fr 320px; height: 100vh; width: 100vw; }
        .dashboard.active { display: grid; }
        
        .side { background: #080808; border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        header { padding: 12px 25px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; background: #000; }
        
        .market-btn {
            display: block; width: 100%; text-align: center; padding: 14px;
            font-weight: 900; font-size: 11px; border-radius: 4px; 
            cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none; margin-bottom: 10px;
        }
        .btn-green { background: var(--bloomberg-green); color: #000; }
        .btn-blue { background: var(--bloomberg-blue); color: #fff; }
    </style>
</head>
<body>

<div id="landing-page">
    <div class="login-box">
        <h1 class="text-2xl font-black mb-1">97.7 THE FLAME</h1>
        <p class="text-[10px] text-blue-500 font-bold tracking-[4px] mb-8">MUSIC MARKET TERMINAL ACCESS</p>
        
        <input type="text" placeholder="TERMINAL_ID" class="input-terminal">
        <input type="password" placeholder="ACCESS_KEY" class="input-terminal">
        <input type="text" placeholder="SYNC_MOBILE" class="input-terminal">
        
        <button type="button" onclick="launchTerminal();" id="init-btn">INITIALIZE SYSTEM</button>
        <p class="text-[9px] text-gray-600 mt-6 font-mono">CONNECTION: SECURE // NO BOTS</p>
    </div>
</div>

<header>
    <div class="text-blue-500 font-bold text-[10px]">AITIFY // MUSIC MARKET TERMINAL</div>
    <div class="text-green-500 font-bold text-[10px]">● SYSTEM_STABLE_V4.12</div>
</header>

<div id="main-dash" class="dashboard">
    <div class="side">
        <div class="w-full aspect-square border border-gray-800 mb-6 bg-cover bg-center" style="background-image: url('https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982');"></div>
        <div class="p-6 bg-[#111] rounded border border-gray-800">
            <div id="price" class="text-center text-5xl font-black mb-2">$3.09</div>
            <div class="text-center text-green-500 text-xs font-bold mb-6">▲ KINETIC GAINS</div>
            <button onclick="window.open('https://aitify-music-stream.replit.app/', '_blank')" class="market-btn btn-blue">OPEN MARKET TERMINAL</button>
            <button onclick="window.open('https://cash.app/f/POOL?id=tgva6fj4', '_blank')" class="market-btn btn-green">BUY SINGLE SONG $1.00</button>
        </div>
    </div>
    <div class="p-8"><div class="h-64 border-b border-gray-800 flex items-end gap-1" id="chart"></div></div>
    <div class="side" id="ledger"><div class="text-blue-500 font-bold text-[10px] mb-4 font-mono">MARKET_LEDGER</div><div id="list"></div></div>
</div>

<script>
    function launchTerminal() {
        console.log("Button Pressed - Launching...");
        const landing = document.getElementById('landing-page');
        const dash = document.getElementById('main-dash');
        
        if (landing) landing.style.display = 'none';
        if (dash) dash.classList.add('active');

        // Populate Ledger
        const songs = ["LOVE MAKE OVER", "SUPERFLY", "TIMES UP", "GANSTA CHICK"];
        songs.forEach(s => {
            const div = document.createElement('div');
            div.className = "p-4 border-b border-gray-900 text-[11px] text-gray-500 flex justify-between";
            div.innerHTML = `<span>${s}</span><span>$1.00</span>`;
            document.getElementById('list').appendChild(div);
        });

        // Start Chart
        setInterval(() => {
            const bar = document.createElement('div');
            bar.className = Math.random() > 0.4 ? "bg-green-500 w-2" : "bg-red-500 w-2";
            bar.style.height = (Math.random() * 80 + 10) + "%";
            document.getElementById('chart').appendChild(bar);
            if(document.getElementById('chart').children.length > 40) document.getElementById('chart').firstChild.remove();
        }, 1000);
    }
</script>
</body>
</html>
