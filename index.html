<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYALTY CHECK RADIO</title>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; overflow: hidden; }
        .main-chassis { display: grid; grid-template-rows: 2fr 1fr; width: 95vw; max-width: 400px; height: 95vh; max-height: 650px; border-radius: 10px; overflow: hidden; border: 4px solid #AAA; }
        
        /* 1. THE CHECK PART (TOP) */
        .check-chassis { background: #EED; padding: 15px; display: flex; flex-direction: column; position: relative; border-bottom: 3px dashed #777; /* Perforation */ }
        .check-header { display: flex; justify-content: space-between; align-items: start; }
        #check-logo { width: 50px; height: 50px; background: #CCC; border-radius: 5px; /* LOGO PLACEHOLDER */ }
        #check-id { font-weight: bold; }
        #check-headline { text-align: center; color: #000; font-weight: 900; letter-spacing: 2px; margin: 10px 0 0; font-size: 18px; }
        
        .check-row { display: flex; gap: 10px; align-items: end; margin-top: 15px; }
        .check-field { flex-grow: 1; border-bottom: 2px solid #000; }
        .field-label { font-size: 10px; color: #555; text-transform: uppercase; margin-right: 5px; }
        
        .amount-box { border: 2px solid #000; background: #FFF; padding: 5px 15px; font-weight: bold; font-size: 16px; margin-left: auto; width: 80px; text-align: center; }

        /* 2. THE RADIO PART (DETACHED STUB) */
        .radio-stub-chassis { background: #CCC; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid #FFF; }
        .stub-field { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #AAA; }
        .stub-label { font-size: 12px; color: #333; text-transform: uppercase; font-weight: bold; }
        .stub-value { font-size: 14px; font-weight: bold; color: #000; text-align: right; }
        
        #btn-rights { background: #008000; color: #FFF; font-weight: bold; padding: 15px; text-decoration: none; text-align: center; border-radius: 8px; margin-top: auto; cursor: pointer; text-transform: uppercase;}
        #btn-rights:hover { background: #00A000; }

    </style>
</head>
<body>
    <div class="main-chassis">
        <div class="check-chassis">
            <div class="check-header">
                <div id="check-logo">LOGO</div> <p id="check-id">CK-01-SFL</p>
            </div>
            <h1 id="check-headline">ROYALTY CHECK RADIO</h1> <div class="check-row">
                <p class="field-label">PAY TO:</p>
                <div class="check-field">LICENSEE</div> </div>
            
            <div class="check-row">
                <div class="amount-box">$ <span id="oscillating-amount">100.00</span></div> </div>
            
            <div class="check-row">
                <p class="field-label">MEMO:</p>
                <div class="check-field">QUEEN BUTTA</div> </div>
        </div>

        <div class="radio-stub-chassis">
            <div class="stub-field"><p class="stub-label">ARTIST:</p><div class="stub-value">QUEEN BUTTA</div></div>
            <div class="stub-field"><p class="stub-label">TITLE:</p><div class="stub-value" id="track-title">SUPERFLY</div></div>
            <div class="stub-field"><p class="stub-label">GENRE:</p><div class="stub-value">R&B / SOUL</div></div>
            
            <div class="stub-field" style="margin-top: 15px;"><p class="stub-label">LICENSE FEE:</p><div class="stub-value">$10.22 / MP</div></div>
            
            <audio id="main-audio"></audio>
            <a id="btn-rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>

    <script>
        let radio = { manifest: null, currentTrack: 0 };
        const audio = document.getElementById('main-audio');
        const rightsBtn = document.getElementById('btn-rights');
        
        // --- 1. AFFILIATE LINK LOGIC ---
        const params = new URLSearchParams(window.location.search);
        const ref = params.get('ref') || 'direct';
        rightsBtn.href += `&ref=${ref}`;

        // --- 2. THE OSCILLATING DOLLAR SCRIPT ($100-$1K) ---
        function startOscillation() {
            const amountSpan = document.getElementById('oscillating-amount');
            setInterval(() => {
                // Generate random value between 100 and 1000
                const newValue = Math.floor(Math.random() * 900) + 100;
                amountSpan.innerText = newValue.toFixed(2);
            }, 80); // Update speed
        }

        async function initRadio() {
            try {
                const response = await fetch('radio-manifest.json');
                radio.manifest = await response.json();
                audio.src = radio.manifest.playlist[0].src;
                // Once data loads, start the amount flicker
                startOscillation();
            } catch(e) { console.error("Data error:", e); }
        }

        // Logic for continuous play is not present in this simplified view,
        // but can be added back if needed for user testing.
        initRadio();
    </script>
</body>
</html>
