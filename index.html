<header>
    <div>THE MUSIC MONEY MARKET</div>
    <div id="token-ticker" style="color:var(--neon); font-size: 0.75rem;">
        TOKEN: $MMM <span style="color:white;">|</span> 
        PRICE: <span id="coin-price" style="color:var(--gold)">$0.00001042</span> 
        <span id="price-change" style="color:var(--neon); font-size: 0.6rem;">(+4.2%)</span>
    </div>
    <div style="color:var(--gold)">97.7 THE FLAME</div>
</header>

<div class="market-stats">
    <div style="display:flex; flex-direction:column;">
        <span>LIQUIDITY (BNB): <span style="color:white;">1.62 BNB ($1,042)</span></span>
        <span>24H VOL: <span id="vol-24h" style="color:var(--neon);">$14,201</span></span>
    </div>
    <div style="display:flex; flex-direction:column; text-align:right;">
        <span>MKT CAP: <span id="mkt-cap" style="color:var(--gold)">$1,042.00</span></span>
        <span>SUPPLY: <span style="color:white;">100,000,000</span></span>
    </div>
</div>

<script>
    // ADD THIS TO YOUR updatePrices() FUNCTION
    function updatePrices() {
        const a = assets[currentIdx];
        
        // POOCOIN STYLE PRICE MOVEMENT
        let basePrice = 0.00001000;
        let volatility = (Math.random() * 0.000001) - 0.0000004;
        let currentCoinPrice = (basePrice + volatility).toFixed(8);
        
        document.getElementById('coin-price').innerText = `$${currentCoinPrice}`;
        
        // UPDATE MARKET CAP BASED ON PRICE
        let newMktCap = (100000000 * parseFloat(currentCoinPrice)).toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('mkt-cap').innerText = `$${newMktCap}`;
        
        // OSCILLATOR FOR THE CURRENT SONG ASSET
        document.getElementById('main-osc').innerText = `$${(a.buy + (Math.random()*0.1)).toFixed(2)}`;
    }
</script>
