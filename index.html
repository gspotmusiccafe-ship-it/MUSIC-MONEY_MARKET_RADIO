<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYALTY CHECK RADIO</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        .check-container { background: #fdfaf0; width: 95vw; max-width: 450px; height: 85vh; border: 4px solid #555; display: flex; flex-direction: column; box-shadow: 0 10px 30px #000; overflow: hidden; }
        
        /* TOP HALF - CHECK BORDERED */
        .check-top { padding: 20px; border: 3px solid #333; margin: 10px; flex-grow: 1; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; }
        .amount-box { border: 2px solid #000; padding: 5px 10px; font-weight: bold; }
        .logo-box { width: 80px; height: 80px; border: 2px solid #000; }
        #album-art { width: 100%; height: 100%; object-fit: cover; }

        /* BOTTOM HALF - STUB */
        .stub-area { background: #e0e0e0; padding: 20px; border-top: 3px dashed #777; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 2px solid #000; cursor: pointer; font-size: 20px; }
        #btn-rights { background: #008000; color: #fff; width: 100%; text-align: center; padding: 12px; text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="check-container">
        <div class="check-top">
            <div style="display:flex; justify-content:space-between;">
                <div class="logo-box"><img id="album-art" src="" alt="Butta"></div>
                <div style="font-size: 16px; font-weight: 900; text-align:right;">ROYALTY CHECK RADIO</div>
            </div>
            <div class="row" style="margin-top:20px;">
                <span>PAY TO: LICENSEE</span> <span class="amount-box" id="money">$862.00</span>
            </div>
            <div class="row">MEMO: QUEEN BUTTA ROYALTIES</div>
        </div>

        <div class="stub-area">
            <div style="font-size: 13px; font-weight: bold; text-align: center;" id="track-info">ARTIST: QUEEN BUTTA | SONG: SUPERFLY | GENRE: R&B</div>
            <div style="font-size: 14px; font-weight: bold;">LICENSE FEE: $30.00 MARKET PRICE</div>
            <button class="play-btn" id="play-pause-btn">▶</button>
            <a id="btn-rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="main-audio"></audio>
    <script>
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause-btn');
        const moneyBox = document.getElementById('money');
        let trackCount = 0;
        let manifest = null;

        async function init() {
            const res = await fetch('radio-manifest.json');
            manifest = await res.json();
            document.getElementById('album-art').src = manifest.albumArt;
            audio.src = manifest.playlist[0].src;
            setInterval(() => moneyBox.innerText = '$' + (Math.floor(Math.random() * 900) + 100) + '.00', 500);
        }

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.innerText = "❚❚"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        };

        audio.onended = () => {
            trackCount++;
            if (trackCount < 12 && trackCount < manifest.playlist.length) {
                audio.src = manifest.playlist[trackCount].src;
                audio.play();
            } else {
                audio.pause();
                playBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
                playBtn.disabled = true;
            }
        };
        init();
    </script>
</body>
</html>
