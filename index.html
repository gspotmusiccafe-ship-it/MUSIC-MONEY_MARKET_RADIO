<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITITRADE | SOVEREIGN PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff41; --gold: #ffd700; --emerald: #062111; --red: #ff3131; }
        
        body { 
            font-family: 'JetBrains+Mono', monospace; 
            background: radial-gradient(circle at center, #0a3d1d 0%, #000 100%);
            color: var(--neon); display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 15px; text-transform: uppercase; 
        }
        
        .portal-container { 
            width: 100%; max-width: 410px; background: #000; border: 3px solid var(--gold); 
            position: relative; box-shadow: 0 0 100px rgba(0, 255, 65, 0.2); 
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #fff; padding: 22px; border-radius: 2px;
            font-weight: 700; letter-spacing: 3px; transition: 0.3s;
            text-align: center; cursor: pointer;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
        }
        .glass-btn:hover {
            border-color: var(--neon); color: var(--neon);
            background: rgba(0, 255, 65, 0.15); box-shadow: 0 0 30px rgba(0,255,65,0.4);
        }

        .price-display { font-size: 5rem; line-height: 1; font-weight: 900; letter-spacing: -5px; }
        .gain { color: var(--neon); }
        .loss { color: var(--red); }

        .osc-box { height: 70px; background: #000; position: relative; border-y: 1px solid #222; }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="p-3 bg-black border-b border-[#222] flex justify-between text-[9px] font-bold">
            <span class="text-white tracking-widest">AITITRADE // 97.7 THE FLAME</span>
            <span class="animate-pulse text-green-500">● SIGNAL: KINETIC_LOCKED</span>
        </div>

        <div class="relative border-b border-[#222] aspect-square overflow-hidden">
            <img src="https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" 
                 class="w-full h-full object-cover block">
            <div class="absolute bottom-5 left-5 bg-black/95 p-4 border-l-4 border-yellow-500">
                <h1 class="text-white text-2xl font-black italic">SUPERFLY</h1>
                <p class="text-[9px] text-gray-500 mt-1 tracking-[0.3em]">ATFY-9C4D7 // NATIVE ASSET</p>
            </div>
        </div>

        <div class="osc-box">
            <svg width="100%" height="100%" viewBox="0 0 400 70" preserveAspectRatio="none">
                <path fill="none" stroke="#00ff41" stroke-width="2">
                    <animate attributeName="d" dur="1s" repeatCount="indefinite"
                        values="M0,35 Q50,10 100,35 T200,35 T300,35 T400,35;
                                M0,35 Q50,60 100,35 T200,35 T300,35 T400,35;
                                M0,35 Q50,10 100,35 T200,35 T300,35 T400,35" />
                </path>
            </svg>
            <div class="absolute top-2 right-4 text-[8px] font-bold text-white opacity-50">MBBP: <span id="mbbp-val">$1.14</span></div>
        </div>

        <div class="grid grid-cols-3 bg-[#050505] border-b border-[#222] text-center text-[10px]">
            <div class="p-4 border-r border-[#222]">
                <p class="text-gray-600 mb-1">BUY-IN</p>
                <p class="text-white font-bold text-sm">$5.00</p>
            </div>
            <div class="p-4 border-r border-[#222]">
                <p class="text-gray-600 mb-1">MOMENTUM</p>
                <p class="text-white font-bold text-sm" id="momentum-stat">0%</p>
            </div>
            <div class="p-4">
                <p class="text-gray-600 mb-1">SPLIT</p>
                <p class="text-white font-bold text-sm">90/10</p>
            </div>
        </div>

        <div class="p-8 text-center bg-gradient-to-t from-emerald-950/30 to-black">
            <p class="text-[10px] text-gray-500 tracking-[0.4em] mb-2 font-bold">LIVE MARKET VALUATION</p>
            <div id="price-main" class="price-display gain mb-2">$5.84</div>
            <div id="price-change" class="text-sm font-bold tracking-widest text-green-500">▲ +0.11 (+1.9%)</div>

            <div class="flex flex-col gap-4 mt-10">
                <div onclick="toggleAudio()" id="play-btn" class="glass-btn">PLAY ASSET</div>
                <a href="https://aitify-music-stream.replit.app/" class="glass-btn">ACCESS
