<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MUSIC-MONEY MARKET RADIO</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; text-align: center; }
        #vending-machine { border: 4px solid #f0f; width: 350px; margin: 50px auto; padding: 20px; box-shadow: 0 0 20px #f0f; }
        .ticker { font-size: 24px; background: #111; padding: 10px; border: 1px solid #0ff; margin-bottom: 20px; }
        .song-btn { background: #222; color: #fff; border: 1px solid #f0f; padding: 10px; margin: 5px; cursor: pointer; width: 80%; }
        .song-btn:hover { background: #f0f; color: #000; }
        #buy-btn { background: #0f0; color: #000; font-weight: bold; padding: 20px; margin-top: 20px; cursor: pointer; border: none; width: 100%; }
    </style>
</head>
<body>
    <h1>97.7 THE FLAME</h1>
    <div id="vending-machine">
        <div class="ticker" id="price-ticker">BETTER THAN GOOD: LOADING...</div>
        <div id="display">
            <p>SELECT SONG TO VEND</p>
            <button class="song-btn" onclick="playSong('URL_HERE')">01 - BETTER THAN GOOD</button>
            </div>
        <button id="buy-btn" onclick="window.location.href='YOUR_PAYHIP_OR_STRIPE_LINK'">RAPID BUY @ MARKET PRICE</button>
    </div>

    <script>
        async function getPrice() {
            try {
                const response = await fetch('https://aitify-oscillator.onrender.com/api/market-data');
                const data = await response.json();
                const song = data.find(s => s.name === "BETTER THAN GOOD");
                document.getElementById('price-ticker').innerText = `BETTER THAN GOOD: $${song.price}`;
            } catch (e) { console.log("Ticker offline"); }
        }
        setInterval(getPrice, 5000); // Updates every 5 seconds
        getPrice();
    </script>
</body>
</html>
