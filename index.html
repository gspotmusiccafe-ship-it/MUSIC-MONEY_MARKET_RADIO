<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* BLOOMBERG-STYLE EMERALD GLASS LOOK */
        body { 
            background: linear-gradient(135deg, #001e0a, #003314); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        }
        .check-container { 
            background: rgba(255, 255, 255, 0.95); width: 95vw; max-width: 400px; height: 95vh; 
            border: 8px solid #004d1d; border-radius: 12px; padding: 15px; 
            box-shadow: 0 0 30px rgba(0, 77, 29, 0.5); display: flex; flex-direction: column; 
        }
        .check-top { border: 2px solid #333; padding: 20px; flex-grow: 1; border-radius: 4px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-weight: bold; }
        .line { border-bottom: 2px solid #000; flex-grow: 1; margin-left: 10px; }
        .money-box { border: 3px solid #000; padding: 8px 15px; font-weight: 900; background: #fff; }

        /* HIGH CONTRAST TICKER */
        .ticker-wrap { background: #000; border: 2px solid #00ff41; color: #00ff41; padding: 12px; margin: 15px 0; overflow: hidden; white-space: nowrap; font-weight: 900; font-size: 14px; }
        .ticker { display: inline-block; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-50%, 0); } }

        .stub { background: #e0e0e0; padding: 20px; border-top: 4px dashed #000; text-align: center; border-radius: 0 0 4px 4px; }
        .play-btn { width: 65px; height: 65px; border-radius: 50%; border: 4px solid #000; background: #fff; cursor: pointer; font-size: 25px; margin: 15px; }
        #rights { display: block; padding: 18px; background: #008000; color: #fff; text-decoration: none; font-weight: 900; border-radius: 6px; font-size: 16px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="check-container">
        <div class="check-top">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="width: 70px; height: 70px; border: 2px solid #000;"><img id="art" src="" style="width:100%;height:100%"></div>
                <div style="font-weight:900; font-size: 1.1em; text-align: right;">ROYALTY CHECK RADIO</div>
            </div>
            <div class="row">PAY TO: LICENSEE <span class="line"></span> <span class="money-box" id="money">$862.00</span></div>
            <div class="row">MEMO: QUEEN BUTTA ROYALTIES <span class="line"></span></div>
        </div>

        <div class="ticker-wrap">
            <div class="ticker">
                #1 MUSIC MADE TO MONETIZE &nbsp;&nbsp;&nbsp; #2 A SONGSHARE VAULT EXCLUSIVE RELEASE &nbsp;&nbsp;&nbsp; 
            </div>
        </div>

        <div class="stub">
            <div id="info" style="font-size: 12px; font-weight: 900; margin-bottom: 5px;">ARTIST: QUEEN BUTTA | SONG: SUPERFLY | GENRE: R&B</div>
            <div style="margin:10px 0; font-weight: 900;">MARKET PRICE: <span id="market-price" style="border: 2px solid #000; padding: 4px;">$30.00</span> <span id="gain-loss"></span></div>
            <button id="play-btn" class="play-btn">▶</button>
            <a id="rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="audio"></audio>
    <script>
        const audio = document.getElementById('audio'), btn = document.getElementById('play-btn'), info = document.getElementById('info'), moneyBox = document.getElementById('money'), marketPrice = document.getElementById('market-price'), gainLoss = document.getElementById('gain-loss');
        let m = null, idx = 0;
        fetch('radio-manifest.json').then(r => r.json()).then(d => { m = d; audio.src = d.playlist[0].src; document.getElementById('art').src = d.albumArt; });
        btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); btn.innerText = audio.paused ? '▶' : '❚❚'; };
        setInterval(() => {
            moneyBox.innerText = '$' + (Math.floor(Math.random() * 900) + 100) + '.00';
            let change = (Math.random() * 2 - 1).toFixed(2);
            marketPrice.innerText = '$' + (Math.random() * 28 + 2).toFixed(2);
            gainLoss.innerText = (change >= 0 ? " ▲ +" : " ▼ ") + change;
            gainLoss.style.color = change >= 0 ? "#008000" : "#ff0000";
        }, 1000);
        audio.onended = () => {
            idx++;
            if(idx < 12 && idx < m.playlist.length) { audio.src = m.playlist[idx].src; audio.play(); info.innerText = `ARTIST: ${m.artist} | SONG: ${m.playlist[idx].title} | GENRE: R&B`; }
            else { btn.innerHTML = '🔒'; btn.disabled = true; }
        };
    </script>
</body>
</html>
