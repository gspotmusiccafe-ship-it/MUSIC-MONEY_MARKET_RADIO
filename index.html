<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains+Mono', monospace; text-transform: uppercase; }
        
        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        .dashboard { display: flex; flex-direction: column; width: 100%; min-height: 100vh; padding-bottom: 50px; }

        /* SECTION STACKING */
        .section-box { width: 100%; max-width: 500px; margin: 0 auto 20px auto; border: 2px solid #222; background: #000; overflow: hidden; }
        
        /* VERTICAL LEDGER FIX */
        .ledger-row { display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #222; font-size: 0.75rem; transition: 0.3s; cursor: pointer; }
        .ledger-row:hover { background: #111; border-left: 4px solid var(--gold); }
        .ledger-row span { color: white; opacity: 0.6; font-size: 0.6rem; }

        /* OSCILLATOR VISUALS */
        .oscillator-main { font-size: 4rem; color: white; line-height: 1; font-weight: 900; letter-spacing: -3px; }
        .chart-container { background: #000; height: 200px; position: relative; border-bottom: 1px solid #222; }
        
        .trade-row { display: flex; justify-content: space-between; padding: 6px 12px; font-size: 0.65rem; border-bottom: 1px solid #111; }
        .album-art { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; border-bottom: 2px solid var(--gold); }
        
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 18px; width: 100%; display: block; text-align: center; text-decoration: none; border: none; font-size: 0.9rem; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 22px; width: 100%; display: block; text-align: center; text-decoration: none; border: none; font-size: 1.1rem; }
        
        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="init-overlay">
    <div class="p-12 border-4 border-yellow-500 bg-black text-center">
        <h2 class="text-yellow-500 font-black text-2xl mb-8 tracking-tighter">97.7 THE FLAME<br>NEW ARTIST SHOWCASE</h2>
        <button onclick="startEngine()" class="btn-gold">INITIALIZE AUDIO FEED</button>
    </div>
</div>

<header class="flex justify-between items-center">
    <div class="font-bold tracking-tighter">97.7 THE FLAME // RETAIL ARM</div>
    <div class="text-yellow-500 font-black animate-pulse text-xs">● LIVE BROADCAST</div>
</header>

<div class="dashboard p-4">
    <div class="section-box border-yellow-500">
        <div id="art-frame" class="album-art"></div>
        <div class="p-6 text-center bg-[#0a0a0a]">
            <div id="radio-track" class="text-yellow-500 text-[10px] mb-2 font-bold tracking-[0.3em]">--</div>
            <div id="main-osc" class="oscillator-main mb-2">$1.00</div>
            <div id="price-arrow" class="font-bold text-xl mb-6">▲ +0.00</div>
            
            <a id="buy-btn" href="https://cash.app/$AITITRADEBROKERAGE" target="_blank" class="btn-cash mb-4">BUY SONG: $1.00</a>
            <a href="https://aitify-music-stream.replit.app/" class="btn-gold">TRADE ON AITITRADE DEX</a>
            
            <div class="flex gap-2 mt-6">
                <button onclick="prevAsset()" class="flex-1 border border-green-500 py-4">⏮</button>
                <button onclick="playCurrent()" class="flex-1 border border-green-500 py-4 font-black">PLAY</button>
                <button onclick="nextAsset()" class="flex-1 border border-green-500 py-4">⏭</button>
            </div>
        </div>
    </div>

    <div class="section-box">
        <div class="p-2 bg-[#111] text-[9px] font-bold border-b border-[#222]">MARKET KINETICS</div>
        <div class="chart-container">
            <svg width="100%" height="100%" viewBox="0 0 1000 200" preserveAspectRatio="none">
                <path id="kinetic-line" d="" fill="none" stroke="#00ff00" stroke-width="4" />
                <circle id="pulse-head" r="8" fill="#00ff00" />
            </svg>
        </div>
        <div id="order-flow" class="bg-[#080808] h-48 overflow-hidden"></div>
    </div>

    <div class="section-box">
        <div class="p-3 text-yellow-500 font-bold border-b border-yellow-500 text-xs">QUEEN BUTTA // MARKET LEDGER</div>
        <div id="list-target"></div>
    </div>
</div>

<audio id="main-audio-engine"></audio>

<script>
    const assets = [
        { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FSUPERFLY.mp3?alt=media&token=e260aa5d-a3c9-453e-8b80-a466a6328906" },
        { name: "YOU'RE MY ADDICTION", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FYOU'RE%20MY%20ADDICTION.mp3?alt=media&token=ff95dd55-65a0-44c7-b9f4-9cd7ae2ce12c" },
        { name: "TIMES UP", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTIMES%20UP.mp3?alt=media&token=b582fd58-9511-447a-8986-b3dd9f720f2a" },
        { name: "LOVE MAKE OVER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLOVE%20MAKE%20OVER.mp3?alt=media&token=df587b6b-eed4-4f5b-b340-a5b5622efb31" },
        { name: "I'M NOT HER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI'M%20NOT%20HER.mp3?alt=media&token=e3ab1871-4af8-4e42-80e5-0e959a9647a1" },
        { name: "GANSTA CHICK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FGANSTA%20CHICK.mp3?alt=media&token=2b1859c4-a43d-4cc3-b121-5e06897ea7af" },
        { name: "IT'S FRIDAY NIGHT", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FIT'S%20FRIDAY%20NIGHT.mp3?alt=media&token=21b85403-a6dd-49d6-9a26-6514ed90eaa1" },
        { name: "HEARTBREAK MOTEL REMIX", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FHEARTBREAK%20MOTEL%20REMIX.mp3?alt=media&token=081a4e22-abb5-4045-a463-0f768dc9fb20" },
        { name: "LET'S GO BACK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLET'S%20GO%20BACK.mp3?alt=media&token=744a2807-2f51-4f4b-bef2-8d79e3e56be6" },
        { name: "I DESERVE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI%20DESERVE.mp3?alt=media&token=0bed5d76-783b-4ea4-9b12-9085d96bbf9c" },
        { name: "THAT GIRL FROM THE GHETTO", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTHAT%20GIRL%20FROM%20THE%20GHETTO.mp3?alt=media&token=a9f526a4-2567-4225-a8c2-dbac509f03de" },
        { name: "MIDNIGHT SMOKE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FMIDNIGHT%20SMOKE.mp3?alt=media&token=8ba90c94-61cf-4fce-84bc-6c8a0c6a0105" },
        { name: "BETTER THAN GOOD", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FBETTER%20THAN%20GOOD%20(1).mp3?alt=media&token=5b6a259d-7c57-4f1e-9c2d-121f9d3ee15a" }
    ];

    const queenImg = "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982";
    let currentIdx = 0; let points = []; let headY = 100; let velocity = 0; let engineStarted = false; let price = 1.00;

    const audio = document.getElementById('main-audio-engine');
    audio.onended = () => { nextAsset(); }; // Auto-Cycle Song to Song

    function startEngine() {
        if (engineStarted) return;
        engineStarted = true;
        document.getElementById('init-overlay').style.display = 'none';
        
        const list = document.getElementById('list-target');
        assets.forEach((a, i) => {
            list.innerHTML += `<div class="ledger-row" onclick="sync(${i})">${a.name} <span>AITITRADE // PRE-SALE RETAIL</span></div>`;
        });

        for (let i = 0; i <= 50; i++) points.push({ x: (1000 / 50) * i, y: 100 });
        
        setInterval(updateChart, 40);
        setInterval(simulateMarket, 1200); 
        sync(0);
    }

    function simulateMarket() {
        const side = Math.random() > 0.4 ? "BUY" : "SELL";
        const impact = (Math.random() * 0.50) + 0.10;
        
        if (side === "BUY") {
            price = Math.min(5.00, price + impact);
            velocity -= 20;
        } else {
            price = Math.max(1.00, price - (impact * 0.6));
            velocity += 15;
        }

        const osc = document.getElementById('main-osc');
        const arrow = document.getElementById('price-arrow');
        osc.innerText = `$${price.toFixed(2)}`;
        
        if (side === "BUY") {
            osc.className = "oscillator-main text-[#00ff00]";
            arrow.innerHTML = `▲ +${impact.toFixed(2)}`;
            arrow.style.color = "#00ff00";
        } else {
            osc.className = "oscillator-main text-[#ff3333]";
            arrow.innerHTML = `▼ -${(impact*0.6).toFixed(2)}`;
            arrow.style.color = "#ff3333";
        }

        const flow = document.getElementById('order-flow');
        const row = document.createElement('div');
        row.className = 'trade-row';
        row.style.color = side === "BUY" ? "#00ff00" : "#ff3333";
        row.innerHTML = `<span>${side} SONGSHARE</span> <span>QTY: 1</span>`;
        flow.prepend(row);
        if(flow.children.length > 10) flow.removeChild(flow.lastChild);
    }

    function updateChart() {
        velocity *= 0.82; headY += velocity;
        let targetY = 180 - ((price - 1) / 4 * 140);
        headY += (targetY - headY) * 0.08;

        for (let i = 0; i < points.length - 1; i++) points[i].y = points[i+1].y;
        points[points.length - 1].y = headY;
        
        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 0; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            d += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
        }
        document.getElementById('kinetic-line').setAttribute('d', d);
        document.getElementById('pulse-head').setAttribute('cx', points[points.length-1].x);
        document.getElementById('pulse-head').setAttribute('cy', points[points.length-1].y);
    }

    function sync(idx) {
        currentIdx = idx; const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('art-frame').style.backgroundImage = `url('${queenImg}')`;
        document.getElementById('buy-btn').innerText = `BUY ${a.name}: $1.00`;
        audio.src = a.audio; 
        audio.play().catch(() => { console.log("Handshake required"); });
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
    function playCurrent() { audio.play(); }
</script>
</body>
</html>
