<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYALTY CHECK RADIO</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        .check-container { background: #fdfaf0; width: 95vw; max-width: 450px; height: 85vh; border: 2px solid #555; display: flex; flex-direction: column; box-shadow: 0 10px 30px #000; overflow: hidden; }
        
        /* TOP HALF - CHECK */
        .header-section { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #000; }
        .logo-box { width: 50px; height: 50px; background: #333; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .title-box { font-size: 18px; font-weight: 900; }
        .field-area { padding: 15px; flex-grow: 1; }
        .data-row { margin-bottom: 15px; border-bottom: 1px dotted #000; padding-bottom: 2px; font-weight: bold; }
        
        /* ALBUM ART AREA */
        .art-box { width: 100px; height: 100px; border: 2px solid #000; float: right; margin-left: 10px; background: #ddd; }
        #album-art { width: 100%; height: 100%; object-fit: cover; }

        /* BOTTOM HALF - STUB */
        .stub-area { background: #e0e0e0; padding: 15px; border-top: 3px dashed #777; display: flex; flex-direction: column; align-items: center; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 2px solid #000; cursor: pointer; font-size: 20px; }
        #btn-rights { background: #008000; color: #fff; width: 100%; text-align: center; padding: 10px; text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="check-container">
        <div class="header-section">
            <div class="logo-box">MME</div>
            <div class="title-box">ROYALTY CHECK RADIO</div>
        </div>
        <div class="field-area">
            <div class="art-box"><img id="album-art" src="" alt="Album Art"></div>
            <div class="data-row">PAY TO: LICENSEE</div>
            <div class="data-row">ARTIST: QUEEN BUTTA</div>
            <div class="data-row">SONG: SUPERFLY</div>
            <div class="data-row">GENRE: R&B / SOUL</div>
            <div style="font-weight:bold; margin-top:20px;">MEMO: QUEEN BUTTA ................... $30.00</div>
        </div>
        <div class="stub-area">
            <button class="play-btn" id="play-pause-btn">▶</button>
            <a id="btn-rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="main-audio"></audio>
    <script>
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause-btn');
        const albumArt = document.getElementById('album-art');
        
        async function init() {
            try {
                const res = await fetch('radio-manifest.json');
                const data = await res.json();
                audio.src = data.playlist[0].src;
                albumArt.src = data.albumArt;
            } catch(e) { console.log("Load error"); }
        }

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.innerText = "❚❚"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        };

        audio.onended = () => {
            audio.pause();
            playBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
            playBtn.disabled = true;
        };
        init();
    </script>
</body>
</html>
