<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AITITRADE // BROKERAGE SETTLEMENT DESK</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; overflow-x: hidden; }
        .desk-header { border-bottom: 2px solid #0f0; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .stat-card { border: 1px solid #0f0; padding: 15px; background: #111; text-align: center; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        .val { font-size: 2rem; display: block; color: #0ff; font-weight: bold; text-shadow: 0 0 10px #0ff; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 5px; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; background: #050505; font-size: 0.9rem; }
        th { background: #0f0; color: #000; padding: 12px; text-transform: uppercase; text-align: left; }
        td { border-bottom: 1px solid #222; padding: 15px; color: #0ff; }
        .status-pulse { color: #0f0; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="desk-header">
        <span>ID: G-SMOOTH-OFFICE-001</span>
        <span id="live-clock">00:00:00 AM</span>
    </div>

    <div class="grid">
        <div class="stat-card"><span class="val" id="total-vol">$0.00</span><div class="label">Total Market Vol</div></div>
        <div class="stat-card"><span class="val" id="trader-count">0</span><div class="label">Active Settlement Slots</div></div>
        <div class="stat-card"><span class="val" id="surplus">$522.00</span><div class="label">Liquidity Reserve</div></div>
        <div class="stat-card"><span class="val">100% ROI</span><div class="label">Target Maturity</div></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>TIMESTAMP</th>
                <th>ASSET</th>
                <th>TIER</th>
                <th>ENTRY</th>
                <th>SETTLEMENT STATUS</th>
            </tr>
        </thead>
        <tbody id="ledger-rows">
            <tr><td colspan="5" style="text-align:center;">SYNCING WITH GOOGLE CLOUD...</td></tr>
        </tbody>
    </table>

    <script>
        const SHEET_ID = '19lFD6I1f3WBZyVIMTOTdDy_3ssDztJsW4mQPM2H_dLM';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        async function syncBrokerageDesk() {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;

                let html = '';
                let totalVolume = 0;

                rows.reverse().forEach(row => {
                    const data = row.c;
                    if (!data || !data[1]) return; // Skip empty rows

                    const timestamp = data[0] ? data[0].f : '---';
                    const asset = data[1] ? data[1].v : '---';
                    const tier = data[2] ? data[2].v : '---';
                    const principal = data[3] ? data[3].v : 0;
                    const status = data[4] ? data[4].v : 'PENDING';

                    totalVolume += parseFloat(principal);

                    html += `<tr>
                        <td>${timestamp}</td>
                        <td>${asset}</td>
                        <td>Tier ${tier}</td>
                        <td style="color:#0f0;">$${parseFloat(principal).toFixed(2)}</td>
                        <td class="status-pulse">${status}</td>
                    </tr>`;
                });

                document.getElementById('ledger-rows').innerHTML = html || '<tr><td colspan="5" style="text-align:center;">NO TRADES RECORDED</td></tr>';
                document.getElementById('total-vol').innerText = `$${totalVolume.toFixed(2)}`;
                document.getElementById('trader-count').innerText = rows.filter(r => r.c && r.c[1]).length;
            } catch (err) {
                console.log("Re-establishing connection...");
            }
        }

        setInterval(syncBrokerageDesk, 5000);
        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        window.onload = syncBrokerageDesk;
    </script>
</body>
</html>
