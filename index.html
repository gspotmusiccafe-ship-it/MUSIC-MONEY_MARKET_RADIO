<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MUSIC MONEY MARKET // RADIO</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow-x: hidden; }
        
        /* TOP PORTAL TICKER - BOLD & GLOWING */
        .ticker-bar { width: 100%; background: #111; border-bottom: 3px solid #0ff; padding: 15px 0; overflow: hidden; font-weight: 900; box-shadow: 0 0 15px #0ff; }
        .marquee { display: inline-block; white-space: nowrap; animation: move 18s linear infinite; color: #0f0; font-size: 1.1rem; text-shadow: 0 0 10px #0f0; }
        @keyframes move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* THE MAIN VIBE TERMINAL */
        #terminal { border: 4px solid #0ff; max-width: 480px; margin: 30px auto; padding: 20px; background: rgba(10,10,10,0.95); box-shadow: 0 0 30px #0ff; border-radius: 10px; }
        .art-box { width: 100%; height: 420px; background-size: cover; background-position: center; border: 2px solid #333; position: relative; box-shadow: inset 0 0 50px #000; }
        .track-info { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 15px; font-size: 0.9rem; color: #f0f; border-top: 1px solid #f0f; font-weight: bold; }
        
        /* THE CONTROLS - HEAVY NEON */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn { padding: 20px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 1rem; border-radius: 5px; transition: 0.2s; }
        .btn:active { transform: scale(0.9); }
        .buy { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
        .skip { background: #f0f; color: #fff; box-shadow: 0 0 15px #f0f; }

        /* BOTTOM ASSET SCROLLER */
        .asset-scroll { width: 100%; overflow-x: auto; white-space: nowrap; padding: 25px; background: #050505; border-top: 3px solid #0ff; margin-top: 30px; box-shadow: 0 -10px 20px rgba(0,255,255,0.2); }
        .asset-card { display: inline-block; width: 110px; margin-right: 20px; cursor: pointer; transition: 0.3s; text-align: center; }
        .asset-card img { width: 100%; border: 2px solid #0ff; border-radius: 4px; box-shadow: 0 0 10px #0ff; }
        .asset-card:hover { transform: translateY(-10px) scale(1.1); }
        .asset-card p { margin-top: 8px; font-size: 0.7rem; color: #0ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ticker-bar">
        <div class="marquee">$MMC SYMPHONY ▲ $0.000125 | TREBLE ASSET: SUPERFLY ▲ $5.20 | BASS ASSET: ROXY BROWN ▼ $2.15 | MARKET: OPEN | DIVIDEND RATIO: 1:100</div>
    </div>

    <div id="terminal">
        <div class="art-box" id="cover">
            <div class="track-info" id="status">WAKING UP THE SYSTEM...</div>
        </div>
        <div class="controls">
            <button class="btn buy" onclick="buy()">BUY STOCK</button>
            <button class="btn skip" onclick="next()">SKIP ASSET</button>
        </div>
    </div>

    <div class="asset-scroll" id="assetList"></div>

    <audio id="player" onended="next()"></audio>

    <script>
        const inventory = [
            { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" },
            { name: "ROXY BROWN", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147" }
        ];

        let idx = 0;
        const player = document.getElementById('player');
        const assetList = document.getElementById('assetList');

        function load() {
            const a = inventory[idx];
            player.src = a.audio;
            document.getElementById('cover').style.backgroundImage = `url('${a.art}')`;
            document.getElementById('status').innerText = `CURRENT TRADE: ${a.name}`;
            player.play().catch(e => console.log("Maestro, tap to start."));
        }

        function next() { idx = (idx + 1) % inventory.length; load(); }
        function buy() { window.location.href = "https://cash.app/$AITITRADEBROKERAGE"; }

        inventory.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'asset-card';
            card.onclick = () => { idx = index; load(); };
            card.innerHTML = `<img src="${item.art}" alt="${item.name}"><p>${item.name}</p>`;
            assetList.appendChild(card);
        });

        window.onload = load;
    </script>
</body>
</html>
