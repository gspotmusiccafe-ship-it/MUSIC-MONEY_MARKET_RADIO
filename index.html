<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // MUSIC MONEY MARKET</title>
    <style>
        :root { --b-orange: #ff9900; --gain: #00ff00; --loss: #ff0000; --terminal-bg: #050505; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; text-transform: uppercase; }

        /* 1. TOP TICKER */
        .ticker-bar { width: 100%; background: #000; border-bottom: 2px solid #333; padding: 8px 0; overflow: hidden; font-size: 0.8rem; }
        .marquee { display: inline-block; white-space: nowrap; animation: move 20s linear infinite; color: var(--b-orange); font-weight: bold; }
        @keyframes move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        #portal { width: 95%; max-width: 420px; margin: 15px 0; border: 2px solid #444; background: var(--terminal-bg); padding: 12px; position: relative; }

        /* 2. LIVE VALUATION ENGINE (REPLACES HEAT LINE) */
        .valuation-box { background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .price-display { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; }
        .arrow { font-size: 1.2rem; margin-right: 5px; }

        /* 3. SIGNUP GATE (SIGNUP PHASE) */
        #gate { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .gate-btn { background: var(--b-orange); color: #000; padding: 20px; font-weight: 900; border: none; cursor: pointer; width: 80%; margin-bottom: 10px; }

        /* 4. TRADE ACTIONS */
        .trade-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 10px; }
        .btn { padding: 15px; border: 1px solid #666; font-weight: 900; cursor: pointer; color: #fff; }
        .buy { background: #004400; border-color: var(--gain); }
        .sell { background: #440000; border-color: var(--loss); }

        /* 5. MAIN ASSET DISPLAY */
        .main-image { width: 100%; height: 380px; background-size: cover; background-position: center; border: 1px solid #444; margin-bottom: 10px; }

        /* 6. STOCKHOLDERS ROOM LINK */
        .room-btn { width: 100%; background: #222; color: #0ff; border: 1px solid #0ff; padding: 10px; margin: 10px 0; cursor: pointer; font-weight: bold; text-decoration: none; display: block; text-align: center; }

        /* 7. CONTROLS */
        .monitor { background: #1a1a1a; padding: 15px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .play-btn { font-size: 2rem; cursor: pointer; color: var(--b-orange); }
    </style>
</head>
<body>

    <div class="ticker-bar">
        <div class="marquee">$MMC SYMPHONY // ELIGIBILITY CHECK: PENDING // MARKET STATUS: OPEN // DIVIDEND YIELD: 8.4%</div>
    </div>

    <div id="portal">
        <div id="gate">
            <h2 style="color:var(--b-orange)">SIGNUP PHASE</h2>
            <p style="font-size: 0.7rem; padding: 0 20px;">Register your credentials to enable trading & open the terminal.</p>
            <button class="gate-btn" onclick="openPortal()">SIGN UP TO EXCHANGE</button>
            <a href="https://gspotmusiccafe-the-music-money-mark.editor.wix.com/edit/od/f900f680-fc09-4d83-9d1c-b6e2ed69747d" style="color: #666; font-size: 0.6rem;">WIX COMMUNITY LOGIN</a>
        </div>

        <div class="valuation-box">
            <div>
                <div style="font-size: 0.6rem; color: #888;">CURRENT VALUATION</div>
                <div id="price" class="price-display">$0.00</div>
            </div>
            <div id="trend" style="font-weight: bold;">---</div>
        </div>

        <div class="trade-row">
            <button class="btn buy" onclick="window.location.href='https://cash.app/$AITITRADEBROKERAGE'">BUY PRINCIPAL</button>
            <button class="btn sell" onclick="alert('Liquidation Request Sent')">SELL GAINS</button>
        </div>

        <div class="main-image" id="mainArt"></div>

        <a href="https://gspotmusiccafe-the-music-money-mark.editor.wix.com/edit/od/f900f680-fc09-4d83-9d1c-b6e2ed69747d" class="room-btn">🏛️ ENTER STOCKHOLDERS ROOM</a>

        <div class="monitor">
            <div class="play-btn" onclick="togglePlay()" id="playBtn">▶</div>
            <div style="font-size: 0.7rem; color: #666;">ASSET MONITOR // 97.7 THE FLAME</div>
            <button onclick="next()" style="background:none; border: 1px solid #444; color: #fff; padding: 5px;">SKIP</button>
        </div>
    </div>

    <audio id="player" onended="next()"></audio>

    <script>
        const assets = [
            { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc", base: 5.20 },
            { name: "ROXY BROWN", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147", base: 2.15 }
        ];

        let cur = 0;
        const p = document.getElementById('player');

        function openPortal() { document.getElementById('gate').style.display = 'none'; loadAsset(0); }

        function updateValuation() {
            const item = assets[cur];
            const change = (Math.random() * 0.10 - 0.05).toFixed(2);
            const newPrice = (item.base + parseFloat(change)).toFixed(2);
            const pDiv = document.getElementById('price');
            const tDiv = document.getElementById('trend');
            
            pDiv.innerText = `$${newPrice}`;
            if (change > 0) {
                pDiv.style.color = 'var(--gain)';
                tDiv.innerHTML = `<span class="arrow" style="color:var(--gain)">▲</span> +${change}`;
                tDiv.style.color = 'var(--gain)';
            } else {
                pDiv.style.color = 'var(--loss)';
                tDiv.innerHTML = `<span class="arrow" style="color:var(--loss)">▼</span> ${change}`;
                tDiv.style.color = 'var(--loss)';
            }
        }

        function loadAsset(i) {
            cur = i;
            const item = assets[cur];
            p.src = item.audio;
            document.getElementById('mainArt').style.backgroundImage = `url('${item.art}')`;
            updateValuation();
            p.play();
            document.getElementById('playBtn').innerText = "⏸";
        }

        function togglePlay() {
            if (p.paused) { p.play(); document.getElementById('playBtn').innerText = "⏸"; }
            else { p.pause(); document.getElementById('playBtn').innerText = "▶"; }
        }

        function next() { cur = (cur + 1) % assets.length; loadAsset(cur); }

        setInterval(updateValuation, 3000);
    </script>
</body>
</html>
