        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        
        html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        
        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .radio-console { width: 90%; max-width: 400px; padding: 40px; border: 4px double var(--gold); background: #0a0a0a; text-align: center; }
        
        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; min-height: calc(100vh - 60px); }

        @media (max-width: 1024px) {

        }

        .side-col { background: #0a0a0a; border-right: 1px solid #333; padding: 20px; }
        .main-col { background: var(--bg); border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        /* INFO CENTER FLASH LOGIC */

        .flash-msg { font-size: 0.7rem; color: #fff; font-weight: bold; letter-spacing: 1px; display: none; line-height: 1.2; }
        .flash-msg.active { display: block; animation: pulse-gold 2s infinite; }
        
        @keyframes pulse-gold { 0% { color: #fff; } 50% { color: var(--gold); } 100% { color: #fff; } }

        .flash-content { padding: 15px; color: #fff; }

        .value { text-align: right; }

        .chart-box { background: #000; border: 1px solid #333; height: 300px; position: relative; border-radius: 4px; overflow: hidden; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px; z-index: 1; }
        .candle { width: 10px; border-radius: 1px; position: relative; min-height: 5px; transition: 0.3s; }
        .wick { position: absolute; width: 2px; height: 150%; left: 4px; top: -25%; z-index: -1; }
