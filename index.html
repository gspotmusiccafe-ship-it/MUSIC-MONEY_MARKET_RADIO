<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYALTY CHECK RADIO</title>
    <style>
        body { background-color: #000; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .chassis { background: #E0E0E0; border-radius: 40px; width: 95vw; max-width: 360px; height: 90vh; max-height: 600px; padding: 20px; display: flex; flex-direction: column; align-items: center; border: 4px solid #CCC; box-sizing: border-box; }
        .brand-name { font-size: 24px; font-weight: 800; color: #000; margin: 0; text-align: center; }
        .screen { background: #111; width: 300px; height: 200px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 10px; margin-top: 20px; }
        .bar { width: 15px; background: #00ff41; height: 10px; transition: height 0.1s ease; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 40px; }
        .btn-circle { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #333; background: #FFF; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 30px; }
        #btn-rights { margin-top: 40px; color: #008000; font-weight: bold; text-decoration: none; border-bottom: 2px solid #008000; }
    </style>
</head>
<body>
    <div class="chassis">
        <h1 class="brand-name">ROYALTY CHECK RADIO</h1>
        <div class="screen" id="oscillator">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <button id="play-pause-btn" class="btn-circle">▶</button>
        <a id="btn-rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
    </div>
    <audio id="main-audio"></audio>
    <script>
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause-btn');
        const bars = document.querySelectorAll('.bar');

        // Affiliate logic
        const params = new URLSearchParams(window.location.search);
        const ref = params.get('ref') || 'direct';
        document.getElementById('btn-rights').href += `&ref=${ref}`;

        async function init() {
            const res = await fetch('radio-manifest.json');
            const data = await res.json();
            audio.src = data.playlist[0].src;
        }

        function animate() {
            if (!audio.paused) {
                bars.forEach(b => b.style.height = (Math.random() * 150 + 20) + 'px');
            }
            requestAnimationFrame(animate);
        }

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.innerText = "❚❚"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        };

        audio.onended = () => { 
            audio.pause(); 
            playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>'; 
            playBtn.disabled = true; 
        };

        init();
        animate();
    </script>
</body>
</html>
