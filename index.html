<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { 
            --neon: #00ff00; 
            --gold: #ffcc00; 
            --bg: #000; 
            --glass: rgba(255, 255, 255, 0.05);
            --red: #ff3333; 
            --cash: #00d632;
        }
        
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; overflow-x: hidden; }
        
        /* THE GLASS INFO CENTER (FIXED STYLE) */
        #info-center { 
            min-height: 130px; 
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 204, 0, 0.4);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 25px; 
            text-align: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,204,0,0.05);
            margin-bottom: 20px;
        }

        .flash-msg { 
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem; 
            color: #fff; 
            font-weight: 900; 
            display: none; 
            line-height: 1.6; 
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255,204,0,0.6);
        }
        .flash-msg.active { display: block; }

        /* THE GLASS BUTTONS (NO FLAT BLOCKS) */
        .glass-btn {
            display: block; width: 100%; padding: 22px; margin-bottom: 18px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 204, 0, 0.5);
            color: var(--gold);
            font-family: 'Syncopate', sans-serif;
            font-weight: 900; font-size: 0.75rem; text-align: center; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .glass-btn:hover {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
            transform: scale(1.02);
        }

        .btn-cash { border: 1px solid var(--cash); color: var(--cash); }
        .btn-cash:hover { background: rgba(0, 214, 50, 0.1); border-color: #00ff00; }

        /* LAYOUT & SCALING */
        .dashboard { display: grid; grid-template-columns: 380px 1fr 340px; height: calc(100vh - 70px); gap: 15px; padding: 15px; }
        .side-col { background: rgba(15, 15, 15, 0.8); border: 1px solid #222; padding: 25px; overflow-y: auto; }
        
        .oscillator-main { font-size: 4.8rem; color: white; font-weight: 900; letter-spacing: -6px; line-height: 1; font-family: 'Syncopate', sans-serif; margin: 15px 0; }
        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); background-size: cover; background-position: center; filter: contrast(1.1); box-shadow: 0 0 30px rgba(0,0,0,1); }
        
        .ledger-row { display: grid; grid-template-columns: 1fr 80px; padding: 20px; border-bottom: 1px solid #1a1a1a; cursor: pointer; font-size: 0.85rem; font-weight: 700; }
        .ledger-row:hover { background: rgba(255,204,0,0.1); border-left: 4px solid var(--gold); }
        
        /* ORDER FLOW FIX */
        #order-flow { background: rgba(5,5,5,0.9); border: 1px solid #222; height: 180px; padding: 15px; overflow: hidden; font-size: 0.7rem; color: #aaa; }
        .flow-line { border-bottom: 1px solid #111; padding: 5px 0; display: flex; justify-content: space-between; }
    </style>
</head>
