<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMM // LIVE EXCHANGE</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --red: #ff3333; }
        body { margin: 0; background: var(--bg); color: white; font-family: monospace; text-transform: uppercase; text-align: center; }
        
        .header { padding: 10px; border-bottom: 1px solid #333; font-size: 0.8rem; color: var(--gold); }
        .oscillator-container { padding: 40px 20px; background: #0a0a0a; border-bottom: 2px solid #222; }
        #main-osc { font-size: 5rem; font-weight: 900; margin: 10px 0; color: white; }
        #roi-text { font-size: 1.5rem; color: var(--neon); }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        button { padding: 20px; font-weight: bold; border: none; cursor: pointer; font-family: monospace; font-size: 1.2rem; }
        .btn-invest { background: var(--neon); color: black; }
        .btn-liquidate { background: var(--red); color: white; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 15px; font-size: 0.7rem; background: #111; border-top: 1px solid #333; }
        #order-flow { height: 150px; overflow: hidden; background: black; padding: 10px; font-size: 0.7rem; color: #666; text-align: left; }
    </style>
</head>
<body>

<div class="header">
    97.7 THE FLAME // <span id="price-change">BOUNCE: 0%</span>
</div>

<div class="oscillator-container">
    <div id="radio-track" style="color:var(--gold); font-size: 0.9rem;">-- LOADING --</div>
    <div id="main-osc">$0.00</div>
    <div id="roi-text">0% POTENTIAL</div>
</div>

<div class="btn-row">
    <button class="btn-invest" onclick="openInvest()">INVEST</button>
    <button class="btn-liquidate" onclick="processLiquidate()">LIQUIDATE</button>
</div>

<div class="stats">
    <div style="color:var(--gold)">115 BLOCK QUEUE</div>
    <div id="queue-count" style="text-align:right">0 / 115</div>
    <div style="color:var(--gold)">BLOCK BUDGET</div>
    <div style="text-align:right">$1,000.00</div>
</div>

<div id="order-flow"></div>

<audio id="main-audio-engine" loop></audio>

<script>
    const assets = [
        { name: "SCENE BY SCENE", base: 1.00, audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a" },
        { name: "SUPERFLY", base: 5.00, audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293" }
    ];

    let _Q_COUNT = 0;
    let currentIdx = 0;

    // The Kick-Off
    window.onload = function() {
        sync(0);
        setInterval(marketPulse, 160); // Sporadic Bounce
    };

    function marketPulse() {
        const a = assets[currentIdx];
        const bounce = Math.random();
        const livePrice = (a.base + (bounce * a.base)).toFixed(2);
        const roi = (bounce * 100).toFixed(0);

        document.getElementById('main-osc').innerText = "$" + livePrice;
        document.getElementById('roi-text').innerText = roi + "% POTENTIAL";
        document.getElementById('price-change').innerText = "BOUNCE: " + roi + "%";
        
        // Green color if over 85% ROI
        document.getElementById('main-osc').style.color = (bounce > 0.85) ? "#00ff00" : "white";
    }

    function openInvest() {
        let choice = prompt("GATEWAYS: 1.CASHAPP 2.PAYPAL 3.STRIPE 4.BNB 5.BTC");
        if(choice) alert("CONNECTING...");
    }

        _Q_COUNT++;
        const flow = document.getElementById('order-flow');
        const price = document.getElementById('main-osc').innerText;
