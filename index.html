<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONGSHARE OPPORTUNITY | MUSIC MONEY MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --neon: #00ff41;
            --gold: #ffd700;
            --panel: #111;
        }

        body { 
            font-family: 'JetBrains+Mono', monospace; 
            background-color: #050505; 
            color: var(--neon); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            text-transform: uppercase;
        }

        .portal-container {
            width: 100%;
            max-width: 420px;
            background: #000;
            border: 1px solid #333;
            border-radius: 2px;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
        }

        .header-strip {
            background: #111;
            padding: 8px 12px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .image-frame {
            position: relative;
            border-bottom: 1px solid #333;
            background: #161616;
        }

        .asset-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border-left: 4px solid var(--gold);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #0a0a0a;
            border-bottom: 1px solid #222;
        }

        .stat-box {
            padding: 12px;
            border-right: 1px solid #222;
            text-align: center;
        }

        .stat-box:last-child { border-right: none; }

        .price-section {
            padding: 30px 20px;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            text-align: center;
        }

        .buy-btn {
            background: #00d632;
            color: white;
            padding: 18px;
            width: 100%;
            display: block;
            font-weight: 900;
            font-size: 1.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 0 #008000;
            transition: all 0.2s;
        }

        .buy-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #008000;
        }

        .secondary-btn {
            border: 1px solid #444;
            color: #888;
            padding: 10px;
            font-size: 10px;
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="header-strip">
            <span class="text-white">97.7 THE FLAME</span>
            <span class="animate-pulse">● LIVE ASSET</span>
        </div>

        <div class="image-frame">
            <img src="https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" 
                 class="w-full block" alt="Song Cover">
            
            <div class="asset-label">
                <h1 class="text-white text-xl font-bold leading-none">SUPERFLY</h1>
                <p class="text-[10px] text-gray-500 mt-1 tracking-widest">ATFY-9C4D7 // NATIVE ASSET</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <p class="text-[9px] text-gray-500 mb-1">BUY-IN</p>
                <p class="text-sm font-bold text-white">$5.00</p>
            </div>
            <div class="stat-box">
                <p class="text-[9px] text-gray-500 mb-1">MBBP</p>
                <p class="text-sm font-bold text-white">$5.05</p>
            </div>
            <div class="stat-box">
                <p class="text-[9px] text-gray-500 mb-1">SPLIT</p>
                <p class="text-sm font-bold text-white">90/10</p>
            </div>
        </div>

        <div class="price-section">
            <p class="text-[10px] text-gray-500 tracking-[0.2em] mb-2">LIVE OFFER PRICE</p>
            <div class="text-5xl font-black text-white tracking-tighter mb-8">
                $5.84 
                <span class="text-xs text-green-500 align-top ml-1 font-normal">+8.8%</span>
            </div>

            <a href="https://cash.app/$AITITRADEBROKERAGE" class="buy-btn mb-4">
                EXECUTE TRADE
            </a>

            <div class="flex gap-2">
                <div class="secondary-btn">AUDIO PREVIEW</div>
                <div class="secondary-btn">TRUST VAULT</div>
            </div>
        </div>

        <div class="p-3 bg-black border-t border-gray-900 text-center">
            <p class="text-[8px] text-gray-600 tracking-widest">
                AITITRADE SOVEREIGN TRUST // PROTECTED BY KINETIC LOGIC
            </p>
        </div>
    </div>

</body>
</html>
