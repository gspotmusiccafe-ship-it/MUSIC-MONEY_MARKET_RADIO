<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        
        /* FIXING THE BLACK SCREEN OVERLAY */
        #init-overlay { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 99999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
        }
        .radio-console { 
            border: 4px double var(--gold); 
            padding: 40px; 
            background: #0a0a0a; 
            text-align: center; 
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.2);
        }

        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: calc(100vh - 60px); }
        
        .side-col { background: #0a0a0a; border-right: 1px solid #333; overflow-y: auto; padding: 20px; }
        .main-col { background: var(--bg); border-right: 1px solid #333; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* CANDLE CHART RESTORATION */
        .chart-box { background: #000; border: 1px solid #333; height: 300px; position: relative; border-radius: 4px; overflow: hidden; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px; z-index: 1; }
        .candle { width: 10px; position: relative; min-height: 5px; transition: height 0.3s ease; }
        .wick { position: absolute; width: 2px; height: 140%; left: 4px; top: -20%; z-index: -1; }

        /* TYPOGRAPHY */
        .oscillator-main { font-size: 4rem; color: white; font-weight: 900; letter-spacing: -4px; line-height: 0.9; text-align: center; }
        .album-art { width: 100%; aspect-ratio: 1; border: 3px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 20px; }
        
        /* BUTTONS */
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 18px; width: 100%; text-align: center; border: none; display: block; margin-bottom: 12px; cursor: pointer; text-decoration: none; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 20px; width: 100%; text-align: center; border: none; display: block; font-size: 1rem; cursor: pointer; text-decoration: none; }

        /* THE BLOCK STYLE SONGSHARE MESSAGE */
        .songshare-flash {
            background: #000;
            border: 3px solid var(--gold);
            margin: 20px 0;
            padding: 0;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
            animation: snap-in 0.2s ease-out;
        }
        .flash-header {
            background: var(--gold);
            color: #000;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            padding: 12px;
            letter-spacing: -1px;
        }
        .flash-content { padding: 20px; color: #fff; }
        .flash-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px; font-size: 0.8rem; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .label { color: var(--gold); font-weight: 900; }
        .value { text-align: right; font-weight: 700; }
        .benefit-tag { background: #111; color: var(--neon); font-size: 0.7rem; padding: 10px; margin-bottom: 5px; border-left: 4px solid var(--neon); font-weight: 900; }

        #order-flow { background: #080808; border: 1px solid #222; min-height: 400px; font-size: 0.75rem; padding: 15px; display: flex; flex-direction: column-reverse; gap: 8px; }
        .trade-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #111; opacity: 0.7; }
        
        @keyframes snap-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="init-overlay" onclick="startEngine()">
    <div class="radio-console">
        <h1 class="text-yellow-500 font-black text-3xl mb-6">97.7 THE FLAME</h1>
        <div class="bg-yellow-500 text-black font-black py-4 px-8 text-xl animate-pulse">ENTER TERMINAL</div>
        <p class="text-green-500 text-[10px] mt-4 font-bold tracking-[4px]">AITIFY ORGANIZATIONAL HUB</p>
    </div>
</div>

<header>
    <div class="font-bold text-xs">GLOBAL PRE-RELEASE // MUSIC MONEY MARKET</div>
    <div class="text-yellow-500 font-black animate-pulse text-xs">● LIVE CONNECTION</div>
</header>

<div class="dashboard">
    <aside class="side-col">
        <a href="#" class="btn-gold">TRADE SONG</a>
        <div class="album-art" style="background-image: url('https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982');"></div>
        <div class="bg-[#151515] p-6 border border-[#333]">
            <div id="radio-track" class="text-yellow-500 text-center text-[11px] mb-3 font-bold">--</div>
            <div id="main-osc" class="oscillator-main mb-2">$1.00</div>
            <div id="price-arrow" class="font-bold text-center text-2xl mb-6 text-green-500">▲ +0.00</div>
            
            <div class="flex flex-col gap-3">
                <a href="https://cash.app/f/POOL?id=52fqk4xl" target="_blank" class="border-2 border-yellow-500 text-yellow-500 font-black py-4 text-center text-[10px] no-underline">SONGSHARE PARTNER: $100</a>
                <a href="https://payhip.com/QUEENBUTTAMUSIC" target="_blank" class="btn-cash">BUY ALBUM: $9.99</a>
                <a id="buy-btn" href="https://cash.app/f/POOL?id=tgva6fj4" target="_blank" class="border border-white text-white py-3 text-center text-[10px] font-bold no-underline opacity-80">BUY SONG: $1.00</a>
            </div>
        </div>
    </aside>

    <main class="main-col">
        <div class="chart-box">
            <div id="candle-layer"></div>
            <svg width="100%" height="100%" viewBox="0 0 1000 300" preserveAspectRatio="none" style="position:absolute; top:0; z-index:2;">
                <path id="kinetic-line" d="" fill="none" stroke="#00ff00" stroke-width="3" style="filter: drop-shadow(0 0 5px #00ff00);"/>
            </svg>
        </div>
        <div id="order-flow"></div>
    </main>

    <aside class="side-col" style="border-left: 1px solid #333;">
        <div class="text-yellow-500 font-bold border-b border-yellow-500 pb-3 mb-4 text-xs tracking-widest">MASTER LEDGER</div>
        <div id="list-target" class="text-[10px]"></div>
        <div class="mt-10 p-4 border border-dashed border-[#444] text-[9px] text-gray-500">
            RETAILER_ID: <span id="partner-id" class="text-white">DIRECT</span>
        </div>
    </aside>
</div>

<audio id="main-audio-engine"></audio>

<script>
    const assets = [
        { name: "LOVE MAKE OVER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLOVE%20MAKE%20OVER.mp3?alt=media&token=df587b6b-eed4-4f5b-b340-a5b5622efb31" },
        { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FSUPERFLY.mp3?alt=media&token=e260aa5d-a3c9-453e-8b80-a466a6328906" }
    ];

    const songshareData = {
        title: "SONGSHARE OPPORTUNITY",
        stats: [
            ["SONGSHARE OFFERED", "QUEEN BUTTA"],
            ["SONGSHARE STATUS", "PRE-RELEASE"],
            ["RECORD LABEL", "G. SPOT RECORDS"],
            ["PARTNER CAP", "50 RETAILERS"],
            ["INVESTMENT", "$100.00"]
        ],
        benefits: ["50% RETAIL SALES EARNINGS", "PERSONAL ID TRACKING APP", "25% MARKET ENGAGEMENT", "GLOBAL ROYALTY SHARES"]
    };

    let price = 1.00; let history = [1.00]; let engineStarted = false;

    function startEngine() {
        const overlay = document.getElementById('init-overlay');
        if (overlay) overlay.style.display = 'none';
        if (engineStarted) return;
        engineStarted = true;

        assets.forEach((a, i) => {
            document.getElementById('list-target').innerHTML += `<div class="flex justify-between py-2 border-b border-[#111]"><span>${a.name}</span><span class="text-yellow-500 font-bold">$1.00</span></div>`;
        });

        setInterval(tick, 2000);
        document.getElementById('radio-track').innerText = assets[0].name;
    }

    function tick() {
        const flow = document.getElementById('order-flow');
        const isLogic = Math.random() > 0.8;

        if (isLogic) {
            const flash = document.createElement('div');
            flash.className = 'songshare-flash';
            let statHtml = songshareData.stats.map(s => `<div class="label">${s[0]}</div><div class="value">${s[1]}</div>`).join('');
            let benefitHtml = songshareData.benefits.map(b => `<div class="benefit-tag">▶ ${b}</div>`).join('');
            flash.innerHTML = `<div class="flash-header">${songshareData.title}</div><div class="flash-content"><div class="flash-grid">${statHtml}</div>${benefitHtml}</div>`;
            flow.appendChild(flash);
        } else {
            const up = Math.random() > 0.5;
            const change = (Math.random() * 0.2).toFixed(2);
            price = up ? price + parseFloat(change) : Math.max(1, price - parseFloat(change));
            
            const row = document.createElement('div');
            row.className = 'trade-row';
            row.style.color = up ? "var(--neon)" : "var(--red)";
            row.innerHTML = `<span>RETAIL_ORDER_EXECUTED</span><span>$${price.toFixed(2)}</span>`;
            flow.appendChild(row);

            document.getElementById('main-osc').innerText = `$${price.toFixed(2)}`;
            document.getElementById('main-osc').style.color = up ? "white" : "var(--red)";
            document.getElementById('price-arrow').innerHTML = `${up ? "▲ +" : "▼ -"}${change}`;
            document.getElementById('price-arrow').style.color = up ? "var(--neon)" : "var(--red)";
            
            history.push(price); if(history.length > 40) history.shift();
            updateChart(up);
        }
        if (flow.children.length > 15) flow.removeChild(flow.firstChild);
    }

    function updateChart(up) {
        const layer = document.getElementById('candle-layer');
        const c = document.createElement('div');
        c.className = "candle";
        c.style.height = (price * 20) + "px";
        c.style.background = up ? "var(--neon)" : "var(--red)";
        c.innerHTML = `<div class="wick" style="background:${up ? "var(--neon)" : "var(--red)"}"></div>`;
        layer.appendChild(c);
        if(layer.children.length > 25) layer.removeChild(layer.firstChild);
        
        const path = document.getElementById('kinetic-line');
        let d = `M 0 ${300 - (history[0] * 20)}`;
        history.forEach((p, i) => {
            const x = (i / (history.length - 1)) * 1000;
            const y = 300 - (p * 20);
            d += ` L ${x} ${y}`;
        });
        path.setAttribute('d', d);
    }
</script>
</body>
</html>
