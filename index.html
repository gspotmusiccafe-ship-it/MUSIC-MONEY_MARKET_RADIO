<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MUSIC MONEY MARKET // PORTAL</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        /* 1. TICKER AT THE VERY TOP */
        .ticker-bar { width: 100%; background: #111; border-bottom: 2px solid #0ff; padding: 10px 0; box-shadow: 0 0 15px #0ff; }
        .marquee { display: inline-block; white-space: nowrap; animation: move 20s linear infinite; color: #0f0; font-weight: 900; }
        @keyframes move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* THE NEON ENCAPSULATED PORTAL */
        #portal { width: 95%; max-width: 420px; margin: 15px 0; border: 3px solid #0ff; background: #050505; box-shadow: 0 0 30px #0ff; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; }

        /* 2. TOP OF PORTAL: SONG NAME & OSCILLATOR */
        .oscillator-box { width: 100%; text-align: center; padding: 10px 0; border-bottom: 1px solid #333; }
        .song-trading { font-size: 1.2rem; font-weight: 900; color: #fff; text-shadow: 0 0 5px #0ff; margin-bottom: 5px; }
        .oscillator { height: 30px; width: 80%; margin: 0 auto; background: repeating-linear-gradient(90deg, #f00, #f00 2px, #0f0 2px, #0f0 4px); animation: pulse 0.5s infinite alternate; border: 1px solid #555; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

        /* 3. BUY GREEN / RED SELL BUTTONS */
        .trade-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; padding: 15px 0; }
        .btn-trade { padding: 15px; border: none; font-weight: 900; text-transform: uppercase; border-radius: 4px; cursor: pointer; }
        .buy-btn { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
        .sell-btn { background: #f00; color: #fff; box-shadow: 0 0 15px #f00; }

        /* 4. THE IMAGE */
        .main-image { width: 100%; height: 350px; background-size: cover; background-position: center; border: 1px solid #333; box-shadow: inset 0 0 40px #000; }

        /* 5. SONG TITLE SONGSATION */
        .title-display { padding: 15px 0; font-size: 0.9rem; font-weight: bold; color: #f0f; text-transform: uppercase; }

        /* 6. RADIO MONITOR CONTROLS */
        .monitor-row { width: 100%; display: flex; justify-content: space-around; align-items: center; background: #111; padding: 10px 0; border: 1px solid #333; margin-bottom: 10px; }
        .play-pause { font-size: 2rem; cursor: pointer; color: #0f0; }
        .skip-asset { background: #444; color: #fff; padding: 10px 20px; border: 1px solid #0ff; cursor: pointer; font-weight: 900; }

        /* 7. SLIDING ALBUM COVERS */
        .album-slider { width: 100%; overflow-x: auto; white-space: nowrap; padding: 15px 0; border-top: 1px solid #333; }
        .slide-card { display: inline-block; width: 80px; margin: 0 8px; cursor: pointer; transition: 0.3s; }
        .slide-card img { width: 100%; border: 1px solid #0ff; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="ticker-bar">
        <div class="marquee">$MMC SYMPHONY ▲ $0.000125 | MARKET: OPEN | DIVIDEND YIELD: ACTIVE | HOLD PRINCIPAL - PAY GAINS</div>
    </div>

    <div id="portal">
        <div class="oscillator-box">
            <div class="song-trading" id="topName">TRADING: ---</div>
            <div class="oscillator"></div>
        </div>

        <div class="trade-row">
            <button class="buy-btn btn-trade" onclick="window.location.href='https://cash.app/$AITITRADEBROKERAGE'">BUY STOCK</button>
            <button class="sell-btn btn-trade" onclick="alert('Trade Request Logged in Ledger')">SELL/TRADE</button>
        </div>

        <div class="main-image" id="mainArt"></div>

        <div class="title-display" id="titleFull">SONGSATION: ---</div>

        <div class="monitor-row">
            <div class="play-pause" id="playBtn" onclick="togglePlay()">▶</div>
            <button class="skip-asset" onclick="next()">SKIP ASSET</button>
        </div>

        <div class="album-slider" id="slider"></div>
    </div>

    <audio id="player" onended="next()"></audio>

    <script>
        const assets = [
            { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" },
            { name: "ROXY BROWN", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147" }
        ];

        let cur = 0;
        const p = document.getElementById('player');
        const playBtn = document.getElementById('playBtn');

        function loadAsset(i) {
            cur = i;
            const item = assets[cur];
            p.src = item.audio;
            document.getElementById('mainArt').style.backgroundImage = `url('${item.art}')`;
            document.getElementById('topName').innerText = `TRADING: ${item.name}`;
            document.getElementById('titleFull').innerText = `SONGSATION: ${item.name}`;
            p.play();
            playBtn.innerText = "⏸";
        }

        function togglePlay() {
            if (p.paused) { p.play(); playBtn.innerText = "⏸"; }
            else { p.pause(); playBtn.innerText = "▶"; }
        }

        function next() { cur = (cur + 1) % assets.length; loadAsset(cur); }

        assets.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'slide-card';
            card.onclick = () => loadAsset(index);
            card.innerHTML = `<img src="${item.art}">`;
            document.getElementById('slider').appendChild(card);
        });

        window.onload = () => loadAsset(0);
    </script>
</body>
</html>
