<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONGSHARE RADIO 97.7 THE FLAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
    .panel { background: #1a1a1a; border: 4px solid #444; border-radius: 8px; box-shadow: 10px 10px 20px #000; }
    .btn-buy { background: #065f46; border: 2px solid #10b981; padding: 15px 30px; font-weight: bold; cursor: pointer; color: #fff; }
    #album-art { border: 4px inset #333; }
</style> 
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <div class="panel p-8 max-w-sm w-full text-center">
        <h1 id="vault-display" class="mb-6 text-2xl font-bold text-emerald-400">SONGSHARE RADIO</h1>
        <img id="album-art" class="w-full h-64 object-cover mb-6 border-4 border-gray-800" src="" alt="Album Art">
        
        <div class="flex flex-col gap-4">
            <button id="play-btn" class="btn-buy hover:bg-emerald-700">PLAY</button>
            <a id="btn-purchase" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0" class="text-emerald-500 underline text-sm">BUY LICENSE</a>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script>
        let radio = { manifest: null, currentTrack: 0, isLocked: false };

        async function initRadio() {
            try {
                const response = await fetch('radio-manifest.json');
                radio.manifest = await response.json();
                document.getElementById('vault-display').innerText = radio.manifest.artist;
                document.getElementById('album-art').src = radio.manifest.albumArt;
                document.getElementById('main-audio').src = radio.manifest.playlist[0].src;
            } catch(e) { console.log("Manifest error"); }
        }

        document.getElementById('play-btn').onclick = () => {
            if(!radio.isLocked) {
                document.getElementById('main-audio').play();
                document.getElementById('play-btn').innerText = "PLAYING...";
            }
        };

        document.getElementById('main-audio').onended = () => {
            radio.currentTrack++;
            if (radio.currentTrack < radio.manifest.playlist.length) {
                document.getElementById('main-audio').src = radio.manifest.playlist[radio.currentTrack].src;
                document.getElementById('main-audio').play();
            } else {
                radio.isLocked = true;
                document.getElementById('play-btn').disabled = true;
                document.getElementById('play-btn').innerText = "LOCKED // PURCHASE REQUIRED";
            }
        };

        initRadio();
    </script>
</body>
</html>
