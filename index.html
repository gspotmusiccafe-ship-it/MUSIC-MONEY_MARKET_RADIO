<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        .check { background: #fdfaf0; width: 350px; padding: 20px; border: 2px solid #000; box-shadow: 0 5px 20px #000; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .logo { width: 50px; height: 50px; border: 1px solid #000; }
        .line { border-bottom: 1px solid #000; margin: 15px 0; height: 15px; }
        .stub { background: #ddd; padding: 10px; margin-top: 20px; border-top: 2px dashed #000; text-align: center; }
        #play-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #000; background: #fff; cursor: pointer; }
        #rights { display: block; margin-top: 10px; padding: 10px; background: #008000; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="check">
        <div class="header">
            <div class="logo"><img src="" id="art" style="width:100%"></div>
            <div>ROYALTY CHECK RADIO</div>
        </div>
        <div style="margin-top:20px;">PAY TO: LICENSEE ________________ $30.00</div>
        <div class="line">MEMO: QUEEN BUTTA ROYALTIES</div>
        
        <div class="stub">
            <div id="info" style="font-size:10px;">QUEEN BUTTA | SUPERFLY | R&B</div>
            <button id="play-btn">▶</button>
            <a id="rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="audio"></audio>
    <script>
        const audio = document.getElementById('audio'), btn = document.getElementById('play-btn'), info = document.getElementById('info');
        let m = null, idx = 0;
        fetch('radio-manifest.json').then(r => r.json()).then(d => { m = d; audio.src = d.playlist[0].src; document.getElementById('art').src = d.albumArt; });
        btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); btn.innerText = audio.paused ? '▶' : '❚❚'; };
        audio.onended = () => {
            idx++;
            if(idx < 12 && idx < m.playlist.length) { audio.src = m.playlist[idx].src; audio.play(); info.innerText = m.playlist[idx].title; }
            else { btn.innerHTML = '🔒'; btn.disabled = true; }
        };
    </script>
</body>
</html>
