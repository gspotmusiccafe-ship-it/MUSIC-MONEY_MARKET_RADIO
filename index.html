        { id: "QB10", name: "I DESERVE", buy: 1.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI%20DESERVE.mp3?alt=media&token=0bed5d76-783b-4ea4-9b12-9085d96bbf9c" },
        { id: "QB11", name: "THAT GIRL FROM THE GHETTO", buy: 1.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTHAT%20GIRL%20FROM%20THE%20GHETTO.mp3?alt=media&token=a9f526a4-2567-4225-a8c2-dbac509f03de" },
        { id: "QB12", name: "MIDNIGHT SMOKE", buy: 1.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FMIDNIGHT%20SMOKE.mp3?alt=media&token=8ba90c94-61cf-4fce-84bc-6c8a0c6a0105" },
        { id: "QB13", name: "BETTER THAN GOOD", buy: 1.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FBETTER%20THAN%20GOOD%20(1).mp3?alt=media&token=5b6a259d-7c57-4f1e-9c2d-121f9d3ee15a" }
    ];

    let currentIdx = 0; 
    let points = []; 
    let headY = 150; 
    let velocity = 0; 
    let engineStarted = false;
    let targetPrice = 15.00;

    function startEngine() {
        if (engineStarted) return;
        engineStarted = true;
        document.getElementById('init-overlay').style.display = 'none';
        
        const list = document.getElementById('list-target');
        const cards = document.getElementById('asset-cards');
        const volBars = document.getElementById('volume-bars');
        
        assets.forEach((a, i) => {
            list.innerHTML += `<div class="watch-item" id="ledger-${i}" onclick="sync(${i})">${a.name}<br><span class="price-val" style="color:white; font-size:0.55rem;">VAL: $${a.buy.toFixed(2)}</span></div>`;
            cards.innerHTML += `<div class="data-card" onclick="sync(${i})"><div class="card-price" style="color:var(--gold)">PRICE: $${a.buy.toFixed(2)}</div><div>${a.name}</div><div style="font-size:0.5rem; opacity:0.7;">ASSET: ${a.id}</div></div>`;
        });

        for(let i=0; i<40; i++) {
            volBars.innerHTML += `<div class="v-bar" style="flex:1; background:var(--neon); height:20%; opacity:0.6; border-radius:1px;"></div>`;
        }
        for (let i = 0; i <= 50; i++) points.push({ x: (1000 / 50) * i, y: 150 });
        
        setInterval(updateLiquidChart, 40);
        setInterval(updatePrices, 1000);
        setInterval(simulateTradeDemand, 2500); 
        sync(0);
    }

    function simulateTradeDemand() {
        const side = Math.random() > 0.3 ? "BUY" : "SELL"; // Heavy Buy Bias
        executePriceMove(side);
    }

    function executePriceMove(side) {
        const flow = document.getElementById('order-flow');
        const asset = assets[currentIdx];
        const impact = 0.05; // Each order moves price by $0.05

        if (side === "BUY") {
            asset.buy += impact;
            velocity -= 8; // Chart pulses UP
        } else {
            asset.buy = Math.max(1.00, asset.buy - impact);
            velocity += 5; // Chart pulses DOWN
        }

        // Update UI displays
        document.getElementById('main-osc').innerText = `$${asset.buy.toFixed(2)}`;
        document.getElementById('ledger-' + currentIdx).querySelector('.price-val').innerText = `VAL: $${asset.buy.toFixed(2)}`;
        
        // Log Trade in Order Flow
        const amt = (Math.random()*100 + 1).toFixed(0);
        const row = document.createElement('div');
        row.className = 'trade-row';
        row.style.color = side === "BUY" ? "var(--neon)" : "var(--red)";
        row.innerHTML = `<span>${side} SONGSHARE</span> <span>QTY: ${amt}</span>`;
        flow.prepend(row);
        if(flow.children.length > 5) flow.removeChild(flow.lastChild);
    }

    function updateLiquidChart() {
        velocity *= 0.85; 
        headY += velocity;
        
        // Map Price to Y-axis: $1.00 = Bottom, $15.00 = Top
        let priceTargetY = 250 - ((assets[currentIdx].buy - 1) / (targetPrice - 1) * 200);
        headY += (priceTargetY - headY) * 0.1; // Smooth trend toward current price val

        if (headY < 20 || headY > 280) velocity *= -1;
        
        for (let i = 0; i < points.length - 1; i++) points[i].y = points[i+1].y;
        points[points.length - 1].y = headY;
        
        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 0; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            d += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
        }
        document.getElementById('kinetic-line').setAttribute('d', d);
        document.getElementById('pulse-head').setAttribute('cx', points[points.length-1].x);
        document.getElementById('pulse-head').setAttribute('cy', points[points.length-1].y);
    }

    function updatePrices() {
        // Forecast Calculation: Weeks to Reach $15.00
        let current = assets[currentIdx].buy;
        let diff = targetPrice - current;
        let weeks = (diff / 0.85).toFixed(1); // Assuming 0.85 growth per week
        
        // Update Token Ticker
        let base = 0.00001000 + (current * 0.00000001);
        document.getElementById('coin-price').innerText = `$${base.toFixed(8)}`;
        document.getElementById('mkt-cap').innerText = `$${(100000000 * base).toLocaleString()}`;
    }

    function sync(idx) {
        currentIdx = idx; const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('art-frame').style.backgroundImage = `url('${a.img}')`;
        document.getElementById('main-osc').innerText = `$${a.buy.toFixed(2)}`;
        document.getElementById('buy-link').innerText = `PURCHASE ORDER: ${a.name} ($1.00 PRE-SALE)`;
        const audio = document.getElementById('main-audio-engine');
        audio.src = a.audio; audio.play().catch(() => {});
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
    function playCurrent() { document.getElementById('main-audio-engine').play(); }
</script>
