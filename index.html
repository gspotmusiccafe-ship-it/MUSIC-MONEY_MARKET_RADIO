<script>
    // 1. THE ASSET VAULT (Mapped with your Firebase Links)
    const assets = [
        { 
            id: "A01", 
            name: "SCENE BY SCENE", 
            roi: 15, 
            buy: 1.00, 
            img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72",
            audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a"
        },
        { 
            id: "A02", 
            name: "SUPERFLY", 
            roi: 35, 
            buy: 5.00, 
            img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc",
            audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293"
        },
        { 
            id: "A03", 
            name: "I GOT WHAT YOU NEED", 
            roi: 50, 
            buy: 5.00, 
            img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147",
            audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media&token=a5cf44ea-56ef-49f8-839c-0b9d2c3c250c"
        },
        { 
            id: "A04", 
            name: "ZODIAC SIGN", 
            roi: 85, 
            buy: 10.00, 
            img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN-J.%20MARIE.png?alt=media&token=763cef9d-c8dd-48ad-bc37-f701d1cf6a9a",
            audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN.mp3?alt=media&token=915fde66-5e25-401e-ab03-61a0a5642630"
        }
    ];

    // 2. THE HIGH-VELOCITY OSCILLATOR (MARKET ALIVE)
    function startOverclockedPulse() {
        setInterval(() => {
            // Main Desk Pulse
            const mainVal = (Math.random()).toFixed(2);
            document.getElementById('main-osc').innerText = `$${mainVal}`;
            
            // Grid Jitter
            assets.forEach(a => {
                const cardOsc = document.getElementById(`card-osc-${a.id}`);
                if(cardOsc) {
                    cardOsc.innerText = `$${(Math.random()).toFixed(2)}`;
                    cardOsc.style.color = Math.random() > 0.7 ? "var(--gold)" : "var(--neon)";
                }
            });
        }, 150); // Fast 150ms vibration
    }

    // 3. BROADCAST SYNC (Music & Image)
    let currentAssetIndex = 0;

    function syncBroadcast(index) {
        const asset = assets[index];
        const audio = document.getElementById('main-audio-engine');
        const artFrame = document.getElementById('art-frame');
        
        // Update UI
        document.getElementById('radio-track').innerText = asset.name;
        document.getElementById('radio-roi').innerText = `${asset.roi}% PREDETERMINED ROI`;
        
        // Swap Image
        artFrame.style.backgroundImage = `url('${asset.img}')`;
        artFrame.style.backgroundSize = "cover";
        artFrame.innerHTML = ""; // Remove placeholder text

        // Play Sound
        audio.src = asset.audio;
        audio.play();

        // Update System Status
        document.getElementById('sys-status').innerText = `BROADCASTING: ${asset.name} // BUY: $${asset.buy}`;
    }

    // Wiring the Navigation Buttons
    function nextAsset() {
        currentAssetIndex = (currentAssetIndex + 1) % assets.length;
        syncBroadcast(currentAssetIndex);
    }

    function prevAsset() {
        currentAssetIndex = (currentAssetIndex - 1 + assets.length) % assets.length;
        syncBroadcast(currentAssetIndex);
    }

    // Initialize on Startup
    startOverclockedPulse();
    // syncBroadcast(0); // Uncomment this to auto-play on load
</script>
