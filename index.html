<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        
        html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains+Mono', monospace; text-transform: uppercase; }
        
        #init-overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .radio-console { width: 90%; max-width: 400px; padding: 40px; border: 4px double var(--gold); background: #0a0a0a; text-align: center; }
        
        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: calc(100vh - 60px); }

        @media (max-width: 1024px) {
            .dashboard { display: flex; flex-direction: column; height: auto; }
            .side-col, .main-col { width: 100% !important; height: auto !important; border: none; border-bottom: 2px solid #222; overflow: visible !important; }
        }

        .side-col { background: #0a0a0a; border-right: 1px solid #333; overflow-y: auto; padding: 20px; }
        .main-col { background: var(--bg); border-right: 1px solid #333; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .chart-box { background: #000; border: 1px solid #333; height: 300px; position: relative; border-radius: 4px; overflow: hidden; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px; z-index: 1; }
        .candle { width: 10px; border-radius: 1px; position: relative; min-height: 5px; }
        .wick { position: absolute; width: 2px; height: 150%; left: 4px; top: -25%; z-index: -1; }

        .ledger-row { display: grid; grid-template-columns: 1fr 80px; gap: 10px; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
        .ledger-row:hover { background: #111; border-left: 4px solid var(--gold); }

        .oscillator-main { font-size: 4rem; color: white; font-weight: 900; letter-spacing: -4px; line-height: 0.9; }
        .album-art { width: 100%; aspect-ratio: 1; border: 3px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 20px; }
        
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 18px; width: 100%; text-align: center; border: none; display: block; margin-bottom: 12px; cursor: pointer; text-decoration: none; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 22px; width: 100%; text-align: center; border: none; display: block; font-size: 1.2rem; cursor: pointer; text-decoration: none; }
        
        #order-flow { background: #080808; border: 1px solid #222; height: 220px; overflow: hidden; font-size: 0.7rem; padding: 12px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
    </style>
</head>
<body>

<div id="init-overlay">
    <div class="radio-console">
        <h1 class="text-yellow-500 font-black text-2xl tracking-widest mb-6">97.7 THE FLAME</h1>
        <button onclick="startEngine()" class="btn-gold animate-pulse">QUEEN BUTTA SHOWCASE</button>
        <p class="text-green-500 text-[8px] mt-4 font-bold">BOOTING QUEEN BUTTA SHOWCASE...</p>
    </div>
</div>

<header class="flex justify-between items-center">
    <div class="font-bold text-[10px] tracking-tighter">MUSIC MARKET // QUEEN BUTTA</div>
    <div class="text-yellow-500 font-black animate-pulse text-xs tracking-widest">● LIVE</div>
</header>

<div class="dashboard">
    <aside class="side-col">
        <a href="https://aitify-music-stream.replit.app/" class="btn-gold">TRADE SONG</a>
        <div id="art-frame" class="album-art"></div>
        
        <div class="bg-[#151515] p-6 border border-[#333] text-center">
            <div id="radio-track" class="text-yellow-500 text-[11px] mb-3 font-bold tracking-widest">--</div>
            <div id="main-osc" class="oscillator-main mb-2">$1.00</div>
            <div id="price-arrow" class="font-bold text-2xl mb-6">▲ +0.00</div>

            <div class="flex flex-col gap-3">
                <a href="YOUR_PARTNER_LICENSE_URL" target="_blank" class="border-2 border-yellow-500 text-yellow-500 font-black py-3 text-[10px] tracking-widest hover:bg-yellow-500/10 transition-all no-underline">
                    PARTNER LICENSE: $100
                </a>

                <a href="https://payhip.com/b/cONHP" target="_blank" class="btn-cash text-xs">
                    FULL ALBUM: $9.99
                </a>

                <a id="buy-btn" href="https://cash.app/$AITITRADEBROKERAGE" target="_blank" class="border border-white text-white py-3 text-[10px] font-bold opacity-80 hover:opacity-100 transition-all no-underline">
                    BUY SINGLE: $1.00
                </a>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="prevAsset()" class="flex-1 border border-green-500 py-4">⏮</button>
                <button onclick="nextAsset()" class="flex-1 border border-green-500 py-4">⏭</button>
            </div>
        </div>
    </aside>

    <main class="main-col">
        <div class="chart-box">
            <div id="candle-layer"></div>
            <svg width="100%" height="100%" viewBox="0 0 1000 300" preserveAspectRatio="none" style="position:absolute; top:0; opacity:0.2;">
                <path id="kinetic-line" d="" fill="none" stroke="#00ff00" stroke-width="2" />
            </svg>
        </div>
        <div id="order-flow"></div>
    </main>

    <aside class="side-col" style="border-right:none; border-left:1px solid #333;">
        <div class="text-yellow-500 font-bold border-b border-yellow-500 pb-3 mb-4 text-xs tracking-widest">MARKET LEDGER</div>
        <div id="list-target"></div>
    </aside>
</div>

<audio id="main-audio-engine"></audio>

<script>
    const assets = [
        { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FSUPERFLY.mp3?alt=media&token=e260aa5d-a3c9-453e-8b80-a466a6328906" },
        { name: "YOU'RE MY ADDICTION", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FYOU'RE%20MY%20ADDICTION.mp3?alt=media&token=ff95dd55-65a0-44c7-b9f4-9cd7ae2ce12c" },
        { name: "TIMES UP", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTIMES%20UP.mp3?alt=media&token=b582fd58-9511-447a-8986-b3dd9f720f2a" },
        { name: "LOVE MAKE OVER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLOVE%20MAKE%20OVER.mp3?alt=media&token=df587b6b-eed4-4f5b-b340-a5b5622efb31" },
        { name: "I'M NOT HER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI'M%20NOT%20HER.mp3?alt=media&token=e3ab1871-4af8-4e42-80e5-0e959a9647a1" },
        { name: "GANSTA CHICK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FGANSTA%20CHICK.mp3?alt=media&token=2b1859c4-a43d-4cc3-b121-5e06897ea7af" },
        { name: "IT'S FRIDAY NIGHT", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FIT'S%20FRIDAY%20NIGHT.mp3?alt=media&token=21b85403-a6dd-49d6-9a26-6514ed90eaa1" },
        { name: "HEARTBREAK MOTEL REMIX", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FHEARTBREAK%20MOTEL%20REMIX.mp3?alt=media&token=081a4e22-abb5-4045-a463-0f768dc9fb20" },
        { name: "LET'S GO BACK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLET'S%20GO%20BACK.mp3?alt=media&token=744a2807-2f51-4f4b-bef2-8d79e3e56be6" },
        { name: "I DESERVE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI%20DESERVE.mp3?alt=media&token=0bed5d76-783b-4ea4-9b12-9085d96bbf9c" },
        { name: "THAT GIRL FROM THE GHETTO", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTHAT%20GIRL%20FROM%20THE%20GHETTO.mp3?alt=media&token=a9f526a4-2567-4225-a8c2-dbac509f03de" },
        { name: "MIDNIGHT SMOKE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FMIDNIGHT%20SMOKE.mp3?alt=media&token=8ba90c94-61cf-4fce-84bc-6c8a0c6a0105" },
        { name: "BETTER THAN GOOD", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FBETTER%20THAN%20GOOD%20(1).mp3?alt=media&token=5b6a259d-7c57-4f1e-9c2d-121f9d3ee15a" }
    ];

    const queenImg = "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982";
    let currentIdx = 0; let engineStarted = false; let price = 1.00;
    const audio = document.getElementById('main-audio-engine');
    audio.onended = () => { nextAsset(); };

    function startEngine() {
        if (engineStarted) return;
        engineStarted = true;
        document.getElementById('init-overlay').style.display = 'none';
        const list = document.getElementById('list-target');
        assets.forEach((a, i) => {
            list.innerHTML += `<div class="ledger-row" onclick="sync(${i})"><div>${a.name}</div><div class="text-right text-yellow-500 font-bold">$1.00</div></div>`;
        });
        setInterval(simulateMarket, 1200); 
        sync(0);
    }

    function simulateMarket() {
        const side = Math.random() > 0.45 ? "BUY" : "SELL";
        const impact = (Math.random() * 0.40) + 0.05;
        const candleLayer = document.getElementById('candle-layer');
        if (side === "BUY") price = Math.min(5.00, price + impact);
        else price = Math.max(1.00, price - impact);

        const osc = document.getElementById('main-osc');
        const arrow = document.getElementById('price-arrow');
        osc.innerText = `$${price.toFixed(2)}`;
        osc.className = `oscillator-main ${side === "BUY" ? "text-green-500" : "text-red-500"}`;
        arrow.innerHTML = `${side === "BUY" ? "▲ +" : "▼ -"}${impact.toFixed(2)}`;
        arrow.style.color = side === "BUY" ? "#00ff00" : "#ff3333";

        const c = document.createElement('div');
        c.className = "candle";
        c.style.height = (impact * 250) + "px";
        c.style.background = side === "BUY" ? "var(--neon)" : "var(--red)";
        c.innerHTML = `<div class="wick" style="background:${side === "BUY" ? "var(--neon)" : "var(--red)"}"></div>`;
        candleLayer.appendChild(c);
        if (candleLayer.children.length > 28) candleLayer.removeChild(candleLayer.firstChild);

        const flow = document.getElementById('order-flow');
        const row = document.createElement('div');
        row.className = 'trade-row';
        row.style.color = side === "BUY" ? "#00ff00" : "#ff3333";
        row.innerHTML = `<span>${side} RETAIL ORDER</span> <span>$${price.toFixed(2)}</span>`;
        flow.prepend(row);
        if(flow.children.length > 12) flow.removeChild(flow.lastChild);
    }

    function sync(idx) {
        currentIdx = idx; const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('art-frame').style.backgroundImage = `url('${queenImg}')`;
        document.getElementById('buy-btn').innerText = `BUY ${a.name}: $1.00`;
        audio.src = a.audio; audio.play().catch(() => {});
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
</script>
</body>
</html>
