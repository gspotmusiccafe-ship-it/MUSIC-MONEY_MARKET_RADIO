<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYALTY CHECK RADIO</title>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; overflow: hidden; }
        .main-chassis { display: grid; grid-template-rows: 1fr 1fr; width: 95vw; max-width: 400px; height: 90vh; max-height: 650px; border-radius: 10px; overflow: hidden; border: 4px solid #AAA; }
        
        /* CHECK TOP */
        .check-chassis { background: #EED; padding: 15px; display: flex; flex-direction: column; border-bottom: 3px dashed #777; }
        .brand-name { font-size: 18px; font-weight: 900; color: #000; margin: 5px 0; text-align: center; }
        .amount-box { border: 2px solid #000; padding: 5px 15px; font-weight: bold; font-size: 16px; margin-left: auto; width: 80px; text-align: center; }
        
        /* RADIO BOTTOM */
        .radio-stub { background: #CCC; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .screen { background: #111; width: 100%; height: 100px; display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 5px; border-radius: 5px; }
        .bar { width: 10px; background: #00ff41; height: 10px; transition: height 0.1s; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #333; background: #FFF; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 24px; }
        #btn-rights { background: #008000; color: #FFF; font-weight: bold; padding: 12px; width: 100%; text-align: center; border-radius: 5px; text-decoration: none; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="main-chassis">
        <div class="check-chassis">
            <h1 class="brand-name">ROYALTY CHECK RADIO</h1>
            <div style="margin-top:20px;">PAY TO: LICENSEE</div>
            <div class="amount-box">$30.00</div>
            <div style="margin-top:10px;">MEMO: QUEEN BUTTA</div>
        </div>
        <div class="radio-stub">
            <div class="screen" id="oscillator">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <button id="play-pause-btn" class="btn-circle">▶</button>
            <a id="btn-rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="main-audio"></audio>
    <script>
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause-btn');
        const bars = document.querySelectorAll('.bar');
        
        // Affliate
        const params = new URLSearchParams(window.location.search);
        document.getElementById('btn-rights').href += `&ref=${params.get('ref') || 'direct'}`;

        async function init() {
            const res = await fetch('radio-manifest.json');
            const data = await res.json();
            audio.src = data.playlist[0].src;
        }

        function animate() {
            if (!audio.paused) bars.forEach(b => b.style.height = (Math.random() * 100 + 10) + 'px');
            requestAnimationFrame(animate);
        }

        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.innerText = "❚❚"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        };

        audio.onended = () => {
            audio.pause();
            playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
            playBtn.disabled = true;
        };

        init(); animate();
    </script>
</body>
</html>
