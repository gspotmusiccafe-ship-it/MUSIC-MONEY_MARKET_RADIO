<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONGSHARE MARKET - GLOBAL EXCHANGE</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow-x: hidden; }
        .ticker-wrap { background: #111; border-bottom: 2px solid #0ff; padding: 10px; color: #0f0; }
        #stock-terminal { border: 2px solid #0ff; max-width: 420px; margin: 20px auto; padding: 15px; background: rgba(5,5,5,0.95); box-shadow: 0 0 20px #0ff; }
        .ticker { font-size: 1.4rem; background: #111; padding: 12px; margin-bottom: 8px; font-weight: bold; border: 1px solid #333; }
        .gain { color: #0f0; text-shadow: 0 0 8px #0f0; }
        .trade-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .exec-btn { padding: 18px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; }
        #buy-btn { background: #0f0; color: #000; box-shadow: 0 0 10px #0f0; }
        #sell-btn { background: #f00; color: #000; box-shadow: 0 0 10px #f00; }
        .asset-view { width: 100%; height: 320px; background-size: cover; background-position: center; border: 1px solid #333; margin: 10px 0; background-color: #111; }
    </style>
</head>
<body>
    <div class="ticker-wrap">AITITRADE GLOBAL INDEX ▲ 1.45% | NASDAQ ▲ 0.12% | SONGSHARE MARKET OPEN</div>

    <div id="stock-terminal">
        <div class="ticker gain" id="market-oscillator">LINKING EXCHANGE...</div>
        <div class="trade-panel">
            <button class="exec-btn" id="buy-btn" onclick="executeTrade('BUY')">BUY STOCK</button>
            <button class="exec-btn" id="sell-btn" onclick="executeTrade('SELL')">SELL/TRADE</button>
        </div>
        <div class="asset-view" id="asset-art"></div>
        <div id="asset-label" style="font-size: 0.8rem; margin-top: 5px; color: #f0f;">INITIALIZING...</div>
    </div>

    <audio id="radio-source"></audio>

    <script>
        const _F = 0.25; const MIN = 10;
        const inventory = [
            { name: "SUPERFLY", tier: 5, art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" },
            { name: "ZODIAC SIGN", tier: 4, art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN-J.%20MARIE.png?alt=media&token=763cef9d-c8dd-48ad-bc37-f701d1cf6a9a" },
            { name: "SCENE BY SCENE", tier: 3, art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72" }
        ];

        let index = 0;
        function loadAsset() {
            const a = inventory[index];
            document.getElementById('asset-art').style.backgroundImage = `url("${a.art}")`;
            document.getElementById('asset-label').innerText = `TIER ${a.tier} ASSET: ${a.name}`;
            document.getElementById('market-oscillator').innerText = `${a.name} ▲ $${(a.tier + _F).toFixed(2)}`;
        }

        function executeTrade(type) {
            const a = inventory[index];
            if(type === 'BUY') {
                const total = (a.tier * MIN) + _F;
                alert(`CONFIRM TIER ${a.tier} ENTRY\nTotal: $${total.toFixed(2)}`);
                window.location.href = `https://cash.app/$AITITRADEBROKERAGE?amount=${total.toFixed(2)}`;
            } else {
                alert(`SETTLEMENT QUEUE ACTIVE\nStatus: Gaining Steam (45-60 Days)`);
            }
        }

        window.onload = loadAsset;
    </script>
</body>
</html>
