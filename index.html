<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MUSIC MONEY MARKET // PORTAL</title>
    <style>
        body { 
            background: #000; 
            color: #0ff; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden;
        }

        /* 1. TOP TICKER (GAINS/LOSSES) */
        .ticker-bar { 
            width: 100%; 
            background: #111; 
            border-bottom: 2px solid #0ff; 
            padding: 12px 0; 
            box-shadow: 0 0 15px #0ff;
            z-index: 10;
        }
        .marquee { 
            display: inline-block; 
            white-space: nowrap; 
            animation: move 20s linear infinite; 
            color: #0f0; 
            font-weight: 900;
            font-size: 1rem;
        }
        @keyframes move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* 2. THE MAIN DISPLAY (RADIO) */
        #portal { 
            width: 95%; 
            max-width: 400px; 
            margin: 20px 0; 
            border: 3px solid #0ff; 
            background: rgba(10,10,10,0.95); 
            box-shadow: 0 0 25px #0ff;
            border-radius: 8px;
            padding-bottom: 15px;
        }
        .art-frame { 
            width: 100%; 
            height: 400px; 
            background-size: cover; 
            background-position: center; 
            position: relative;
            border-bottom: 1px solid #333;
        }
        .track-tag { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            background: rgba(0,0,0,0.85); 
            padding: 10px; 
            color: #f0f; 
            font-weight: bold; 
            font-size: 0.8rem;
            text-align: center;
        }

        /* 3. BUTTONS (PLAY/BUY) */
        .btn-stack { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            padding: 15px; 
        }
        .btn { 
            padding: 18px; 
            border: none; 
            font-weight: 900; 
            text-transform: uppercase; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 0.9rem;
        }
        .buy { background: #0f0; color: #000; box-shadow: 0 0 10px #0f0; }
        .skip { background: #f0f; color: #fff; box-shadow: 0 0 10px #f0f; }

        /* 4. BOTTOM ASSET SCROLL */
        .bottom-scroll { 
            width: 100%; 
            overflow-x: auto; 
            white-space: nowrap; 
            padding: 20px 0; 
            border-top: 2px solid #0ff;
            background: #050505;
        }
        .asset-thumb { 
            display: inline-block; 
            width: 100px; 
            margin: 0 10px; 
            text-align: center;
            cursor: pointer;
        }
        .asset-thumb img { 
            width: 100%; 
            border: 1px solid #0ff; 
            border-radius: 4px;
        }
        .asset-thumb p { font-size: 0.6rem; margin-top: 5px; color: #0ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="ticker-bar">
        <div class="marquee">$MMC SYMPHONY ▲ $0.000125 | SUPERFLY ▲ $5.20 | ROXY BROWN ▼ $2.15 | MARKET: OPEN</div>
    </div>

    <div id="portal">
        <div class="art-frame" id="mainArt">
            <div class="track-tag" id="trackName">LOADING MARKET...</div>
        </div>
        <div class="btn-stack">
            <button class="btn buy" onclick="buy()">BUY STOCK</button>
            <button class="btn skip" onclick="next()">SKIP ASSET</button>
        </div>
    </div>

    <div class="bottom-scroll" id="assetList"></div>

    <audio id="player" onended="next()"></audio>

    <script>
        const assets = [
            { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" },
            { name: "ROXY BROWN", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147" }
        ];

        let current = 0;
        const player = document.getElementById('player');
        const assetList = document.getElementById('assetList');

        function playAsset(idx) {
            current = idx;
            const item = assets[current];
            player.src = item.audio;
            document.getElementById('mainArt').style.backgroundImage = `url('${item.art}')`;
            document.getElementById('trackName').innerText = `TRADING: ${item.name}`;
            player.play().catch(() => console.log("Tap to start flow"));
        }

        function next() { current = (current + 1) % assets.length; playAsset(current); }
        function buy() { window.location.href = "https://cash.app/$AITITRADEBROKERAGE"; }

        assets.forEach((item, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'asset-thumb';
            thumb.onclick = () => playAsset(index);
            thumb.innerHTML = `<img src="${item.art}"><p>${item.name}</p>`;
            assetList.appendChild(thumb);
        });

        window.onload = () => playAsset(0);
    </script>
</body>
</html>
