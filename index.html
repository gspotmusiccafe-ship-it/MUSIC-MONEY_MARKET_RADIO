<!DOCTYPE html>
<html lang="en">
<head>

    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        
        html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        
        #init-overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .radio-console { width: 90%; max-width: 400px; padding: 40px; border: 4px double var(--gold); background: #0a0a0a; text-align: center; }
        
        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: calc(100vh - 60px); }

        @media (max-width: 1024px) {
            .dashboard { display: flex; flex-direction: column; height: auto; }
            .side-col, .main-col { width: 100% !important; height: auto !important; border: none; border-bottom: 2px solid #222; overflow: visible !important; }
        }

        .side-col { background: #0a0a0a; border-right: 1px solid #333; overflow-y: auto; padding: 20px; }
        .main-col { background: var(--bg); border-right: 1px solid #333; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .chart-box { background: #000; border: 1px solid #333; height: 300px; position: relative; border-radius: 4px; overflow: hidden; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px; z-index: 1; }
        .candle { width: 10px; border-radius: 1px; position: relative; min-height: 5px; }
        .wick { position: absolute; width: 2px; height: 150%; left: 4px; top: -25%; z-index: -1; }

        .ledger-row { display: grid; grid-template-columns: 1fr 80px; gap: 10px; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
        .ledger-row:hover { background: #111; border-left: 4px solid var(--gold); }

        .oscillator-main { font-size: 4rem; color: white; font-weight: 900; letter-spacing: -4px; line-height: 0.9; }
        .album-art { width: 100%; aspect-ratio: 1; border: 3px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 20px; }
        
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 18px; width: 100%; text-align: center; border: none; display: block; margin-bottom: 12px; cursor: pointer; text-decoration: none; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 22px; width: 100%; text-align: center; border: none; display: block; font-size: 1.2rem; cursor: pointer; text-decoration: none; }
        
        #order-flow { background: #080808; border: 1px solid #222; height: 220px; overflow: hidden; font-size: 0.7rem; padding: 12px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
    </style>
</head>
