<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME | AITIFY MUSIC RADIO</title>
    <style>
        :root {
            --matrix-green: #00FF41;
            --gold: #FFD700;
            --dark-bg: #0a0a0a;
            --panel-bg: #1a1a1a;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* TICKER SYSTEM */
        .ticker-wrap {
            width: 100%;
            background: black;
            border-bottom: 2px solid var(--matrix-green);
            overflow: hidden;
            padding: 5px 0;
        }

        .ticker {
            white-space: nowrap;
            display: inline-block;
            animation: ticker 30s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* MAIN SHOWCASE CONTAINER */
        .showcase-container {
            width: 90%;
            max-width: 1000px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .main-display {
            background: var(--panel-bg);
            border: 2px solid #333;
            padding: 20px;
            text-align: center;
        }

        /* ENGAGEMENT BUTTONS */
        .engagement-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            display: block;
            padding: 20px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            border: 2px solid;
            font-size: 1.1em;
        }

        .partner-btn {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 215, 0, 0.05);
        }

        .album-btn {
            background: var(--matrix-green);
            color: black;
            border-color: var(--matrix-green);
        }

        .single-btn {
            border-color: #fff;
            color: #fff;
            font-size: 0.9em;
        }

        .btn:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        /* ASSET LEDGER */
        .asset-ledger {
            background: black;
            border: 1px solid var(--matrix-green);
            padding: 15px;
            font-size: 0.85em;
        }

        .ledger-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            padding: 8px 0;
        }

        .status-active { color: var(--matrix-green); }

        /* PLAYER CONTROLS */
        .player-controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        button.nav-btn {
            background: none;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            font-size: 2em;
            padding: 10px 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="ticker">
            50 FOUNDING SONG PARTNERS WANTED // RETAIL MARKET LIVE // 1K QUALIFIER ACTIVE // [QUEEN BUTTA] LOVE MAKE OVER // 13 TRACKS LOADED
        </div>
    </div>

    <div class="showcase-container">
        <div class="main-display">
            <h2 style="color: var(--matrix-green);">QUEEN BUTTA / MS BUTTA</h2>
            <p>ALBUM: LOVE MAKE OVER</p>
            
            <div style="width: 100%; height: 300px; background: #000; border: 1px solid #333; display: flex; align-items: center; justify-content: center;">
                [QUEEN BUTTA VISUAL]
            </div>

            <div class="engagement-controls">
                <a href="https://payhip.com/b/YOUR_PARTNER_LINK" target="_blank" class="btn partner-btn">
                    ALBUM RESELLER
