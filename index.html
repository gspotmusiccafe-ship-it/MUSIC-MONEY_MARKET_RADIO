            .side-col, .main-col { width: 100% !important; height: auto !important; border: none; border-bottom: 2px solid #222; overflow: visible !important; }

        .main-col { background: var(--bg); border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        /* INFO CENTER FLASH LOGIC */
        #info-center { height: 75px; background: #111; border: 1px solid #333; display: flex; align-items: center; justify-content: center; padding: 0 20px; text-align: center; overflow: hidden; border-radius: 4px; }
        .flash-msg { font-size: 0.75rem; color: #fff; font-weight: bold; letter-spacing: 1px; display: none; line-height: 1.3; }
        .flash-msg.active { display: block; animation: pulse-gold 2s infinite; }
        
        @keyframes pulse-gold { 0% { color: #fff; } 50% { color: var(--gold); } 100% { color: #fff; } }

        .chart-box { background: #000; border: 1px solid #333; height: 300px; position: relative; border-radius: 4px; overflow: hidden; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px 10px; z-index: 1; }
        .candle { width: 10px; border-radius: 1px; position: relative; min-height: 5px; transition: 0.3s; }
        .wick { position: absolute; width: 2px; height: 150%; left: 4px; top: -25%; z-index: -1; }

        .ledger-row { display: grid; grid-template-columns: 1fr 80px; gap: 10px; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
        .ledger-row:hover { background: #111; border-left: 4px solid var(--gold); }

        .oscillator-main { font-size: 4rem; color: white; font-weight: 900; letter-spacing: -4px; line-height: 0.9; }
        .album-art { width: 100%; aspect-ratio: 1; border: 3px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 20px; }
        
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 15px; width: 100%; text-align: center; border: none; display: block; cursor: pointer; text-decoration: none; font-size: 0.8rem; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 20px; width: 100%; text-align: center; border: none; display: block; font-size: 1.1rem; cursor: pointer; text-decoration: none; }
        
        #order-flow { background: #080808; border: 1px solid #222; height: 180px; overflow: hidden; font-size: 0.7rem; padding: 12px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
    </style>
</head>
