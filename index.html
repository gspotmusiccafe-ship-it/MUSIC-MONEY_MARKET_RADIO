<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITITRADE | SOVEREIGN PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff41; --gold: #ffd700; --emerald: #062111; --red: #ff3131; }
        
        body { 
            font-family: 'JetBrains+Mono', monospace; 
            background: radial-gradient(circle at center, #0a3d1d 0%, #000 100%);
            color: var(--neon); display: flex; justify-content: center; align-items: center; 
            min-height: 100 vh; margin: 0; padding: 15px; text-transform: uppercase; 
        }
        
        .portal-container { 
            width: 100%; max-width: 410px; background: #000; border: 3px solid var(--gold); 
            position: relative; box-shadow: 0 0 100px rgba(0, 255, 65, 0.2); 
        }

        /* PREMIUM GLASS BUTTONS */
        .glass-btn {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #fff; padding: 22px; border-radius: 2px;
            font-weight: 700; letter-spacing: 3px; transition: 0.3s;
            text-align: center; cursor: pointer;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
        }
        .glass-btn:hover {
            border-color: var(--neon); color: var(--neon);
            background: rgba(0, 255, 65, 0.15); box-shadow: 0 0 30px rgba(0,255,65,0.4);
        }

        .price-display { font-size: 5rem; line-height: 1; font-weight: 900; letter-spacing: -5px; }
        .gain { color: var(--neon); }
        .loss { color: var(--red); }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="p-3 bg-black border-b border-[#222] flex justify-between text-[9px] font-bold">
            <span class="text-white tracking-widest">AITITRADE // 97.7 THE FLAME</span>
            <span class="animate-pulse text-green-500 font-black">● SIGNAL: KINETIC_LOCKED</span>
        </div>

        <div class="relative border-b border-[#222] aspect-square overflow-hidden bg-zinc-900">
            <img src="https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc" 
                 class="w-full h-full object-cover block">
            <div class="absolute bottom-5 left-5 bg-black/95 p-4 border-l-4 border-yellow-500">
                <h1 class="text-white text-2xl font-black italic">SUPERFLY</h1>
                <p class="text-[9px] text-gray-500 mt-1 tracking-[0.3em]">ATFY-9C4D7 // NATIVE ASSET</p>
            </div>
        </div>

        <div class="p-8 text-center bg-gradient-to-t from-emerald-950/30 to-black border-b border-[#222]">
            <p class="text-[10px] text-gray-500 tracking-[0.4em] mb-2 font-bold">LIVE MARKET VALUATION</p>
            <div id="price-main" class="price-display gain mb-2">$5.84</div>
            <div id="price-change" class="text-sm font-bold tracking-widest text-green-500">▲ +0.11 (+1.9%)</div>
        </div>

        <div class="p-6 space-y-4">
            <div onclick="forcePlay()" id="play-trigger" class="glass-btn">PLAY AUDIO FEED</div>
            <a href="https://aitify-music-stream.replit.app/" class="glass-btn block">ACCESS MARKET</a>
        </div>

        <audio id="sovereign-audio" loop preload="auto" crossorigin="anonymous">
            <source src="https://firebasestorage.googleapis.com/v0/b/aitify-radio-97-7-the-flame.appspot.com/o/Superfly.mp3?alt=media&token=f0d2c8c4-6c3d-4e9e-8c3c-1b7d5e4a3b2c" type="audio/mpeg">
        </audio>

        <div class="p-4 bg-black text-center text-[7px] text-gray-700 tracking-[0.5em] border-t border-[#222]">
            AITITRADE SOVEREIGN TRUST // KINETIC LOGIC ENFORCED
        </div>
    </div>

    <script>
        // KINETIC PRICE ENGINE
        let basePrice = 5.84;
        const priceMain = document.getElementById('price-main');
        const priceChange = document.getElementById('price-change');

        function updateMarket() {
            const bounce = (Math.random() * 0.7) - 0.3; 
            const currentPrice = basePrice + bounce;
            const diff = currentPrice - 5.00;
            const pct = ((diff / 5.00) * 100).toFixed(1);
            priceMain.innerText = "$" + currentPrice.toFixed(2);
            if (bounce >= 0) {
                priceMain.className = "price-display gain";
                priceChange.innerHTML = `▲ +${bounce.toFixed(2)} (+${pct}%)`;
                priceChange.className = "text-sm font-bold tracking-widest text-green-500";
            } else {
                priceMain.className = "price-display loss";
                priceChange.innerHTML = `▼ ${bounce.toFixed(2)} (${pct}%)`;
                priceChange.className = "text-sm font-bold tracking-widest text-red-500";
            }
            setTimeout(updateMarket, Math.floor(Math.random() * 1200) + 400);
        }
        updateMarket();

        // BULLETPROOF RADIO LOGIC
        const radio = document.getElementById('sovereign-audio');
        const trigger = document.getElementById('play-trigger');
        let active = false;

        function forcePlay() {
            if (!active) {
                radio.play().then(() => {
                    trigger.innerText = "PAUSE FEED";
                    active = true;
                }).catch(err => {
                    radio.load();
                    radio.play();
                    trigger.innerText = "PAUSE FEED";
                    active = true;
                });
            } else {
                radio.pause();
                trigger.innerText = "PLAY AUDIO FEED";
                active = false;
            }
        }
    </script>
</body>
</html>
