<script>
    /* --- YOUR CORE DATA --- */
    const assets = [
        { name: "SCENE BY SCENE", base: 1.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a" },
        { name: "SUPERFLY", base: 5.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293" }
    ];

    let _Q_COUNT = 0; 
    let currentIdx = 0;

    function init() {
        // THE SPORADIC BOUNCE: Bouncing 0-100% all over the place
        // Fast enough to require focus, sporadic enough to be a "catch"
        setInterval(sporadicBounce, 160); 
        sync(0);
    }

    function sporadicBounce() {
        const a = assets[currentIdx];
        
        // THE MATH: Base ($1 or $5) + (Random % * Base) = Up to 100% ROI
        let randomFactor = Math.random(); 
        let livePrice = (a.base + (randomFactor * a.base)).toFixed(2);
        let currentROI = (randomFactor * 100).toFixed(0);

        // Update your display IDs
        const osc = document.getElementById('main-osc');
        osc.innerText = `$${livePrice}`;
        
        const bounceDisplay = document.getElementById('price-change');
        bounceDisplay.innerText = `BOUNCE: ${currentROI}%`;
        
        // Visual Feedback: Green when near that 100% ROI Catch
        osc.style.color = randomFactor > 0.85 ? "var(--neon)" : "white";
    }

    // INVEST BUTTON: RIGGED FOR YOUR 5 GATEWAYS
    function openInvest() {
        const choice = prompt("SELECT GATEWAY: \n1. CASH APP \n2. PAYPAL \n3. STRIPE \n4. BNB \n5. BITCOIN");
        // Logic will go here once you provide the URLs
        alert("REDIRECTING TO SECURE GATEWAY...");
    }

    // LIQUIDATE BUTTON: THE "CATCH" MECHANIC
    function processLiquidate() {
        const flow = document.getElementById('order-flow');
        const catchVal = document.getElementById('main-osc').innerText;
        _Q_COUNT++;

        const row = document.createElement('div');
        row.className = 'trade-row';
        row.innerHTML = `<span>Q:${_Q_COUNT}</span> <span>CATCH: ${catchVal}</span> <span>SETTLED</span>`;
        
        flow.prepend(row);
        if(flow.children.length > 8) flow.removeChild(flow.lastChild);
        
        // Update the Queue in your stats
        document.getElementById('queue-count').innerText = `${_Q_COUNT} / 115`;

        // THE 1K SETTLEMENT
        if (_Q_COUNT >= 115) {
            _Q_COUNT = 0;
            alert("MARKET CLOSED: $522 BUDGET EXHAUSTED. $478 SURPLUS CAPTURED.");
        }
    }

    /* --- NAVIGATION --- */
    function sync(idx) {
        currentIdx = idx;
        const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('art-frame').style.backgroundImage = `url('${a.img}')`;
        document.getElementById('main-audio-engine').src = a.audio;
        document.getElementById('main-audio-engine').play().catch(() => {});
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
    function playCurrent() { document.getElementById('main-audio-engine').play(); }

    window.onload = init;
</script>
