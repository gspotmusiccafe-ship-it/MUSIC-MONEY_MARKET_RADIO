<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYALTY CHECK RADIO</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        /* The ornate border container */
        .check-container { 
            background: #fdfaf0; 
            width: 360px; 
            border: 12px solid transparent; 
            border-image: linear-gradient(to bottom, #000080, #800000, #008000) 30; 
            box-shadow: 0 10px 30px #000; 
            display: flex; flex-direction: column; 
        }
        .header { display: flex; align-items: center; gap: 15px; padding: 20px; border-bottom: 2px solid #000; }
        .art-box { width: 60px; height: 60px; border: 1px solid #000; }
        #art { width: 100%; height: 100%; object-fit: cover; }
        .field-area { padding: 20px; }
        .money-box { border: 2px solid #000; padding: 5px 10px; font-weight: bold; float: right; }
        .stub-area { background: #e0e0e0; padding: 20px; border-top: 3px dashed #777; text-align: center; }
        #play-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #000; background: #fff; cursor: pointer; font-size: 20px; }
        #rights { display: block; margin-top: 15px; padding: 12px; background: #008000; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="check-container">
        <div class="header">
            <div class="logo"><img id="art" src="" class="art-box"></div>
            <div style="font-weight:900;">ROYALTY CHECK RADIO</div>
        </div>
        <div class="field-area">
            <div>PAY TO: LICENSEE <span class="money-box" id="money">$1000.00</span></div>
            <div style="margin-top:20px;">MEMO: QUEEN BUTTA ROYALTIES</div>
        </div>
        <div class="stub-area">
            <div id="info" style="font-size:11px; font-weight:bold;">ARTIST: QUEEN BUTTA | SONG: SUPERFLY | GENRE: R&B</div>
            <div style="margin-top:10px;">LICENSE FEE: MARKET PRICE</div>
            <button id="play-btn">▶</button>
            <a id="rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="audio"></audio>
    <script>
        const audio = document.getElementById('audio'), btn = document.getElementById('play-btn'), info = document.getElementById('info'), moneyBox = document.getElementById('money');
        let m = null, idx = 0;
        fetch('radio-manifest.json').then(r => r.json()).then(d => { m = d; audio.src = d.playlist[0].src; document.getElementById('art').src = d.albumArt; });
        btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); btn.innerText = audio.paused ? '▶' : '❚❚'; };
        setInterval(() => moneyBox.innerText = '$' + (Math.floor(Math.random() * 900) + 100) + '.00', 800);
        audio.onended = () => {
            idx++;
            if(idx < 12 && idx < m.playlist.length) { audio.src = m.playlist[idx].src; audio.play(); info.innerText = `ARTIST: ${m.artist} | SONG: ${m.playlist[idx].title} | GENRE: R&B`; }
            else { btn.innerHTML = '🔒'; btn.disabled = true; }
        };
    </script>
</body>
</html>
