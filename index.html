<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MUSIC MONEY MARKET // LIVE TERMINAL</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; text-transform: uppercase; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        header { display: flex; justify-content: space-between; padding: 10px 15px; background: var(--panel); border-bottom: 2px solid #333; font-size: 0.75rem; font-weight: bold; }
        .dashboard { display: flex; flex: 1; width: 100%; overflow: hidden; }
        
        #watchlist { width: 240px; border-right: 1px solid #333; overflow-y: auto; background: #080808; padding: 12px; }
        #market-core { flex: 1; overflow-y: auto; padding: 12px; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        #radio-desk { width: 360px; padding: 15px; background: #0a0a0a; display: flex; flex-direction: column; }

        .chart-container { background: #000; border: 1px solid #333; height: 260px; position: relative; border-radius: 4px; overflow: hidden; }
        .market-stats { display: flex; justify-content: space-between; padding: 5px 10px; background: #111; border: 1px solid #222; font-size: 0.65rem; color: var(--gold); }
        
        #order-flow { height: 110px; background: #080808; border: 1px solid #222; overflow: hidden; font-size: 0.6rem; padding: 8px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px solid #111; }

        .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .data-card { background: #111; border: 1px solid #222; padding: 10px; text-align: center; font-size: 0.65rem; cursor: pointer; }

        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); margin-bottom: 10px; background-size: cover; background-position: center; background-color: #222; max-height: 260px; }
        .radio-controls { background: #151515; padding: 15px; border: 1px solid #333; text-align: center; border-radius: 4px; }
        .oscillator-main { font-size: 2.8rem; color: white; margin: 5px 0; font-weight: 900; letter-spacing: -1px; }

        .account-btn { background: var(--gold); color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-bottom: 15px; font-size: 0.9rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 204, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); } }

        .buy-sell-master { background: var(--neon); color: black; font-size: 1rem; padding: 15px; margin-top: 5px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        button.nav { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; flex: 1; cursor: pointer; }
        
        .watch-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: 0.7rem; cursor: pointer; }

        /* THE GATE OVERLAY */
        #init-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .gate-box { text-align:center; border: 2px solid var(--gold); padding: 40px; background: #0a0a0a; max-width: 400px; }
    </style>
</head>
<body>

<div id="init-overlay">
    <div class="gate-box">
        <h2 style="color:var(--gold); margin-top:0;">THE MUSIC MONEY MARKET</h2>
        <p style="color:white; font-size:0.7rem; letter-spacing:1px; margin-bottom:25px;">SIGNUP REQUIRED BEFORE TRADING ASSETS</p>
        <a href="https://gspotmusiccafe.wixsite.com/the-music-money-mark/groups" class="account-btn" onclick="startEngine()">OPEN TRADING ACCOUNT</a>
        <p style="color:var(--neon); font-size:0.6rem; cursor:pointer;" onclick="startEngine()">OR ENTER TERMINAL AS GUEST</p>
    </div>
</div>

<audio id="main-audio-engine" onended="nextAsset()"></audio>

<header>
    <div>THE MUSIC MONEY MARKET</div>
    <div id="sys-status" style="color:var(--neon)">VOL: $3,142,904</div>
    <div style="color:var(--gold)">97.7 THE FLAME</div>
</header>

<div class="dashboard">
    <aside id="watchlist"><div style="color:var(--gold); border-bottom:1px solid var(--gold); margin-bottom:10px;">MARKET LEDGER</div><div id="list-target"></div></aside>
    <section id="market-core">
        <div class="market-stats">
            <span>24H VOL: <span id="vol-24h">$52.1M</span></span>
            <span>MARKET CAP: <span id="mkt-cap">$2.1B</span></span>
            <span id="mkt-status" style="color:var(--neon)">STATUS: BULLISH</span>
        </div>
        <div class="chart-container">
            <div id="volume-bars" style="position:absolute; bottom:0; width:100%; height:40px; display:flex; align-items:flex-end; gap:2px; padding:0 5px; opacity:0.3;"></div>
            <svg width="100%" height="100%" viewBox="0 0 1000 300" preserveAspectRatio="none">
                <path id="kinetic-line" d="" fill="none" stroke="var(--neon)" stroke-width="4" />
                <circle id="pulse-head" r="8" fill="var(--neon)" />
            </svg>
        </div>
        <div id="order-flow"></div>
        <div class="asset-grid" id="asset-cards"></div>
    </section>
    <aside id="radio-desk">
        <a href="https://gspotmusiccafe.wixsite.com/the-music-money-mark/groups" class="account-btn">ADD TO PORTFOLIO</a>
        <div class="album-art" id="art-frame"></div>
        <div class="radio-controls">
            <div id="radio-track" style="color:var(--gold); font-size: 0.8rem;">--</div>
            <div id="radio-roi" style="font-size:0.7rem; color:#888;">0% ROI</div>
            <div class="oscillator-main" id="main-osc">$0.00</div>
            <button onclick="sysNotify('TRADE')" class="buy-sell-master">BUY / SELL ASSET</button>
            <div class="btn-row">
                <button class="nav" onclick="prevAsset()">⏮</button>
                <button class="nav" onclick="playCurrent()">▶</button>
                <button class="nav" onclick="nextAsset()">⏭</button>
            </div>
        </div>
    </aside>
</div>

<script>
    const assets = [
        { id: "A01", name: "SCENE BY SCENE", roi: 88.4, buy: 1.11, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a" },
        { id: "A02", name: "SUPERFLY", roi: 62.5, buy: 5.02, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293" },
        { id: "A03", name: "I GOT WHAT YOU NEED", roi: 95.1, buy: 3.52, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media&token=a5cf44ea-56ef-49f8-839c-0b9d2c3c250c" },
        { id: "A04", name: "ZODIAC SIGN", roi: 24.8, buy: 2.51, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN-J.%20MARIE.png?alt=media&token=763cef9d-c8dd-48ad-bc37-f701d1cf6a9a", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN.mp3?alt=media&token=915fde66-5e25-401e-ab03-61a0a5642630" }
    ];

    let currentIdx = 0; let points = []; let headY = 150; let velocity = 0; let engineStarted = false;

    function startEngine() {
        if (engineStarted) return;
        engineStarted = true;
        document.getElementById('init-overlay').style.display = 'none';
        
        const list = document.getElementById('list-target');
        const cards = document.getElementById('asset-cards');
        const volBars = document.getElementById('volume-bars');
        
        list.innerHTML = ""; cards.innerHTML = "";
        assets.forEach((a, i) => {
            list.innerHTML += `<div class="watch-item" onclick="sync(${i})">${a.name}<br><span style="color:white; font-size:0.55rem;">ROI: ${a.roi}%</span></div>`;
            cards.innerHTML += `<div class="data-card" onclick="sync(${i})"><div style="color:var(--gold)">BUY: $${a.buy.toFixed(2)}</div><div>${a.name}</div><div id="card-osc-${a.id}" style="color:var(--neon);">$${a.buy.toFixed(2)}</div></div>`;
        });

        for(let i=0; i<50; i++) {
            volBars.innerHTML += `<div class="v-bar" style="flex:1; background:var(--neon); height:${Math.random()*100}%; opacity:0.5;"></div>`;
        }

        for (let i = 0; i <= 50; i++) points.push({ x: (1000 / 50) * i, y: 150 });
        
        setInterval(updateLiquidChart, 40);
        setInterval(updatePrices, 800);
        setInterval(addTrade, 2000);
        sync(0);
    }

    function addTrade() {
        const flow = document.getElementById('order-flow');
        const side = Math.random() > 0.4 ? "BUY" : "SELL";
        const row = document.createElement('div');
        row.className = 'trade-row';
        row.style.color = side === "BUY" ? "var(--neon)" : "var(--red)";
        row.innerHTML = `<span>${side} ${assets[Math.floor(Math.random()*4)].name}</span> <span>$${(Math.random()*5000).toFixed(2)}</span>`;
        flow.prepend(row);
        if(flow.children.length > 6) flow.removeChild(flow.lastChild);
        document.querySelectorAll('.v-bar').forEach(b => b.style.height = Math.random()*100 + "%");
    }

    function updateLiquidChart() {
        velocity += (Math.random() - 0.5) * 6; velocity *= 0.85; headY += velocity;
        if (headY < 50 || headY > 250) velocity *= -1.2;
        for (let i = 0; i < points.length - 1; i++) points[i].y = points[i+1].y;
        points[points.length - 1].y = headY;
        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 0; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            d += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
        }
        document.getElementById('kinetic-line').setAttribute('d', d);
        document.getElementById('pulse-head').setAttribute('cx', points[points.length-1].x);
        document.getElementById('pulse-head').setAttribute('cy', points[points.length-1].y);
    }

    function updatePrices() {
        const a = assets[currentIdx];
        document.getElementById('main-osc').innerText = `$${(a.buy + (Math.random()*0.1)).toFixed(2)}`;
        document.getElementById('sys-status').innerText = `VOL: $${(Math.random()*1000000 + 3000000).toLocaleString()}`;
    }

    function sync(idx) {
        currentIdx = idx; const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('radio-roi').innerText = `${a.roi}% ROI`;
        document.getElementById('art-frame').style.backgroundImage = `url('${a.img}')`;
        const audio = document.getElementById('main-audio-engine');
        audio.src = a.audio; 
        audio.play().catch(() => {});
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
    function playCurrent() { document.getElementById('main-audio-engine').play(); }
    function sysNotify(t) { document.getElementById('sys-status').innerText = "TRANSACTION LOGGED"; setTimeout(() => document.getElementById('sys-status').innerText = "MARKET LIVE", 2000); }
</script>
</body>
</html>
