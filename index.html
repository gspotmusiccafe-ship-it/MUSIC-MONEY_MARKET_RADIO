<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // MARKET TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; overflow: hidden; }
        
        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .radio-console { padding: 40px; border: 4px double var(--gold); background: #0a0a0a; text-align: center; }
        
        .dashboard { display: grid; grid-template-columns: 350px 1fr 320px; height: 100vh; }
        .side-col { background: #0a0a0a; border-right: 1px solid #333; padding: 20px; overflow-y: auto; }
        .main-col { background: var(--bg); padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* THE MESSAGE DISPLAY UPGRADE */
        #order-flow { background: #000; border: 1px solid #222; flex-grow: 1; overflow-y: hidden; padding: 10px; display: flex; flex-direction: column-reverse; gap: 4px; }
        
        .trade-row { display: flex; justify-content: space-between; font-size: 0.7rem; border-bottom: 1px solid #111; padding: 4px 0; opacity: 0.8; }

        /* NEW LARGE TEXT BLOCK STYLE */
        .logic-alert { 
            background: var(--gold); 
            color: #000; 
            padding: 20px; 
            margin: 15px 0; 
            font-weight: 900; 
            text-align: center; 
            border-left: 10px solid #fff;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            animation: impact 0.4s ease-out;
        }
        .logic-alert .title { font-size: 1.4rem; display: block; border-bottom: 2px solid #000; margin-bottom: 5px; }
        .logic-alert .desc { font-size: 0.8rem; line-height: 1.2; }

        @keyframes impact {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .chart-box { background: #000; border: 1px solid #333; height: 250px; position: relative; }
        .candle { width: 8px; position: absolute; bottom: 0; transition: height 0.3s; }
        .oscillator { font-size: 4rem; font-weight: 900; color: #fff; line-height: 1; }
    </style>
</head>
<body>

<div id="init-overlay">
    <div class="radio-console">
        <h1 class="text-yellow-500 font-black text-3xl mb-6">97.7 THE FLAME</h1>
        <button onclick="startEngine()" class="bg-yellow-500 text-black font-black px-10 py-5 hover:bg-white transition-all">OPEN MARKET TERMINAL</button>
    </div>
</div>

<div class="dashboard">
    <aside class="side-col">
        <div id="art" class="w-full aspect-square border-2 border-yellow-500 mb-4 bg-cover bg-center" style="background-image: url('https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982');"></div>
        <div class="bg-[#111] p-4 border border-[#333] text-center">
            <div id="track-name" class="text-yellow-500 text-[10px] font-bold mb-2">--</div>
            <div id="price-display" class="oscillator">$1.00</div>
            <div id="change-display" class="text-xl font-bold mt-2">▲ +0.00</div>
        </div>
    </aside>

    <main class="main-col">
        <div class="chart-box" id="chart"></div>
        <div id="order-flow"></div>
    </main>

    <aside class="side-col" style="border-left: 1px solid #333;">
        <div class="text-yellow-500 font-bold border-b border-yellow-500 pb-2 mb-4">MARKET LEDGER</div>
        <div id="ledger"></div>
    </aside>
</div>

<script>
    const assets = [
        { name: "SUPERFLY" }, { name: "YOU'RE MY ADDICTION" }, { name: "TIMES UP" }
    ];

    const logicAlerts = [
        { title: "KINETIC PULSE ACTIVE", desc: "PRICES ARE PREDETERMINED BY OWNER. ROI CALCULATED VIA MASTER LEDGER." },
        { title: "LIQUIDITY LOCKED", desc: "1K MARKET CAP OSCILLATION PROTOCOL ENGAGED. GATEWAY SECURED." },
        { title: "VISIONARY PROTOCOL", desc: "ASSET VALUE DRIVEN BY HUMAN ENERGY. NO BOTS ALLOWED." }
    ];

    let price = 1.00;
    let engineStarted = false;

    function startEngine() {
        engineStarted = true;
        document.getElementById('init-overlay').remove();
        assets.forEach(a => {
            document.getElementById('ledger').innerHTML += `<div class="flex justify-between py-2 border-b border-[#222] text-[10px]"><span>${a.name}</span><span class="text-yellow-500">$1.00</span></div>`;
        });
        setInterval(updateMarket, 1500);
    }

    function updateMarket() {
        const flow = document.getElementById('order-flow');
        const isAlert = Math.random() > 0.85;

        if (isAlert) {
            const data = logicAlerts[Math.floor(Math.random() * logicAlerts.length)];
            const div = document.createElement('div');
            div.className = 'logic-alert';
            div.innerHTML = `<span class="title">${data.title}</span><span class="desc">${data.desc}</span>`;
            flow.appendChild(div);
        } else {
            const up = Math.random() > 0.45;
            const move = (Math.random() * 0.5).toFixed(2);
            price = up ? price + parseFloat(move) : Math.max(1, price - parseFloat(move));
            
            const row = document.createElement('div');
            row.className = 'trade-row';
            row.style.color = up ? "#00ff00" : "#ff3333";
            row.innerHTML = `<span>${up ? 'BUY' : 'SELL'} ORDER EXECUTED</span><span>$${price.toFixed(2)}</span>`;
            flow.appendChild(row);

            document.getElementById('price-display').innerText = `$${price.toFixed(2)}`;
            document.getElementById('price-display').style.color = up ? "#00ff00" : "#ff3333";
        }

        if (flow.children.length > 15) flow.removeChild(flow.firstChild);
    }
</script>
</body>
</html>
