<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITIFY // BLOOMBERG GOLD TERMINAL</title>
    <style>
        :root { --gold: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); --gain: #00ff41; --loss: #ff3131; --bg: #050505; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; text-transform: uppercase; }

        /* GLOBAL GOLD TRIM */
        .gold-border { border: 2px solid; border-image: var(--gold) 1; }

        /* 1. THE BLOOMBERG HEADER */
        .top-ticker { width: 100%; background: #000; border-bottom: 2px solid #ffd700; padding: 12px 0; text-align: center; font-weight: 900; color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); z-index: 10; font-size: 1rem; letter-spacing: 2px; }

        /* THE 3-COLUMN LAYOUT */
        .portal-grid { display: grid; grid-template-columns: 280px 1fr 340px; flex-grow: 1; gap: 5px; background: #1a1a1a; padding: 5px; height: calc(100vh - 46px); }

        /* LEFT: WATCHLIST */
        .left-panel { background: var(--bg); border: 1px solid #333; overflow-y: auto; }
        .panel-header { background: #111; padding: 12px; font-size: 0.75rem; color: #ffd700; border-bottom: 1px solid #ffd700; font-weight: bold; }
        .watch-item { display: flex; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid #222; font-size: 0.8rem; cursor: pointer; }
        .watch-item:hover { background: #111; color: var(--gain); }

        /* CENTER: BOUNCING PRICE & OSCILLATOR */
        .center-panel { background: #000; border: 1px solid #333; position: relative; display: flex; flex-direction: column; }
        .valuation-desk { padding: 30px; background: radial-gradient(circle at center, #111 0%, #000 100%); border-bottom: 1px solid #ffd700; }
        .price-engine { font-size: 4.5rem; font-weight: 900; letter-spacing: -3px; transition: 0.1s ease-in-out; }
        
        .kinetic-area { flex-grow: 1; background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); display: flex; flex-direction: column; justify-content: center; padding: 40px; position: relative; }
        .oscillator-bar { width: 100%; height: 6px; background: var(--gain); box-shadow: 0 0 25px var(--gain); animation: bounce 0.4s infinite alternate; }
        @keyframes bounce { from { transform: scaleY(1); opacity: 0.5; } to { transform: scaleY(2.5); opacity: 1; } }

        /* RIGHT: ORDER DESK & RADIO */
        .right-panel { background: var(--bg); border: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .asset-frame { width: 100%; height: 280px; background-size: cover; background-position: center; border: 2px solid #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.15); }
        .trade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 18px; border: 1px solid #ffd700; font-weight: 900; cursor: pointer; color: #fff; text-align: center; font-size: 0.9rem; }
        .buy { background: #004d00; box-shadow: inset 0 0 15px var(--gain); }
        .sell { background: #660000; box-shadow: inset 0 0 15px var(--loss); }

        .monitor-row { background: #111; padding: 20px; border: 1px solid #333; text-align: center; }
        .play-pause { font-size: 3.5rem; color: #ffd700; cursor: pointer; text-shadow: 0 0 10px #ffd700; }
    </style>
</head>
<body>

    <div class="top-ticker" id="headerTag">AITIFY EXCHANGE // CONNECTING SUPERFLY SECURE FEED...</div>

    <div class="portal-grid">
        <div class="left-panel">
            <div class="panel-header">BLOOMBERG ASSET WATCHLIST</div>
            <div id="watchlist"></div>
        </div>

        <div class="center-panel">
            <div class="valuation-desk">
                <div style="font-size: 0.8rem; color: #ffd700; margin-bottom: 5px;">LIVE MARKET VALUATION</div>
                <div id="livePrice" class="price-engine">$0.00</div>
                <div id="momentum" style="font-size: 1.5rem; font-weight: 900; margin-top: 10px;">---</div>
            </div>
            <div class="kinetic-area">
                <div style="font-size: 0.7rem; color: var(--gain); letter-spacing: 4px; margin-bottom: 15px;">KINETIC TBI FEED // ACTIVE</div>
                <div class="oscillator-bar" id="vibeLine"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="panel-header">ASSET MONITOR // ORDER DESK</div>
            <div class="asset-frame" id="mainArt"></div>
            <div class="trade-btns">
                <div class="btn buy" onclick="window.location.href='https://cash.app/$AITITRADEBROKERAGE'">BUY</div>
                <div class="btn sell" onclick="alert('LIQUIDATION RECORDED')">SELL</div>
            </div>
            <div class="monitor-row">
                <div class="play-pause" id="playBtn" onclick="toggleAudio()">▶</div>
                <div style="font-size: 0.7rem; color: #888; margin-top: 10px;">97.7 THE FLAME // SUPERFLY FEED</div>
                <button onclick="next()" style="width:100%; margin-top:15px; background:none; border:1px solid #ffd700; color:#fff; padding:10px; cursor:pointer;">SKIP ASSET</button>
            </div>
        </div>
    </div>

    <audio id="radio" onended="next()"></audio>

    <script>
        const assets = [
            { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc", val: 5.20 },
            { name: "ROXY BROWN", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media", art: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147", val: 2.15 }
        ];

        let cur = 0;
        const audio = document.getElementById('radio');

        function bouncePrice() {
            const item = assets[cur];
            const drift = (Math.random() * 0.24 - 0.12).toFixed(2);
            const final = (item.val + parseFloat(drift)).toFixed(2);
            const p = document.getElementById('livePrice');
            const m = document.getElementById('momentum');
            const line = document.getElementById('vibeLine');
            
            p.innerText = `$${final}`;
            p.style.transform = "scale(1.05)";
            setTimeout(() => p.style.transform = "scale(1)", 100);

            if(drift > 0) {
                p.style.color = 'var(--gain)';
                m.innerHTML = `<span style="color:var(--gain)">▲</span> +${drift}`;
                line.style.background = 'var(--gain)';
                line.style.boxShadow = '0 0 25px var(--gain)';
            } else {
                p.style.color = 'var(--loss)';
                m.innerHTML = `<span style="color:var(--loss)">▼</span> ${drift}`;
                line.style.background = 'var(--loss)';
                line.style.boxShadow = '0 0 25px var(--loss)';
            }
        }

        function loadAsset(idx) {
            cur = idx;
            audio.src = assets[cur].audio;
            document.getElementById('mainArt').style.backgroundImage = `url('${assets[cur].art}')`;
            document.getElementById('headerTag').innerText = `ASSET TRADING: ${assets[cur].name} // SOURCE: FIREBASE SECURE`;
            bouncePrice();
            audio.play().then(() => document.getElementById('playBtn').innerText = "⏸");
        }

        function toggleAudio() {
            if(audio.paused) { audio.play(); document.getElementById('playBtn').innerText = "⏸"; }
            else { audio.pause(); document.getElementById('playBtn').innerText = "▶"; }
        }

        function next() { cur = (cur + 1) % assets.length; loadAsset(cur); }

        assets.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'watch-item';
            div.onclick = () => loadAsset(index);
            div.innerHTML = `<span>${item.name}</span><span style="color:#ffd700">$${item.val}</span>`;
            document.getElementById('watchlist').appendChild(div);
        });

        setInterval(bouncePrice, 2000);
        window.onload = () => loadAsset(0);
    </script>
</body>
</html>
