<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MONEY MARKET // LIVE TERMINAL</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; text-transform: uppercase; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        .ticker-wrap { background: #000; border-bottom: 1px solid #333; height: 35px; overflow: hidden; display: flex; align-items: center; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 30s linear infinite; color: var(--gold); font-size: 0.85rem; }
        @keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        header { display: flex; justify-content: space-between; padding: 12px; background: var(--panel); border-bottom: 2px solid #333; font-size: 0.8rem; font-weight: bold; }

        .dashboard { display: flex; flex: 1; width: 100%; overflow: hidden; }
        #watchlist { width: 280px; min-width: 280px; border-right: 1px solid #333; overflow-y: auto; background: #080808; padding: 15px; }
        #market-core { flex: 1; overflow-y: auto; padding: 20px; border-right: 1px solid #333; min-width: 300px; display: flex; flex-direction: column; }
        #radio-desk { width: 380px; min-width: 380px; padding: 20px; background: #0a0a0a; display: flex; flex-direction: column; }

        .chart-container { background: #000; border: 1px solid #222; height: 250px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .grid-overlay { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size: 40px 40px; opacity: 0.3; }

        .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .data-card { background: #111; border: 1px solid #333; padding: 12px; text-align: center; font-size: 0.7rem; }

        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); margin-bottom: 15px; background-size: cover; background-position: center; background-color: #222; }
        .radio-controls { background: #151515; padding: 20px; border: 1px solid #333; text-align: center; }
        .oscillator-main { font-size: 2.8rem; color: white; margin: 10px 0; font-weight: 900; letter-spacing: -1px; }

        .account-btn { background: var(--gold); color: #000; font-weight: 900; border: none; padding: 12px; width: 100%; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-bottom: 15px; font-size: 0.8rem; }
        button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; cursor: pointer; font-family: inherit; font-size: 0.7rem; width: 100%; transition: 0.2s; }
        button:hover { background: var(--neon); color: black; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>

<audio id="main-audio-engine" loop autoplay></audio>

<div class="ticker-wrap"><div class="ticker-move" id="ticker-content">SYNCHRONIZING GLOBAL ASSETS...</div></div>

<header>
    <div>MUSIC MONEY MARKET // LIVE TERMINAL</div>
    <div id="sys-status">SYSTEM: BROADCASTING LIVE</div>
    <div style="color:var(--gold)">97.7 THE FLAME // LIVE</div>
</header>

<div class="dashboard">
    <aside id="watchlist"><div style="color:var(--gold); border-bottom:1px solid var(--gold); margin-bottom:15px;">ASSET WATCH</div><div id="list-target"></div></aside>
    
    <section id="market-core">
        <div class="chart-container">
            <div class="grid-overlay"></div>
            <svg width="100%" height="100%" viewBox="0 0 1000 250" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:rgba(0,255,0,0);" /><stop offset="100%" style="stop-color:var(--neon);" /></linearGradient>
                </defs>
                <path id="kinetic-line" d="" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />
                <circle id="pulse-head" r="5" fill="var(--neon)" style="filter: drop-shadow(0 0 8px var(--neon));" />
            </svg>
        </div>
        <div class="asset-grid" id="asset-cards"></div>
    </section>

    <aside id="radio-desk">
        <a href="https://gspotmusiccafe.wixsite.com/the-music-money-mark/groups" class="account-btn">OPEN TRADING ACCOUNT</a>
        <div class="album-art" id="art-frame"></div>
        <div class="radio-controls">
            <div id="radio-track" style="color:var(--gold); font-size: 0.9rem;">--</div>
            <div id="radio-roi" style="font-size:0.7rem; color:#888; margin-top:4px;">--% ROI</div>
            <div class="oscillator-main" id="main-osc">$0.00</div>
            <div class="btn-row">
                <button onclick="prevAsset()">⏮</button>
                <button onclick="playCurrent()">▶</button>
                <button onclick="nextAsset()">⏭</button>
            </div>
            <button onclick="sysNotify('EXECUTE')">BUY / SELL ASSET</button>
        </div>
    </aside>
</div>

<script>
    const assets = [
        { id: "A01", name: "SCENE BY SCENE", roi: 88.4, buy: 1.11, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a" },
        { id: "A02", name: "SUPERFLY", roi: 62.5, buy: 5.02, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293" },
        { id: "A03", name: "I GOT WHAT YOU NEED", roi: 95.1, buy: 3.52, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED%20COVER.png?alt=media&token=3188b436-bd97-4503-8e12-a1e33bdfd147", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/I%20GOT%20WHAT%20YOU%20NEED.mp3?alt=media&token=a5cf44ea-56ef-49f8-839c-0b9d2c3c250c" },
        { id: "A04", name: "ZODIAC SIGN", roi: 24.8, buy: 2.51, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN-J.%20MARIE.png?alt=media&token=763cef9d-c8dd-48ad-bc37-f701d1cf6a9a", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/ZODIAC%20SIGN.mp3?alt=media&token=915fde66-5e25-401e-ab03-61a0a5642630" }
    ];

    let currentIdx = 0;
    let points = [];
    let headY = 125;
    let velocity = 0;

    function init() {
        const list = document.getElementById('list-target');
        const cards = document.getElementById('asset-cards');
        let tickerText = "";
        
        assets.forEach((a, i) => {
            tickerText += `$${a.name} +${a.roi}% || `;
            list.innerHTML += `<div class="watch-item" onclick="sync(${i})">${a.name}<br><span style="color:white; font-size:0.65rem;">ROI: ${a.roi}%</span></div>`;
            cards.innerHTML += `<div class="data-card"><div style="color:var(--gold); margin-bottom:4px;">BUY: $${a.buy.toFixed(2)}</div><div>${a.name}</div><div id="card-osc-${a.id}" style="color:var(--neon); font-weight:bold; margin-top:4px;">$0.00</div></div>`;
        });
        document.getElementById('ticker-content').innerText = tickerText + " 97.7 THE FLAME BROADCASTING LIVE";

        for (let i = 0; i <= 40; i++) points.push({ x: (1000 / 40) * i, y: 125 });

        setInterval(updateLiquidChart, 35);
        setInterval(updatePrices, 900);
        
        sync(0); // Trigger auto-start
    }

    function updateLiquidChart() {
        velocity += (Math.random() - 0.5) * 5;
        velocity *= 0.9; headY += velocity;
        if (headY < 40 || headY > 210) velocity *= -1.2;
        for (let i = 0; i < points.length - 1; i++) points[i].y = points[i+1].y;
        points[points.length - 1].y = headY;
        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 0; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            d += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
        }
        document.getElementById('kinetic-line').setAttribute('d', d);
        document.getElementById('pulse-head').setAttribute('cx', points[points.length-1].x);
        document.getElementById('pulse-head').setAttribute('cy', points[points.length-1].y);
    }

    function updatePrices() {
        const a = assets[currentIdx];
        const drift = (Math.random() * 0.15).toFixed(2);
        document.getElementById('main-osc').innerText = `$${(a.buy + parseFloat(drift)).toFixed(2)}`;
        assets.forEach(asset => {
            const el = document.getElementById(`card-osc-${asset.id}`);
            const cardDrift = (Math.random() * 0.08).toFixed(2);
            if(el) el.innerText = `$${(asset.buy + parseFloat(cardDrift)).toFixed(2)}`;
        });
    }

    function sync(idx) {
        currentIdx = idx;
        const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('radio-roi').innerText = `${a.roi}% ROI`;
        document.getElementById('art-frame').style.backgroundImage = `url('${a.img}')`;
        const audio = document.getElementById('main-audio-engine');
        audio.src = a.audio;
        // The Autoplay Protocol
        audio.play().catch(() => {
            document.getElementById('sys-status').innerText = "TAP ANYWHERE TO UNMUTE BROADCAST";
            window.addEventListener('click', () => { audio.play(); document.getElementById('sys-status').innerText = "BROADCASTING LIVE"; }, { once: true });
        });
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
    function playCurrent() { sync(currentIdx); }
    function sysNotify(t) { document.getElementById('sys-status').innerText = `ORDER: ${t} REGISTERED`; setTimeout(() => document.getElementById('sys-status').innerText = "SYSTEM: BROADCASTING LIVE", 2000); }

    window.onload = init;
</script>
</body>
</html>
