<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MUSIC MONEY MARKET // QUEEN BUTTA EDITION</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; text-transform: uppercase; overflow: hidden; }
        body { display: flex; flex-direction: column; }

        header { padding: 10px 15px; background: var(--panel); border-bottom: 2px solid #333; }
        .head-top { display: flex; justify-content: space-between; align-items: center; }
        .ticker-bar { background: #000; padding: 5px 10px; border: 1px solid #222; margin-top: 5px; font-size: 0.7rem; display: flex; justify-content: space-between; }
        
        .dashboard { display: flex; flex: 1; width: 100%; overflow: hidden; }
        #watchlist { width: 260px; border-right: 1px solid #333; overflow-y: auto; background: #080808; padding: 12px; }
        #market-core { flex: 1; overflow-y: auto; padding: 12px; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        #radio-desk { width: 380px; padding: 15px; background: #0a0a0a; display: flex; flex-direction: column; }

        /* CANDLESTICK / CHART BOX */
        .chart-container { background: #000; border: 1px solid #333; height: 260px; position: relative; border-radius: 4px; overflow: hidden; }
        #volume-bars { position: absolute; bottom: 0; width: 100%; height: 80px; display: flex; align-items: flex-end; gap: 2px; padding: 0 5px; opacity: 0.4; }
        .v-bar { flex: 1; border-radius: 1px; transition: 0.2s; }

        /* STOCK OSCILLATOR VISUALS */
        .oscillator-main { font-size: 3.2rem; color: white; margin: 5px 0; font-weight: 900; letter-spacing: -2px; }
        .gain { color: var(--neon) !important; }
        .loss { color: var(--red) !important; }

        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 15px; }
        .radio-controls { background: #151515; padding: 20px; border: 1px solid #333; text-align: center; }

        .account-btn { background: var(--gold); color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; cursor: pointer; text-decoration: none; display: block; text-align: center; margin-bottom: 10px; font-size: 0.8rem; }
        .buy-sell-master { background: var(--cash); color: white; font-size: 0.9rem; padding: 18px; width: 100%; border: none; font-weight: bold; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        
        .watch-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.7rem; }
        .watch-item:hover { background: #111; }
        
        #order-flow { height: 140px; background: #080808; border: 1px solid #222; overflow: hidden; font-size: 0.6rem; padding: 10px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 5px; }

        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .gate-box { text-align: center; border: 3px solid var(--gold); padding: 40px; background: #0a0a0a; width: 400px; }
    </style>
</head>
<body>

<div id="init-overlay">
    <div class="gate-box">
        <h2 style="color:var(--gold); margin-top:0;">THE MUSIC MONEY MARKET</h2>
        <button class="account-btn" onclick="startEngine()">ENTER TRADING FLOOR</button>
    </div>
</div>

<header>
    <div class="head-top">
        <div style="font-weight:bold;">AITITRADE // SONGSHARE TERMINAL</div>
        <div style="color:var(--gold)">97.7 THE FLAME</div>
    </div>
    <div class="ticker-bar">
        <span>ASSET: QUEEN BUTTA COLLECTION</span>
        <span>MARKET: <span id="mkt-status" style="color:var(--neon)">● OPEN</span></span>
    </div>
</header>

<div class="dashboard">
    <aside id="watchlist">
        <div style="color:var(--gold); border-bottom:1px solid var(--gold); margin-bottom:10px; padding-bottom:5px;">MARKET LEDGER</div>
        <div id="list-target"></div>
    </aside>

    <section id="market-core">
        <div class="chart-container">
            <div id="volume-bars"></div>
            <svg width="100%" height="100%" viewBox="0 0 1000 300" preserveAspectRatio="none">
                <path id="kinetic-line" d="" fill="none" stroke="var(--neon)" stroke-width="4" />
                <circle id="pulse-head" r="8" fill="var(--neon)" />
            </svg>
        </div>
        <div id="order-flow"></div>
        <div class="ticker-bar" style="background:#111;">
            <span>TOKEN: $MMM (UPCOMING)</span>
            <span>PRICE: <span id="coin-price" style="color:var(--gold)">$0.00001000</span></span>
        </div>
    </section>

    <aside id="radio-desk">
        <a href="https://aitify-music-stream.replit.app/" target="_blank" class="account-btn">TRADE NOW ON DEX</a>
        <div class="album-art" id="art-frame"></div>
        <div class="radio-controls">
            <div id="radio-track" style="color:var(--gold); font-size: 0.8rem; margin-bottom:10px;">--</div>
            <div class="oscillator-main" id="main-osc">$1.00</div>
            <div id="price-arrow" style="font-size:1.2rem; font-weight:bold; margin-bottom:10px;">▲ +0.00</div>
            <a href="https://cash.app/$AITITRADEBROKERAGE" target="_blank" class="buy-sell-master" id="buy-btn">PURCHASE ORDER: $1.00</a>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button style="flex:1; background:transparent; border:1px solid var(--neon); color:var(--neon); padding:10px; cursor:pointer;" onclick="prevAsset()">⏮</button>
                <button style="flex:1; background:transparent; border:1px solid var(--neon); color:var(--neon); padding:10px; cursor:pointer;" onclick="nextAsset()">⏭</button>
            </div>
        </div>
    </aside>
</div>

<audio id="main-audio-engine" loop></audio>

<script>
    const assets = [
        { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FSUPERFLY.mp3?alt=media&token=e260aa5d-a3c9-453e-8b80-a466a6328906" },
        { name: "YOU'RE MY ADDICTION", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FYOU'RE%20MY%20ADDICTION.mp3?alt=media&token=ff95dd55-65a0-44c7-b9f4-9cd7ae2ce12c" },
        { name: "TIMES UP", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTIMES%20UP.mp3?alt=media&token=b582fd58-9511-447a-8986-b3dd9f720f2a" },
        { name: "LOVE MAKE OVER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLOVE%20MAKE%20OVER.mp3?alt=media&token=df587b6b-eed4-4f5b-b340-a5b5622efb31" },
        { name: "I'M NOT HER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI'M%20NOT%20HER.mp3?alt=media&token=e3ab1871-4af8-4e42-80e5-0e959a9647a1" },
        { name: "GANSTA CHICK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FGANSTA%20CHICK.mp3?alt=media&token=2b1859c4-a43d-4cc3-b121-5e06897ea7af" },
        { name: "IT'S FRIDAY NIGHT", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FIT'S%20FRIDAY%20NIGHT.mp3?alt=media&token=21b85403-a6dd-49d6-9a26-6514ed90eaa1" },
        { name: "HEARTBREAK MOTEL REMIX", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FHEARTBREAK%20MOTEL%20REMIX.mp3?alt=media&token=081a4e22-abb5-4045-a463-0f768dc9fb20" },
        { name: "LET'S GO BACK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLET'S%20GO%20BACK.mp3?alt=media&token=744a2807-2f51-4f4b-bef2-8d79e3e56be6" },
        { name: "I DESERVE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI%20DESERVE.mp3?alt=media&token=0bed5d76-783b-4ea4-9b12-9085d96bbf9c" },
        { name: "THAT GIRL FROM THE GHETTO", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTHAT%20GIRL%20FROM%20THE%20GHETTO.mp3?alt=media&token=a9f526a4-2567-4225-a8c2-dbac509f03de" },
        { name: "MIDNIGHT SMOKE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FMIDNIGHT%20SMOKE.mp3?alt=media&token=8ba90c94-61cf-4fce-84bc-6c8a0c6a0105" },
        { name: "BETTER THAN GOOD", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FBETTER%20THAN%20GOOD%20(1).mp3?alt=media&token=5b6a259d-7c57-4f1e-9c2d-121f9d3ee15a" }
    ];

    const queenImg = "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982";
    let currentIdx = 0; let points = []; let headY = 150; let velocity = 0; let engineStarted = false; let currentSongPrice = 1.00;

    function startEngine() {
        if (engineStarted) return;
        engineStarted = true;
        document.getElementById('init-overlay').style.display = 'none';
        
        const list = document.getElementById('list-target');
        const volBars = document.getElementById('volume-bars');
        
        assets.forEach((a, i) => {
            list.innerHTML += `<div class="watch-item" onclick="sync(${i})">${a.name}<br><span style="color:white; font-size:0.55rem;">MARKET: PRE-SALE</span></div>`;
        });

        for(let i=0; i<60; i++) {
            volBars.innerHTML += `<div class="v-bar" style="height:${10 + Math.random()*80}%; background:var(--neon); opacity:0.3;"></div>`;
        }
        for (let i = 0; i <= 50; i++) points.push({ x: (1000 / 50) * i, y: 150 });
        
        setInterval(updateChart, 40);
        setInterval(addTradeRow, 1500); 
        sync(0);
    }

    function addTradeRow() {
        const flow = document.getElementById('order-flow');
        const side = Math.random() > 0.4 ? "BUY" : "SELL";
        
        // PRICE MOVEMENT LOGIC: Rises with BUY orders
        const impact = (Math.random() * 0.40) + 0.10;
        if (side === "BUY") {
            currentSongPrice = Math.min(5.00, currentSongPrice + impact);
            velocity -= 15; // Pulse Chart Up
        } else {
            currentSongPrice = Math.max(1.00, currentSongPrice - (impact * 0.6));
            velocity += 12; // Pulse Chart Down
        }

        // Update UI
        const osc = document.getElementById('main-osc');
        const arrow = document.getElementById('price-arrow');
        osc.innerText = `$${currentSongPrice.toFixed(2)}`;
        
        if (side === "BUY") {
            osc.className = "oscillator-main gain";
            arrow.innerHTML = `▲ +${impact.toFixed(2)}`;
            arrow.className = "gain";
        } else {
            osc.className = "oscillator-main loss";
            arrow.innerHTML = `▼ -${(impact*0.6).toFixed(2)}`;
            arrow.className = "loss";
        }

        // Log Order
        const row = document.createElement('div');
        row.className = 'trade-row';
        row.style.color = side === "BUY" ? "var(--neon)" : "var(--red)";
        row.innerHTML = `<span>${side} SONGSHARE</span> <span>QTY: 1</span>`;
        flow.prepend(row);
        if(flow.children.length > 7) flow.removeChild(flow.lastChild);
        
        // Pulse Candles
        document.querySelectorAll('.v-bar').forEach(b => {
            b.style.height = (10 + Math.random()*80) + "%";
            b.style.background = side === "BUY" ? "var(--neon)" : "var(--red)";
            b.style.opacity = "0.5";
        });
    }

    function updateChart() {
        velocity *= 0.82; headY += velocity;
        
        // Trend Toward Price Level
        let targetY = 250 - ((currentSongPrice - 1) / 4 * 200);
        headY += (targetY - headY) * 0.05;

        if (headY < 40 || headY > 260) velocity *= -1.1;
        
        for (let i = 0; i < points.length - 1; i++) points[i].y = points[i+1].y;
        points[points.length - 1].y = headY;
        
        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 0; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            d += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
        }
        document.getElementById('kinetic-line').setAttribute('d', d);
        document.getElementById('pulse-head').setAttribute('cx', points[points.length-1].x);
        document.getElementById('pulse-head').setAttribute('cy', points[points.length-1].y);
    }

    function sync(idx) {
        currentIdx = idx; const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('art-frame').style.backgroundImage = `url('${queenImg}')`;
        document.getElementById('buy-btn').innerText = `PURCHASE ${a.name}: $1.00`;
        const audio = document.getElementById('main-audio-engine');
        audio.src = a.audio; audio.play().catch(() => {});
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
</script>
</body>
</html>
