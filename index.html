<!DOCTYPE html>
<html lang="en">
<head>

    <title>97.7 THE FLAME // QUEEN BUTTA SHOWCASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; --red: #ff3333; --cash: #00d632; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'JetBrains+Mono', monospace; text-transform: uppercase; overflow-x: hidden; }
        
        header { padding: 12px 20px; background: var(--panel); border-bottom: 2px solid #333; }
        .dashboard { display: grid; grid-template-columns: 350px 1fr 300px; height: calc(100vh - 60px); }

        @media (max-width: 1000px) {
            .dashboard { display: flex; flex-direction: column; height: auto; overflow-y: auto; }
            .side-col, .main-col { width: 100% !important; border: none; border-bottom: 2px solid #222; }
        }

        .side-col { background: #0a0a0a; border-right: 1px solid #333; overflow-y: auto; padding: 15px; }
        .main-col { background: var(--bg); border-right: 1px solid #333; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        /* THE CANDLESTICK CHART */
        .chart-box { background: #000; border: 1px solid #333; height: 280px; position: relative; border-radius: 4px; }
        #candle-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; z-index: 1; }
        .candle { width: 8px; border-radius: 1px; position: relative; }
        .wick { position: absolute; width: 2px; height: 140%; left: 3px; top: -20%; z-index: -1; }

        /* ORDER FLOW DATA */
        #order-flow { background: #080808; border: 1px solid #222; height: 200px; overflow: hidden; font-size: 0.65rem; padding: 10px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #111; padding-bottom: 2px; }

        /* VERTICAL LEDGER */
        .ledger-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border-bottom: 1px solid #222; cursor: pointer; }
        .ledger-row:hover { background: #111; border-left: 4px solid var(--gold); }

        .oscillator-main { font-size: 3.5rem; color: white; font-weight: 900; letter-spacing: -3px; line-height: 1; }
        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); background-size: cover; background-position: center; margin-bottom: 15px; }
        
        .btn-gold { background: var(--gold); color: #000; font-weight: 900; padding: 15px; width: 100%; text-align: center; text-decoration: none; border: none; display: block; margin-bottom: 10px; cursor: pointer; }
        .btn-cash { background: var(--cash); color: white; font-weight: 900; padding: 18px; width: 100%; text-align: center; text-decoration: none; border: none; display: block; font-size: 1.1rem; cursor: pointer; }
        
        #init-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
