        body {
            background-color: #000000;

            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* THE TICKER */
        .ticker-container {
            width: 100%;
            border-bottom: 2px solid #00FF41;
            padding: 10px 0;
            margin-bottom: 30px;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-text {
            display: inline-block;
            animation: scroll 20s linear infinite;
            font-weight: bold;
            font-size: 1.2em;
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* THE 3-WAY ENGAGEMENT PANEL */
        .market-panel {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-box {
            padding: 5px;
            transition: transform 0.2s;
        }

        .btn-box:hover {
            transform: scale(1.02);
        }

        /* $100 GOLD TIER */
        .partner-btn {
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.05);
        }

        /* $9.99 GREEN TIER */

            border: 2px solid #00FF41;
            background: #00FF41;
            color: #000000;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-weight: bold;
        }

        /* $1.00 WHITE TIER */
        .single-btn {
            border: 1px solid #FFFFFF;
            color: #FFFFFF;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 0.9em;
        }

        .ledger-info {
            margin-top: 40px;
            border: 1px solid #333;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>
