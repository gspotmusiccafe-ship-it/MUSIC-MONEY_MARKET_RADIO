<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MUSIC MONEY MARKET // EXCHANGE</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --red: #ff3333; --panel: #111; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; text-transform: uppercase; overflow-x: hidden; }
        
        header { padding: 10px; background: var(--panel); border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 1000; }
        .ticker-bar { background: #000; padding: 5px; border: 1px solid #222; margin-top: 5px; font-size: 0.65rem; display: flex; justify-content: space-between; }

        .dashboard { display: flex; flex-direction: column; width: 100%; min-height: 100vh; }
        #radio-desk { order: 1; padding: 15px; background: #0a0a0a; border-bottom: 3px solid #333; text-align: center; }
        #market-core { order: 2; padding: 15px; flex: 1; }
        
        .oscillator-main { font-size: 4.5rem; color: white; margin: 5px 0; font-weight: 900; transition: color 0.1s; }
        .roi-display { font-size: 1.2rem; color: var(--gold); margin-bottom: 10px; }

        /* ACTION BUTTONS */
        .gate-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-main { padding: 20px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; text-transform: uppercase; }
        .btn-invest { background: var(--neon); color: #000; box-shadow: 0 4px 0 #008a20; }
        .btn-liquidate { background: var(--red); color: white; box-shadow: 0 4px 0 #8a0000; }

        /* PAYMENT MODAL */
        #payment-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #111; border: 2px solid var(--gold); width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        .pay-option { display: block; padding: 15px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; text-decoration: none; font-size: 0.8rem; }
        .pay-option:hover { border-color: var(--neon); background: #000; }

        #order-flow { height: 180px; background: #000; font-size: 0.65rem; padding: 10px; border: 1px solid #333; overflow: hidden; margin-top: 15px; }
        .trade-row { display: flex; justify-content: space-between; margin-bottom: 5px; padding-bottom: 3px; border-bottom: 1px solid #111; }
        .market-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.6rem; padding: 10px; background: #111; border: 1px solid #222; }
        .album-art { width: 100%; aspect-ratio: 1; border: 2px solid var(--gold); margin: 0 auto 10px auto; background-size: cover; background-position: center; max-width: 250px; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:bold;">MUSIC MONEY MARKET</div>
        <div style="color:var(--gold); font-size:0.7rem;">97.7 THE FLAME</div>
    </div>
    <div class="ticker-bar">
        <span>MBBO STATUS: <span id="status-text">HUNTING</span></span>
        <span id="price-change">BOUNCE: 0%</span>
    </div>
</header>

<div id="payment-modal">
    <div class="modal-content">
        <h3 style="color:var(--gold); margin-top:0;">SELECT GATEWAY</h3>
        <a href="#" class="pay-option" id="link-cash">CASH APP</a>
        <a href="#" class="pay-option" id="link-paypal">PAYPAL</a>
        <a href="#" class="pay-option" id="link-stripe">STRIPE</a>
        <a href="#" class="pay-option" id="link-bnb">BNB (BEP-20)</a>
        <a href="#" class="pay-option" id="link-btc">BITCOIN</a>
        <button onclick="closeModal()" style="background:transparent; border:none; color:var(--red); margin-top:10px; cursor:pointer;">[ CANCEL ]</button>
    </div>
</div>

<div class="dashboard">
    <aside id="radio-desk">
        <div class="album-art" id="art-frame"></div>
        <div id="radio-track" style="color:var(--gold); font-size: 0.7rem;">--</div>
        <div class="oscillator-main" id="main-osc">$0.00</div>
        <div class="roi-display" id="roi-text">0% GAIN</div>
        
        <div class="gate-container">
            <button class="btn-main btn-invest" onclick="openModal()">INVEST</button>
            <button class="btn-main btn-liquidate" onclick="processLiquidate()">LIQUIDATE</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:15px;">
            <button style="flex:1; background:transparent; border:1px solid #444; color:white; padding:10px;" onclick="prevAsset()">⏮</button>
            <button style="flex:1; background:transparent; border:1px solid #444; color:white; padding:10px;" onclick="playCurrent()">▶</button>
            <button style="flex:1; background:transparent; border:1px solid #444; color:white; padding:10px;" onclick="nextAsset()">⏭</button>
        </div>
    </aside>

    <section id="market-core">
        <div class="market-stats">
            <div><div style="color:var(--gold)">115 BLOCK BUDGET</div><div>$1,000.00</div></div>
            <div style="text-align:right;"><div style="color:var(--gold)">MARKET SURPLUS</div><div>$478.00</div></div>
            <div><div style="color:var(--gold)">SETTLEMENT POOL</div><div>$522.00</div></div>
            <div style="text-align:right;"><div style="color:var(--gold)">QUEUE</div><div id="queue-count">0 / 115</div></div>
        </div>
        
        <div id="order-flow"></div>
    </section>
</div>

<audio id="main-audio-engine" onended="nextAsset()"></audio>

<script>
    const assets = [
        { name: "SCENE BY SCENE", base: 1.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE%20IMG.png?alt=media&token=2838e442-9b05-4704-a407-a209dd754d72", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SCENE%20BY%20SCENE.mp3?alt=media&token=647413ee-9384-4436-8f0c-9df717d1da0a" },
        { name: "SUPERFLY", base: 5.00, img: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY%20PNG.jpeg?alt=media&token=2441faff-08e2-45dd-b9ba-bdc5a3b6d2fc", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/SUPERFLY.mp3?alt=media&token=c5a7d3b4-dc94-4842-93ea-6d396e0fa293" }
    ];

    let _Q_COUNT = 0; 
    let currentIdx = 0;
    let lastBounce = 0;

    function init() {
        setInterval(marketPulse, 180); // Sporadic Bounce Speed
        sync(0);
    }

    function marketPulse() {
        const a = assets[currentIdx];
        // SPORADIC BOUNCE 0% to 100%
        let bounce = Math.random(); 
        let currentPrice = (a.base + (bounce * a.base)).toFixed(2);
        let roi = (bounce * 100).toFixed(0);

        const osc = document.getElementById('main-osc');
        osc.innerText = `$${currentPrice}`;
        document.getElementById('roi-text').innerText = `${roi}% POTENTIAL`;
        document.getElementById('price-change').innerText = `BOUNCE: ${roi}%`;

        // Color Logic: Higher ROI = Greener
        if (roi > 80) {
            osc.style.color = "var(--neon)";
            document.getElementById('status-text').innerText = "STRONG SELL";
        } else if (roi < 20) {
            osc.style.color = "var(--red)";
            document.getElementById('status-text').innerText = "STAGNANT";
        } else {
            osc.style.color = "white";
            document.getElementById('status-text').innerText = "HUNTING";
        }
        lastBounce = roi;
    }

    function processLiquidate() {
        const flow = document.getElementById('order-flow');
        const a = assets[currentIdx];
        _Q_COUNT++;
        
        let catchPrice = document.getElementById('main-osc').innerText;

        const row = document.createElement('div');
        row.className = 'trade-row';
        row.style.color = lastBounce > 70 ? "var(--neon)" : "white";
        row.innerHTML = `<span>Q:${_Q_COUNT}</span> <span>${a.name}</span> <span>CATCH: ${catchPrice}</span>`;
        
        flow.prepend(row);
        if(flow.children.length > 10) flow.removeChild(flow.lastChild);
        document.getElementById('queue-count').innerText = `${_Q_COUNT} / 115`;

        if (_Q_COUNT >= 115) {
            _Q_COUNT = 0;
            alert("115 BLOCK SETTLED. $478 SURPLUS REALIZED.");
        }
    }

    function openModal() { document.getElementById('payment-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('payment-modal').style.display = 'none'; }

    function sync(idx) {
        currentIdx = idx;
        const a = assets[idx];
        document.getElementById('radio-track').innerText = a.name;
        document.getElementById('art-frame').style.backgroundImage = `url('${a.img}')`;
        document.getElementById('main-audio-engine').src = a.audio;
        document.getElementById('main-audio-engine').play().catch(() => {});
    }

    function nextAsset() { currentIdx = (currentIdx + 1) % assets.length; sync(currentIdx); }
    function prevAsset() { currentIdx = (currentIdx - 1 + assets.length) % assets.length; sync(currentIdx); }
    function playCurrent() { document.getElementById('main-audio-engine').play(); }

    window.onload = init;
</script>
</body>
</html>
