<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97.7 THE FLAME // TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { 
            --bloomberg-blue: #0066ff;
            --bloomberg-green: #00ff33;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; text-transform: uppercase; }
        
        /* AUTH OVERLAY */
        #lock-screen { 
            position: fixed; inset: 0; background: #000; 
            z-index: 999999; display: flex; align-items: center; justify-content: center;
        }
        .glass-card { 
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); 
            padding: 40px; width: 400px; border-radius: 8px; text-align: center;
        }

        /* BLOOMBERG GLASS BUTTONS */
        .btn-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            color: #fff; font-weight: 800; padding: 16px; border-radius: 4px;
            display: block; text-align: center; transition: 0.2s; cursor: pointer; text-decoration: none; 
            width: 100%; margin-bottom: 10px; font-size: 11px; letter-spacing: 1px;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.15); border-color: #fff; transform: translateY(-1px); }
        .btn-blue { color: var(--bloomberg-blue); border-color: var(--bloomberg-blue); background: rgba(0,102,255,0.1); }
        .btn-green { color: var(--bloomberg-green); border-color: var(--bloomberg-green); }

        /* UI LAYOUT */
        #terminal-wrapper { display: none; height: 100vh; flex-direction: column; }
        #main-content { display: grid; grid-template-columns: 360px 1fr 340px; flex-grow: 1; overflow: hidden; }
        
        header { padding: 12px 25px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; font-size: 10px; font-family: 'JetBrains Mono'; background: #000; }
        .panel { background: #080808; border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        
        .ledger-row { padding: 14px; border-bottom: 1px solid #151515; cursor: pointer; display: flex; justify-content: space-between; font-size: 11px; color: #555; font-family: 'JetBrains Mono'; }
        .ledger-row:hover { color: #fff; background: rgba(255,255,255,0.02); }
        .playing { border-left: 3px solid var(--bloomberg-blue); color: #fff; background: rgba(0,102,255,0.08); }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="glass-card">
        <h1 class="text-2xl font-black mb-1">97.7 THE FLAME</h1>
        <p class="text-[9px] text-blue-500 font-bold tracking-[4px] mb-8">MUSIC MARKET TERMINAL</p>
        <input type="text" placeholder="TERMINAL_ID" class="mb-3 w-full bg-[#111] border border-[#222] p-4 text-sm outline-none">
        <input type="password" placeholder="ACCESS_KEY" class="mb-6 w-full bg-[#111] border border-[#222] p-4 text-sm outline-none">
        <button onclick="bootSystem()" class="btn-glass btn-blue !text-sm">INITIALIZE_SYSTEM</button>
    </div>
</div>

<div id="terminal-wrapper">
    <header>
        <div class="text-blue-500 font-bold">AITIFY // MUSIC MARKET APP ACCESS</div>
        <div class="text-green-500">● SYSTEM_STABLE_V4.25</div>
    </header>

    <div id="main-content">
        <div class="panel">
            <div id="art" class="w-full aspect-square bg-zinc-900 border border-zinc-800 mb-6 bg-cover bg-center" style="background-image: url('https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FQUEEN%20BUTTA%20PNG.jpeg?alt=media&token=57a0801b-1e48-41f6-9f93-b72964881982');"></div>
            
            <div class="p-5 bg-zinc-900/30 border border-zinc-800/50 rounded">
                <div id="active-title" class="text-center text-blue-500 font-mono text-[9px] mb-2 tracking-[2px]">---</div>
                <div class="text-center text-5xl font-black mb-1 tracking-tighter">$3.09</div>
                <div class="text-center text-green-500 text-[9px] font-bold mb-6">▲ KINETIC_GAINS</div>
                
                <div class="flex gap-2 mb-6">
                    <button onclick="toggleAudio()" id="p-btn" class="btn-glass !mb-0 flex-1">PAUSE</button>
                    <button onclick="stopAudio()" class="btn-glass !mb-0 flex-1">STOP</button>
                </div>

                <button onclick="window.open('https://aitify-music-stream.replit.app/', '_blank')" class="btn-glass">OPEN MARKET TERMINAL</button>
                <button onclick="window.open('https://cash.app/f/POOL?id=tgva6fj4', '_blank')" class="btn-glass btn-green">BUY SINGLE SONG $1.00</button>
                <button onclick="window.open('https://payhip.com/QUEENBUTTAMUSIC', '_blank')" class="btn-glass">BUY FULL ALBUM $9.99</button>
                <button onclick="window.open('https://cash.app/f/POOL?id=52fqk4xl', '_blank')" class="btn-glass btn-blue">SONGSHARE PARTNER $100</button>
            </div>
        </div>
        
        <div class="p-8">
            <div class="text-[9px] text-zinc-500 font-bold mb-4 tracking-widest">REAL-TIME_KINETIC_FLOW</div>
            <div class="h-64 border-b border-zinc-800 flex items-end gap-1" id="chart"></div>
        </div>

        <div class="panel" id="ledger">
            <div class="text-blue-500 font-bold text-[10px] mb-4 border-b border-blue-900/20 pb-2 font-mono">MARKET_LEDGER_SELECTOR</div>
            <div id="ledger-list"></div>
        </div>
    </div>
</div>

<audio id="engine"></audio>

<script>
    const playlist = [
        { name: "LOVE MAKE OVER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FLOVE%20MAKE%20OVER.mp3?alt=media&token=df587b6b-eed4-4f5b-b340-a5b5622efb31" },
        { name: "SUPERFLY", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FSUPERFLY.mp3?alt=media&token=e260aa5d-a3c9-453e-8b80-a466a6328906" },
        { name: "YOU'RE MY ADDICTION", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FYOU'RE%20MY%20ADDICTION.mp3?alt=media&token=ff95dd55-65a0-44c7-b9f4-9cd7ae2ce12c" },
        { name: "TIMES UP", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FTIMES%20UP.mp3?alt=media&token=b582fd58-9511-447a-8986-b3dd9f720f2a" },
        { name: "I'M NOT HER", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FI'M%20NOT%20HER.mp3?alt=media&token=e3ab1871-4af8-4e42-80e5-0e959a9647a1" },
        { name: "GANSTA CHICK", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FGANSTA%20CHICK.mp3?alt=media&token=2b1859c4-a43d-4cc3-b121-5e06897ea7af" },
        { name: "IT'S FRIDAY NIGHT", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FIT'S%20FRIDAY%20NIGHT.mp3?alt=media&token=21b85403-a6dd-49d6-9a26-6514ed90eaa1" },
        { name: "BLAME IT ON THE HUSTLE", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FBLAME%20IT%20ON%20THE%20HUSTLE.mp3?alt=media&token=60f15c10-e591-497d-b6a4-e757f49556bc" },
        { name: "HEARTBREAK MOTEL REMIX", audio: "https://firebasestorage.googleapis.com/v0/b/aititrade-radio-97.firebasestorage.app/o/QUEEN%20BUTTA%2FHEARTBREAK%20MOTEL%20REMIX.mp3?alt=media&token=081a4e22-abb5-4045-a463-0f768dc9fb20" }
    ];

    const audio = document.getElementById('engine');

    function bootSystem() {
        document.getElementById('lock-screen').remove();
        document.getElementById('terminal-wrapper').style.display = 'flex';
        
        const list = document.getElementById('ledger-list');
        playlist.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `ledger-row row-${i}`;
            row.innerHTML = `<span>${s.name}</span><span>$1.00</span>`;
            row.onclick = () => playSong(i);
            list.appendChild(row);
        });

        playSong(0);
        setInterval(() => {
            const bar = document.createElement('div');
            bar.className = Math.random() > 0.4 ? "bg-green-500 w-2" : "bg-red-500 w-2";
            bar.style.height = (Math.random() * 80 + 10) + "%";
            const chart = document.getElementById('chart');
            chart.appendChild(bar);
            if(chart.children.length > 50) chart.firstChild.remove();
        }, 1000);
    }

    function playSong(i) {
        document.getElementById('active-title').innerText = playlist[i].name;
        audio.src = playlist[i].audio;
        audio.play();
        document.querySelectorAll('.ledger-row').forEach(r => r.classList.remove('playing'));
        document.querySelector(`.row-${i}`).classList.add('playing');
        document.getElementById('p-btn').innerText = "PAUSE";
    }

    function toggleAudio() {
        if(audio.paused) { audio.play(); document.getElementById('p-btn').innerText = "PAUSE"; }
        else { audio.pause(); document.getElementById('p-btn').innerText = "PLAY"; }
    }
    function stopAudio() { audio.pause(); audio.currentTime = 0; document.getElementById('p-btn').innerText = "PLAY"; }
</script>
</body>
</html>
