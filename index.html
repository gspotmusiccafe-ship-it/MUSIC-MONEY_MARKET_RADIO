<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITITRADE | SINGLE PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --neon: #00ff41; --gold: #ffd700; --emerald: #062111; }
        
        body { 
            font-family: 'JetBrains+Mono', monospace; 
            background-color: #000; color: var(--neon); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 15px; text-transform: uppercase; 
        }
        
        .portal-container { 
            width: 100%; max-width: 410px; background: #000; border: 1px solid #222; 
            position: relative; box-shadow: 0 0 80px rgba(0, 255, 65, 0.1); 
        }

        .market-monitor { 
            padding: 25px; 
            background: linear-gradient(180deg, #000 0%, var(--emerald) 50%, #000 100%);
            border-top: 1px solid #111;
        }

        /* HIGH-END GLASS BUTTONS */
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 20px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 3px;
            transition: 0.4s;
            text-align: center;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }
        .glass-btn:hover {
            border-color: var(--neon);
            color: var(--neon);
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 25px rgba(0,255,65,0.3);
            transform: translateY(-1px);
        }

        .momentum-track { height: 2px; background: #080808; position: relative; margin: 10px 0; }
        .momentum-glow { 
            height: 100%; background: var(--neon); width: 0%; 
            transition: width 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            box-shadow: 0 0 15px var(--neon);
        }
    </style>
</head>
<body>

    </div>

                playBtn.innerText = "PAUSE AUDIO";
            }
            isPlaying = !isPlaying;
        }
