<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        .check { background: #fdfaf0; width: 360px; border: 2px solid #555; box-shadow: 0 10px 30px #000; overflow: hidden; }
        
        /* TOP HALF - THE CHECK */
        .top-section { padding: 20px; border-bottom: 2px solid #000; }
        .logo-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .art-box { width: 60px; height: 60px; border: 1px solid #000; background: #eee; }
        .check-title { font-size: 16px; font-weight: 900; }
        .field { margin: 10px 0; font-weight: bold; border-bottom: 1px solid #999; }
        .money-box { border: 2px solid #000; padding: 5px 10px; float: right; font-weight: bold; }

        /* BOTTOM HALF - RADIO STUB */
        .stub-section { background: #e0e0e0; padding: 15px; border-top: 3px dashed #777; text-align: center; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #000; background: #fff; cursor: pointer; font-size: 20px; margin: 10px; }
        #rights { display: block; padding: 12px; background: #008000; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="check">
        <div class="top-section">
            <div class="logo-row">
                <div class="art-box"><img src="" id="art" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="check-title">ROYALTY CHECK RADIO</div>
            </div>
            <div class="field">PAY TO: LICENSEE <span class="money-box">$862.00</span></div>
            <div class="field">MEMO: QUEEN BUTTA ROYALTIES</div>
        </div>
        <div class="stub-section">
            <div id="info" style="font-size: 12px; font-weight: bold;">ARTIST: QUEEN BUTTA | SONG: SUPERFLY | GENRE: R&B</div>
            <div style="font-size: 12px; margin: 5px 0;">LICENSE FEE: $30.00 MARKET PRICE</div>
            <button id="play-btn" class="play-btn">▶</button>
            <a id="rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="audio"></audio>
    <script>
        const audio = document.getElementById('audio'), btn = document.getElementById('play-btn'), info = document.getElementById('info');
        let m = null, idx = 0;
        fetch('radio-manifest.json').then(r => r.json()).then(d => { m = d; audio.src = d.playlist[0].src; document.getElementById('art').src = d.albumArt; });
        btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); btn.innerText = audio.paused ? '▶' : '❚❚'; };
        audio.onended = () => {
            idx++;
            if(idx < 12 && idx < m.playlist.length) { audio.src = m.playlist[idx].src; audio.play(); info.innerText = `ARTIST: ${m.artist} | SONG: ${m.playlist[idx].title} | GENRE: R&B`; }
            else { btn.innerHTML = '🔒'; btn.disabled = true; }
        };
    </script>
</body>
</html>
