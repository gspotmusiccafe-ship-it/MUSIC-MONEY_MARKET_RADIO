    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { 
            --bloomberg-blue: #0066ff;
            --bloomberg-green: #00ff33;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* THE NUCLEAR FIX: FULL OVERLAY WITH RIGID BUTTON */
        #landing-page { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; 
            display: flex; align-items: center; justify-content: center;
        }

        .login-box { 
            background: #0a0a0a; border: 1px solid #333; 
            padding: 40px; width: 400px; border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 102, 255, 0.2);
            text-align: center;
        }

        .input-terminal { 
            background: #111; border: 1px solid #222; color: #fff; 
            width: 100%; padding: 15px; margin-bottom: 12px; font-family: 'JetBrains Mono'; 
            font-size: 14px; outline: none; border-radius: 2px;
        }

        #init-btn {
            background: var(--bloomberg-blue);
            color: #fff; font-weight: 900; padding: 20px; width: 100%;
            border-radius: 2px; cursor: pointer; border: none;
            text-transform: uppercase; letter-spacing: 3px;
            font-size: 16px; margin-top: 10px;
            display: block; visibility: visible; opacity: 1;
        }
        #init-btn:hover { background: #0052cc; box-shadow: 0 0 20px var(--bloomberg-blue); }

        .dashboard { display: none; grid-template-columns: 350px 1fr 320px; height: 100vh; }
        .dashboard.active { display: grid; }
        
        .side { background: #080808; border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        header { padding: 12px 25px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; font-size: 11px; font-family: 'JetBrains Mono'; background: #000; }
        .ledger-row { padding: 15px; border-bottom: 1px solid #1a1a1a; cursor: pointer; display: flex; justify-content: space-between; font-size: 12px; color: #777; }
        .ledger-row:hover { color: #fff; background: rgba(0, 102, 255, 0.1); }
        .playing { border-left: 3px solid var(--bloomberg-blue); color: #fff; background: rgba(0, 102, 255, 0.05); }
    </style>
</head>
