<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AITIFY COMMAND CENTER // TERMINAL</title>
    <style>
        :root { --neon: #00ff00; --gold: #ffcc00; --bg: #050505; --panel: #111; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; text-transform: uppercase; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* High-End Header */
        header { display: flex; justify-content: space-between; padding: 15px; background: var(--panel); border-bottom: 2px solid #333; font-weight: bold; letter-spacing: 2px; }
        .market-status { color: white; }

        /* Main Workspace */
        main { display: flex; flex: 1; overflow: hidden; }
        
        /* Watchlist Ticker */
        #watchlist { width: 280px; border-right: 1px solid #333; padding: 10px; overflow-y: auto; background: #080808; }
        .ticker-item { border-bottom: 1px solid #222; padding: 8px 0; font-size: 0.75rem; }

        /* 4-Across Trading Portals */
        #grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; overflow-y: auto; }
        .portal { background: #151515; border: 1px solid #222; padding: 12px; position: relative; text-align: center; }
        .portal:hover { border-color: var(--gold); }
        
        /* MP3 Visual Area */
        .art-box { width: 100%; aspect-ratio: 1; background: #222; margin-bottom: 10px; border: 1px solid #333; position: relative; }
        .roi-tag { position: absolute; top: 0; right: 0; background: var(--gold); color: #000; padding: 2px 8px; font-weight: bold; font-size: 0.8rem; }
        
        /* The Bouncing Feed */
        .oscillator { color: white; font-size: 1.1rem; margin: 12px 0; font-weight: 900; }
        
        /* Interaction */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; cursor: pointer; font-family: inherit; font-size: 0.7rem; }
        button.priority { border-color: var(--gold); color: var(--gold); }
        button:active { background: var(--neon); color: black; }
    </style>
</head>
<body>

<header>
    <div>AITIFY // GLOBAL EXCHANGE</div>
    <div class="market-status">SYSTEM STATUS: <span id="status-text">MONITORING FEED...</span></div>
    <div id="radio-feed" style="color: var(--gold);">97.7 THE FLAME // LIVE</div>
</header>

<main>
    <div id="watchlist">
        <div style="color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 5px; margin-bottom: 10px;">ASSET WATCHLIST</div>
        </div>

    <div id="grid">
        </div>
</main>

<script>
    // Hidden Data Structure
    const assets = [
        { id: "A01", name: "MARIE: SCENE BY SCENE", roi: "15%", buy: "1.00" },
        { id: "A02", name: "CAN'T FOLLOW THROUGH", roi: "35%", buy: "5.00" },
        { id: "A03", name: "MARIE: QUEEN BEE", roi: "50%", buy: "10.00" },
        { id: "A04", name: "SMOOTH: GOT WHAT YOU NEED", roi: "85%", buy: "20.00" },
        { id: "A05", name: "SMOOTH: PLAYGROUND", roi: "94%", buy: "50.00" }
        // System handles the rest of the 101...
    ];

    const grid = document.getElementById('grid');
    const watchlist = document.getElementById('watchlist');

    assets.forEach(asset => {
        // Create the Watchlist entry
        const item = document.createElement('div');
        item.className = 'ticker-item';
        item.innerHTML = `<span>${asset.id}</span> | <span>${asset.name}</span><br><span style="color:white">YIELD: ${asset.roi}</span>`;
        watchlist.appendChild(item);

        // Create the Portal
        const portal = document.createElement('div');
        portal.className = 'portal';
        portal.innerHTML = `
            <div class="art-box"><div class="roi-tag">${asset.roi} ROI</div></div>
            <div style="font-size: 0.65rem; height: 20px; overflow: hidden;">${asset.name}</div>
            <div class="oscillator" id="osc-${asset.id}">$0.00</div>
            <div class="controls">
                <button onclick="sysNotify('${asset.id}', 'REG')">EXECUTE $${asset.buy}</button>
                <button class="priority" onclick="sysNotify('${asset.id}', 'PRIO')">DISCOUNT</button>
            </div>
        `;
        grid.appendChild(portal);

        // Start the Market Breath (The Oscillator)
        setInterval(() => {
            const val = (Math.random()).toFixed(2);
            document.getElementById(`osc-${asset.id}`).innerText = `$${val}`;
        }, 1200 + (Math.random() * 1000));
    });

    // Hidden Alert System - "The Who and The What"
    function sysNotify(assetId, type) {
        document.getElementById('status-text').innerText = `ALERT: ${type} ORDER RECEIVED // ASSET ${assetId}`;
        setTimeout(() => {
            document.getElementById('status-text').innerText = "MONITORING FEED...";
        }, 3000);
        
        // Backend handles the math/FIFO/Settlement silently
    }
</script>

</body>
</html>
