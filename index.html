<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; }
        .check-container { background: #fdfaf0; width: 360px; border: 12px solid #555; padding: 10px; box-shadow: 0 10px 30px #000; }
        .check-top { border: 2px solid #000; padding: 15px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-weight: bold; }
        .money-box { border: 2px solid #000; padding: 5px; font-weight: bold; }
        .stub { background: #e0e0e0; padding: 15px; border-top: 3px dashed #777; text-align: center; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #000; background: #fff; cursor: pointer; font-size: 20px; margin: 10px; }
        #rights { display: block; padding: 12px; background: #008000; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="check-container">
        <div class="check-top">
            <div class="row">
                <div style="width: 50px; height: 50px; border: 1px solid #000;"><img id="art" src="" style="width:100%;height:100%"></div>
                <div style="font-weight:900;">ROYALTY CHECK RADIO</div>
            </div>
            <div class="row">PAY TO: LICENSEE <span class="money-box" id="money">$862.00</span></div>
            <div class="row">MEMO: QUEEN BUTTA ROYALTIES</div>
        </div>
        <div class="stub">
            <div id="info" style="font-size: 11px; font-weight: bold;">ARTIST: QUEEN BUTTA | SONG: SUPERFLY | GENRE: R&B</div>
            <div style="margin: 10px 0; font-weight: bold;">LICENSE FEE: MARKET PRICE <span id="market-price" style="padding: 3px; border: 1px solid #000;">$30.00</span> <span id="gain-loss"></span></div>
            <button id="play-btn" class="play-btn">▶</button>
            <a id="rights" href="https://the-music-market-exchange-746485168146.us-west2.run.app/?ref=aititrade2026&portal=0">RIGHTS & ROYALTIES</a>
        </div>
    </div>
    <audio id="audio"></audio>
    <script>
        const audio = document.getElementById('audio'), btn = document.getElementById('play-btn'), info = document.getElementById('info'), moneyBox = document.getElementById('money'), marketPrice = document.getElementById('market-price'), gainLoss = document.getElementById('gain-loss');
        let m = null, idx = 0;
        fetch('radio-manifest.json').then(r => r.json()).then(d => { m = d; audio.src = d.playlist[0].src; document.getElementById('art').src = d.albumArt; });
        btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); btn.innerText = audio.paused ? '▶' : '❚❚'; };
        setInterval(() => {
            moneyBox.innerText = '$' + (Math.floor(Math.random() * 900) + 100) + '.00';
            let newPrice = (Math.random() * 28 + 2).toFixed(2);
            let change = (Math.random() * 2 - 1).toFixed(2);
            marketPrice.innerText = '$' + newPrice;
            gainLoss.innerText = (change >= 0 ? "+" : "") + change;
            gainLoss.style.color = change >= 0 ? "#008000" : "#ff0000";
        }, 1000);
        audio.onended = () => {
            idx++;
            if(idx < 12 && idx < m.playlist.length) { audio.src = m.playlist[idx].src; audio.play(); info.innerText = `ARTIST: ${m.artist} | SONG: ${m.playlist[idx].title} | GENRE: R&B`; }
            else { btn.innerHTML = '🔒'; btn.disabled = true; }
        };
    </script>
</body>
</html>
